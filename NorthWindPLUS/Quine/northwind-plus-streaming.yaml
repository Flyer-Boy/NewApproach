# Quick queries: right-click a node in the Exploration UI. One pivot per
# question a person following the story would ask of that node.
quickQueries:
  - predicate: { propertyKeys: [], knownValues: {} }
    quickQuery:
      name: Adjacent Nodes
      querySuffix: MATCH (n)--(m) RETURN DISTINCT m
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {} }
    quickQuery:
      name: Which Collection is this in? (its state)
      querySuffix: MATCH (n)<-[:CONTAINS]-(c:Collection) RETURN c
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Collection }
    quickQuery:
      name: Members of this Collection
      querySuffix: MATCH (n)-[:CONTAINS]->(m) RETURN m
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Collection }
    quickQuery:
      name: How many members?
      querySuffix: MATCH (n)-[:CONTAINS]->(m) RETURN n.name AS collection, count(m) AS members
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: Isotopes (stock, threshold, on order)
      querySuffix: MATCH (n)-[:HAS_INVENTORY_LEVEL|HAS_REORDER_LEVEL|HAS_SUPPLY_ORDER]->(m) RETURN m
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: The 3 supplier offers, right now
      querySuffix: MATCH (n)-[:HAS_OFFER]->(o)-[:FROM_SUPPLIER]->(s) RETURN s.CompanyName AS supplier, o.UnitCost AS unitCost, o.UnitsAvailable AS available, o.MinOrderQty AS minLot, o.LeadTimeDays AS leadDays ORDER BY unitCost
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: Offers + suppliers (graph)
      querySuffix: MATCH (n)-[:HAS_OFFER]->(o)-[:FROM_SUPPLIER]->(s) RETURN o, s
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: What the twin recommended for this product
      querySuffix: MATCH (n)<-[:FOR_PRODUCT]-(rec:PurchaseRecommendation) OPTIONAL MATCH (rec)<-[:FROM_RECOMMENDATION]-(po) RETURN rec, po
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: Open orders waiting on this product
      querySuffix: MATCH (n)<-[:FOR_PRODUCT]-(l)<-[:HAS_ORDER_LINE]-(o)<-[:CONTAINS]-(c:Collection) WHERE c.name IN ["OpenOrders", "BackOrders"] RETURN o
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseRecommendation }
    quickQuery:
      name: Product, chosen supplier, offer, resulting PO
      querySuffix: MATCH (n)-[:FOR_PRODUCT|RECOMMENDS_SUPPLIER|BASED_ON_OFFER]->(m) OPTIONAL MATCH (n)<-[:FROM_RECOMMENDATION]-(po) RETURN m, po
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: PO lineage (rejections it descends from)
      querySuffix: MATCH (n)-[:HAS_PREVIOUS_PO*0..]->(m) RETURN m
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: The whole PO story (line, product, supplier, RFQ, delivery, invoice, people)
      querySuffix: MATCH (n)-[]->(m) WHERE NOT m:Collection OPTIONAL MATCH (n)-[:HAS_PO_LINE]->(l)-[:FOR_PRODUCT]->(p) OPTIONAL MATCH (n)-[:HAS_APPROVED_RFQ]->(rfq)-[:HAS_RFQ_LINE]->(rl) RETURN m, p, rl
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: Who touched this PO
      querySuffix: MATCH (n)-[r]->(e:Employee)-[:HAS_ROLE]->(role) RETURN type(r) AS action, e.Name AS who, role.Title AS role, role.ApprovalLimit AS approvalLimit
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Order }
    quickQuery:
      name: Lines, products, customer, rep
      querySuffix: MATCH (n)-[:HAS_ORDER_LINE]->(l)-[:FOR_PRODUCT]->(p) OPTIONAL MATCH (n)-[:HAS_ORDER_CUSTOMER|SOLD_BY|SHIPPED_VIA|FULFILLED_BY]->(m) RETURN l, p, m
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Order }
    quickQuery:
      name: Can it ship? (line vs stock)
      querySuffix: MATCH (n)-[:HAS_ORDER_LINE]->(l)-[:FOR_PRODUCT]->(p)-[:HAS_INVENTORY_LEVEL]->(inv) RETURN p.ProductName AS product, l.Quantity AS ordered, inv.UnitsInStock AS inStock, CASE WHEN l.Quantity > inv.UnitsInStock THEN "SHORT" ELSE "ok" END AS status
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Customer }
    quickQuery:
      name: Orders + spend isotope
      querySuffix: MATCH (n)<-[:HAS_ORDER_CUSTOMER]-(o) OPTIONAL MATCH (n)-[:HAS_SPEND]->(cs) RETURN o, cs
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Customer }
    quickQuery:
      name: Customer 360 (table)
      querySuffix: MATCH (n)-[:HAS_SPEND]->(cs) OPTIONAL MATCH (n)<-[:CONTAINS]-(tier:Collection) OPTIONAL MATCH (n)<-[:HAS_ORDER_CUSTOMER]-(o)<-[:CONTAINS]-(st:Collection) RETURN n.CompanyName AS customer, cs.DaySpend AS spendToday, cs.OrdersShipped AS shipped, coalesce(tier.name, "Standard") AS tier, collect(DISTINCT st.name) AS orderStates
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Supplier }
    quickQuery:
      name: Scorecard + offers + POs
      querySuffix: MATCH (n)-[:HAS_SCORECARD]->(sc) OPTIONAL MATCH (n)<-[:FROM_SUPPLIER]-(o) OPTIONAL MATCH (n)<-[:PO_SUPPLIER]-(po) RETURN sc, o, po
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Supplier }
    quickQuery:
      name: What we owe this supplier
      querySuffix: MATCH (n)<-[:PAYABLE_TO]-(inv)<-[:CONTAINS]-(c:Collection) RETURN inv.InvoiceNumber AS invoice, inv.Amount AS amount, c.name AS state
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Invoice }
    quickQuery:
      name: The PO and supplier behind it
      querySuffix: MATCH (n)<-[:HAS_INVOICE]-(po) MATCH (n)-[:PAYABLE_TO]->(s) RETURN po, s
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Employee }
    quickQuery:
      name: Everything this person touched
      querySuffix: MATCH (n)<-[r]-(m) RETURN m
      sort: NODE

# Sample queries: the drop-down on the search bar. In story order.
sampleQueries:
  - name: "1 · START HERE — the 14 state Collections (the business's state machine)"
    query: |-
      MATCH (c:Collection) RETURN c
  - name: "2 · Where is everything right now? (members per Collection)"
    query: |-
      MATCH (c:Collection)
      OPTIONAL MATCH (c)-[:CONTAINS]->(m)
      RETURN c.name AS state, count(m) AS members
      ORDER BY members DESC
  - name: "3 · Inventory dashboard, live (the article's report — but it changes while you watch)"
    query: |-
      MATCH (p:Product)-[:HAS_INVENTORY_LEVEL]->(inv), (p)-[:HAS_REORDER_LEVEL]->(rl), (p)-[:HAS_SUPPLY_ORDER]->(suo)
      OPTIONAL MATCH (p)<-[:CONTAINS]-(st:Collection)
      RETURN p.ProductName AS product, inv.UnitsInStock AS inStock, rl.StockThreshold AS threshold,
             suo.UnitsOnOrder AS onOrder, collect(st.name) AS state
      ORDER BY inStock ASC
  - name: "4 · The supplier market right now (3 offers per product, re-pricing every tick)"
    query: |-
      MATCH (p:Product)-[:HAS_OFFER]->(o)-[:FROM_SUPPLIER]->(s)
      RETURN p.ProductName AS product, s.CompanyName AS supplier, o.UnitCost AS unitCost,
             o.UnitsAvailable AS available, o.MinOrderQty AS minLot, o.UpdatedAtTick AS updatedAtTick
      ORDER BY product, unitCost
  - name: "5 · What the twin recommended, and whether procurement acted on it"
    query: |-
      MATCH (c:Collection)-[:CONTAINS]->(rec:PurchaseRecommendation)-[:FOR_PRODUCT]->(p), (rec)-[:RECOMMENDS_SUPPLIER]->(s)
      OPTIONAL MATCH (rec)<-[:FROM_RECOMMENDATION]-(po)
      RETURN rec.RecNumber AS recommendation, p.ProductName AS product, rec.Qty AS qty, s.CompanyName AS supplier,
             rec.UnitCost AS unitCost, rec.EstimatedCost AS estCost, c.name AS state, po.PONumber AS raisedPO
      ORDER BY recommendation
  - name: "6 · A recommendation on the canvas: product, offers, chosen supplier, the PO it became"
    query: |-
      MATCH (c:Collection {name: "ActionedPurchases"})-[:CONTAINS]->(rec)-[:FOR_PRODUCT]->(p)-[:HAS_OFFER]->(o)-[:FROM_SUPPLIER]->(s)
      MATCH (rec)-[:RECOMMENDS_SUPPLIER]->(chosen)
      OPTIONAL MATCH (rec)<-[:FROM_RECOMMENDATION]-(po)
      RETURN rec, p, o, s, chosen, po LIMIT 40
  - name: "7 · Purchase orders by state"
    query: |-
      MATCH (c:Collection)-[:CONTAINS]->(po:PurchaseOrder)
      RETURN c.name AS state, count(po) AS POs, collect(po.PONumber) AS which
      ORDER BY POs DESC
  - name: "8 · Rejected → resubmitted → closed: the lineage the graph kept (rule 4)"
    query: |-
      MATCH (rej:Collection {name: "RejectedPoS"})-[:CONTAINS]->(orig:PurchaseOrder)<-[:HAS_PREVIOUS_PO]-(resub)<-[:CONTAINS]-(now:Collection)
      MATCH (orig)-[:REJECTED_L1_BY]->(l1), (resub)-[:VETTED_L2_BY]->(l2)
      MATCH (orig)-[:HAS_PO_LINE]->(line)-[:FOR_PRODUCT]->(p)
      RETURN rej, orig, resub, now, l1, l2, line, p LIMIT 60
  - name: "9 · Back orders right now, and what they are waiting on"
    query: |-
      MATCH (bo:Collection {name: "BackOrders"})-[:CONTAINS]->(o)-[:HAS_ORDER_CUSTOMER]->(c)
      MATCH (o)-[:HAS_ORDER_LINE]->(l)-[:FOR_PRODUCT]->(p)-[:HAS_INVENTORY_LEVEL]->(inv)
      WHERE l.Quantity > inv.UnitsInStock
      OPTIONAL MATCH (p)-[:HAS_SUPPLY_ORDER]->(suo)
      RETURN o.OrderID AS order, c.CompanyName AS customer, p.ProductName AS waitingOn,
             l.Quantity AS needs, inv.UnitsInStock AS inStock, suo.UnitsOnOrder AS onOrder
  - name: "10 · Payables the twin booked (invoice per closed PO)"
    query: |-
      MATCH (pay:Collection {name: "PayablesDue"})-[:CONTAINS]->(inv:Invoice)-[:PAYABLE_TO]->(s)
      MATCH (inv)<-[:HAS_INVOICE]-(po)
      RETURN inv.InvoiceNumber AS invoice, po.PONumber AS po, s.CompanyName AS supplier, inv.Amount AS amount, inv.DueInDays AS dueInDays
      ORDER BY invoice
  - name: "11 · Supplier scorecard (what automation 1 reads when it chooses)"
    query: |-
      MATCH (s:Supplier)-[:HAS_SCORECARD]->(sc)
      OPTIONAL MATCH (s)<-[:PAYABLE_TO]-(inv)
      RETURN s.CompanyName AS supplier, sc.POsClosed AS POsClosed, sc.UnitsDelivered AS unitsDelivered,
             sc.Resubmissions AS resubmissions, round(coalesce(sum(inv.Amount), 0) * 100) / 100 AS owed
      ORDER BY POsClosed DESC
  - name: "12 · Customer 360 — spend today, orders shipped, tier"
    query: |-
      MATCH (c:Customer)-[:HAS_SPEND]->(cs)
      OPTIONAL MATCH (c)<-[:CONTAINS]-(tier:Collection)
      RETURN c.CompanyName AS customer, round(cs.DaySpend * 100) / 100 AS spendToday, cs.OrdersShipped AS shipped,
             coalesce(tier.name, "Standard") AS tier
      ORDER BY spendToday DESC
  - name: "13 · The whole life of one order (graph): the most recently shipped one"
    query: |-
      MATCH (sh:Collection {name: "ShippedOrders"})-[:CONTAINS]->(o)
      WITH o ORDER BY o.Tick DESC LIMIT 1
      MATCH (o)-[]->(m)
      OPTIONAL MATCH (o)-[:HAS_ORDER_LINE]->(l)-[:FOR_PRODUCT]->(p)-[:HAS_INVENTORY_LEVEL]->(inv)
      RETURN o, m, p, inv
  - name: "14 · Who did what on a closed PO (people + roles)"
    query: |-
      MATCH (c:Collection {name: "ClosedPoS"})-[:CONTAINS]->(po:PurchaseOrder)-[rel]->(e:Employee)-[:HAS_ROLE]->(r)
      RETURN po, e, r LIMIT 40
  - name: "15 · Live graph around the NewPoS collection (what procurement just raised)"
    query: |-
      MATCH (c:Collection {name: "NewPoS"})-[:CONTAINS]->(po)-[:HAS_PO_LINE]->(l)-[:FOR_PRODUCT]->(p)
      OPTIONAL MATCH (po)-[:PO_SUPPLIER]->(s)
      RETURN c, po, l, p, s LIMIT 60

statusQuery:
  cypherQuery: |-
    MATCH (c:Collection {name: "OpenOrders"})-[:CONTAINS]->(o)
    RETURN count(o) AS openOrders
