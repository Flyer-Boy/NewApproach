# Quick queries: right-click a node in the Exploration UI.
quickQueries:
  - predicate: { propertyKeys: [], knownValues: {} }
    quickQuery:
      name: "Adjacent Nodes"
      querySuffix: "MATCH (n)--(m) RETURN DISTINCT m LIMIT 200"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {} }
    quickQuery:
      name: "Its state: the Collections it is a member of"
      querySuffix: "MATCH (n)<-[r]-(c) WHERE type(r) STARTS WITH \"IS_\" RETURN c"
      sort: NODE
  - predicate: { propertyKeys: [Name], knownValues: {} }
    quickQuery:
      name: "Members of this Collection"
      querySuffix: "MATCH (n)-[r]->(m) WHERE type(r) STARTS WITH \"IS_\" RETURN m LIMIT 200"
      sort: NODE
  - predicate: { propertyKeys: [Name], knownValues: {} }
    quickQuery:
      name: "How many members?"
      querySuffix: "MATCH (n)-[r]->(m) WHERE type(r) STARTS WITH \"IS_\" RETURN n.Name AS collection, type(r) AS state, count(m) AS members"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: "Isotopes (stock, threshold, on order)"
      querySuffix: "MATCH (n)-[:HAS_INVENTORY_LEVEL|HAS_REORDER_LEVEL|HAS_SUPPLY_ORDER]->(m) RETURN m"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: "Reorder rule right now (would it reorder? how much?)"
      querySuffix: "MATCH (n)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (n)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel), (n)-[:HAS_SUPPLY_ORDER]->(suo) OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(a:PurchaseOrder)-[:HAS_PO_ITEM]->(q:POItem)-[:PO_ITEM_PRODUCT]->(n) WHERE NOT (a)-[:HAS_WAREHOUSE_DELIVERY]->() WITH n, r, i, suo, sum(coalesce(q.POqt, 0)) AS pending OPTIONAL MATCH (n)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-() WITH n, r, i, suo, pending, sum(coalesce(oi.Quantity, 0)) AS openQty OPTIONAL MATCH (ls:LowStocK)-[low:IS_LOW_STOCK_PRODUCT]->(n) RETURN n.ProductName AS product, i.UnitsInStock AS inStock, pending AS onActivePOs, openQty AS openOrderQty, suo.UnitsOnOrder AS unitsOnOrder, r.StockThreshold AS threshold, i.UnitsInStock + pending - openQty - (r.StockThreshold * 0.5) <= r.StockThreshold AS wouldReorder, r.StockThreshold - (i.UnitsInStock + pending - openQty) + (r.StockThreshold * 2) AS wouldOrderQty, low IS NOT NULL AS inLowStock"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: "Open orders waiting on this product"
      querySuffix: "MATCH (n)<-[:ORDER_ITEM_PRODUCT]-(:OrderItem)<-[:HAS_ORDER_ITEM]-(o:Order)<-[:IS_OPEN_ORDER_STATE]-() RETURN DISTINCT o"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Product }
    quickQuery:
      name: "Its Purchase Orders and their state"
      querySuffix: "MATCH (n)<-[:PO_ITEM_PRODUCT]-(it:POItem)<-[:HAS_PO_ITEM]-(po:PurchaseOrder)<-[r]-(st) WHERE type(r) IN [\"IS_NEW_PO_STATE\", \"IS_APPROVED_PO_STATE\", \"IS_SUBMITTED_PO_STATE\", \"IS_REJECTED_PO_STATE\", \"IS_CLOSED_PO_STATE\"] RETURN po.PONumber AS po, labels(st)[0] AS state, it.POqt AS qty, po.PODate AS created ORDER BY created DESC"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: "The whole PO story (everything within 3 hops, orders left out)"
      querySuffix: "MATCH (n)-[*1..3]-(m) WITH n, m WHERE NOT \"Order\" IN labels(m) AND NOT \"OrderItem\" IN labels(m) RETURN DISTINCT m LIMIT 300"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: "Vetting trail (who decided what, when, why)"
      querySuffix: "MATCH (n)-[r]->(d:VettingDecision)-[:VETTED_BY]->(e:Employee)<-[:IS_ACTIVE_ROLE]-(role) RETURN type(r) AS decision, d.Date AS date, e.Email AS employee, role.Title AS role, d.Comment AS comment ORDER BY date"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: "Items and cost (budget at the negotiated discount)"
      querySuffix: "MATCH (n)-[:HAS_PO_ITEM]->(it:POItem)-[:PO_ITEM_PRODUCT]->(p:Product) RETURN p.ProductName AS product, it.POqt AS qty, p.UnitPrice AS unitPrice, it.POPriceDiscount AS discountFactor, round(it.POqt * p.UnitPrice * it.POPriceDiscount, 2) AS lineBudget"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: "PO lineage (the rejected POs it re-orders)"
      querySuffix: "MATCH (n)-[:HAS_PREVIOUS_PO*0..]->(m) OPTIONAL MATCH (m)-[:HAS_RESUBMISSION_NOTE]->(note) RETURN m, note"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: PurchaseOrder }
    quickQuery:
      name: "Its RFQs: quoted vs budget, and their fate"
      querySuffix: "MATCH (rfq:RFQ)-[:IS_RFQ_FOR_PO]->(n) MATCH (rfq)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p:Product)<-[:PO_ITEM_PRODUCT]-(poi:POItem)<-[:HAS_PO_ITEM]-(n) OPTIONAL MATCH (rfq)-[d:HAS_BUYER_RFQ_APPROVAL|HAS_BUYER_RFQ_REJECTION]->(v) RETURN rfq.RFQNumber AS rfq, rfq.RFQDate AS date, round(sum(rfi.RFQqt * rfi.RFQcost), 2) AS quoted, round(sum(poi.POqt * p.UnitPrice * poi.POPriceDiscount), 2) AS budget, collect(DISTINCT type(d)) AS decision, collect(DISTINCT v.Comment) AS comment ORDER BY date"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: RFQ }
    quickQuery:
      name: "Lines: quoted vs PO budget"
      querySuffix: "MATCH (n)-[:IS_RFQ_FOR_PO]->(po:PurchaseOrder) MATCH (n)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p:Product)<-[:PO_ITEM_PRODUCT]-(poi:POItem)<-[:HAS_PO_ITEM]-(po) RETURN p.ProductName AS product, rfi.RFQqt AS qty, round(rfi.RFQcost, 2) AS quotedUnitCost, round(p.UnitPrice * poi.POPriceDiscount, 2) AS budgetUnitCost, rfi.RFQqt * rfi.RFQcost > poi.POqt * p.UnitPrice * poi.POPriceDiscount AS overBudget"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Order }
    quickQuery:
      name: "Lines, products, customer, sales rep, shipment"
      querySuffix: "MATCH (n)-[:HAS_ORDER_ITEM]->(l)-[:ORDER_ITEM_PRODUCT]->(p) OPTIONAL MATCH (n)-[:HAS_ORDER_CUSTOMER|SOLD_BY|HAS_SHIPMENT_INFO|HAS_WAREHOUSE_FULFILLMENT]->(m) RETURN l, p, m"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Order }
    quickQuery:
      name: "Can it ship? (each line vs stock)"
      querySuffix: "MATCH (n)-[:HAS_ORDER_ITEM]->(l:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv) RETURN p.ProductName AS product, l.Quantity AS ordered, inv.UnitsInStock AS inStock, CASE WHEN inv.UnitsInStock > l.Quantity THEN \"ok\" ELSE \"SHORT\" END AS status"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Customer }
    quickQuery:
      name: "Orders and their state"
      querySuffix: "MATCH (n)<-[:HAS_ORDER_CUSTOMER]-(o:Order) OPTIONAL MATCH (o)<-[r]-(st) WHERE type(r) IN [\"IS_OPEN_ORDER_STATE\", \"IS_FULFILLED_ORDER_STATE\"] RETURN o, st LIMIT 200"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Customer }
    quickQuery:
      name: "Product recommendations (same category, bought by others)"
      querySuffix: "MATCH (n)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)<-[:ORDER_ITEM_PRODUCT]-(:OrderItem)<-[:HAS_ORDER_ITEM]-(o2:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p2:Product)<-[:IS_PRODUCT_CATEGORY_OF]-(:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p) WHERE NOT (n)<-[:HAS_ORDER_CUSTOMER]-(:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p2) RETURN p.ProductName AS hasPurchased, p2.ProductName AS hasAlsoPurchased, count(DISTINCT o2) AS occurrences ORDER BY occurrences DESC LIMIT 5"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Supplier }
    quickQuery:
      name: "Its Purchase Orders by state"
      querySuffix: "MATCH (n)<-[:PO_FOR_SUPPLIER]-(po:PurchaseOrder)<-[r]-(st) WHERE type(r) IN [\"IS_NEW_PO_STATE\", \"IS_APPROVED_PO_STATE\", \"IS_SUBMITTED_PO_STATE\", \"IS_REJECTED_PO_STATE\", \"IS_CLOSED_PO_STATE\"] RETURN labels(st)[0] AS state, count(po) AS POs, collect(po.PONumber) AS which"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Supplier }
    quickQuery:
      name: "RFQ reliability (rejection rate)"
      querySuffix: "MATCH (n)<-[:RFQ_FROM_SUPPLIER]-(rfq:RFQ) RETURN n.CompanyName AS supplier, count(rfq) AS RFQs, count(CASE WHEN (rfq)<-[:IS_SUPPLIER_REJECTED_RFQ_STATE]-() THEN 1 END) AS rejected"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Supplier }
    quickQuery:
      name: "Products it supplies, with their isotopes"
      querySuffix: "MATCH (n)-[:SUPPLIES]->(p:Product)-[:HAS_INVENTORY_LEVEL|HAS_REORDER_LEVEL|HAS_SUPPLY_ORDER]->(m) RETURN p, m"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Employee }
    quickQuery:
      name: "Everything this person decided, received, paid or shipped"
      querySuffix: "MATCH (n)<-[:VETTED_BY|RECEIVED_BY|PAID_BY|FULFILLED_BY]-(d)<-[]-(x) RETURN d, x LIMIT 200"
      sort: NODE
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Employee }
    quickQuery:
      name: "Role, approval limit and workload"
      querySuffix: "MATCH (role:RolE)-[:IS_ACTIVE_ROLE]->(n) OPTIONAL MATCH (n)-[:HAS_PERSON]->(p) OPTIONAL MATCH (n)<-[:VETTED_BY|RECEIVED_BY|PAID_BY|FULFILLED_BY]-(d) RETURN p.FirstName + \" \" + p.LastName AS name, role.Title AS role, role.ApprovalLimit AS approvalLimit, count(d) AS actionsTaken"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Simulation }
    quickQuery:
      name: "Gross profit, last hour (shipped orders vs paid POs)"
      querySuffix: "WITH n, datetime() - duration(\"PT1H\") AS since CALL { WITH since MATCH (cp) WHERE id(cp) = idFrom(\"ClosedPoS\") MATCH (cp)-[:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_FINANCE_PAYMENT]->(pay:FinancePayment) WHERE pay.Date >= since MATCH (po)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(i:RFQItem) RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers, sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers } CALL { WITH since MATCH (f) WHERE id(f) = idFrom(\"OrderStatusFulfilleD\") MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_WAREHOUSE_FULFILLMENT]->(wf:WarehouseFulfillment) WHERE wf.Date >= since MATCH (o)-[:HAS_ORDER_ITEM]->(i:OrderItem) RETURN sum(i.Quantity) AS UnitsSold, sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue } RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers, Revenue - AmountPaidToSuppliers AS GrossProfit"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Simulation }
    quickQuery:
      name: "Gross profit, all time: every PO raised vs every order placed"
      querySuffix: "WITH n CALL { MATCH (t) WHERE id(t) = idFrom(\"PoS\") MATCH (t)-[]->(state)-[]->(po:PurchaseOrder)-[:HAS_PO_ITEM]->(i:POItem)-[:PO_ITEM_PRODUCT]->(p:Product) RETURN sum(i.POqt) AS UnitsOrderedFromSuppliers, sum(i.POqt * i.POPriceDiscount * p.UnitPrice) AS AmountPaidToSuppliers } CALL { MATCH (st) WHERE id(st) IN [idFrom(\"OrderStatusOpeN\"), idFrom(\"OrderStatusFulfilleD\"), idFrom(\"OrderStatusCanceleD\")] MATCH (st)-[]->(o:Order)-[:HAS_ORDER_ITEM]->(i:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product) RETURN sum(i.Quantity) AS UnitsSold, sum(i.Quantity * p.UnitPrice) AS Revenue } RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers, Revenue - AmountPaidToSuppliers AS GrossProfit"
      sort: TEXT
  - predicate: { propertyKeys: [], knownValues: {}, dbLabel: Simulation }
    quickQuery:
      name: "Gross profit, all time: paid POs vs fulfilled orders"
      querySuffix: "WITH n CALL { MATCH (cp) WHERE id(cp) = idFrom(\"ClosedPoS\") MATCH (cp)-[:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(i:RFQItem) RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers, sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers } CALL { MATCH (f) WHERE id(f) = idFrom(\"OrderStatusFulfilleD\") MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(i:OrderItem) RETURN sum(i.Quantity) AS UnitsSold, sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue } RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers, Revenue - AmountPaidToSuppliers AS GrossProfit"
      sort: TEXT

# Sample queries: the drop-down of the query bar. LIVE = changes while the
# simulation runs; GRAPH = draws on the canvas; SALES = the NorthWind reports;
# CHECK = data-quality invariants (0 = ok).
sampleQueries:
  - name: "00b · LIVE · Gross profit, all time: every PO raised vs every order placed (list prices)"
    query: |-
      CALL {
        MATCH (t) WHERE id(t) = idFrom("PoS")
        MATCH (t)-[]->(state)-[]->(po:PurchaseOrder)-[:HAS_PO_ITEM]->(i:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)
        RETURN sum(i.POqt) AS UnitsOrderedFromSuppliers,
               sum(i.POqt * i.POPriceDiscount * p.UnitPrice) AS AmountPaidToSuppliers
      }
      CALL {
        MATCH (st) WHERE id(st) IN [idFrom("OrderStatusOpeN"), idFrom("OrderStatusFulfilleD"), idFrom("OrderStatusCanceleD")]
        MATCH (st)-[]->(o:Order)-[:HAS_ORDER_ITEM]->(i:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)
        RETURN sum(i.Quantity) AS UnitsSold,
               sum(i.Quantity * p.UnitPrice) AS Revenue
      }
      RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
             Revenue - AmountPaidToSuppliers AS GrossProfit
  - name: "00c · LIVE · Gross profit, all time: paid POs vs fulfilled orders (incl. the imported history)"
    query: |-
      CALL {
        MATCH (cp) WHERE id(cp) = idFrom("ClosedPoS")
        MATCH (cp)-[:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(i:RFQItem)
        RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers,
               sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers
      }
      CALL {
        MATCH (f) WHERE id(f) = idFrom("OrderStatusFulfilleD")
        MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(i:OrderItem)
        RETURN sum(i.Quantity) AS UnitsSold,
               sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue
      }
      RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
             Revenue - AmountPaidToSuppliers AS GrossProfit
  - name: "00a · LIVE · Gross profit, last hour (shipped orders vs paid POs)"
    query: |-
      WITH datetime() - duration("PT1H") AS since
      CALL {
        WITH since
        MATCH (cp) WHERE id(cp) = idFrom("ClosedPoS")
        MATCH (cp)-[:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_FINANCE_PAYMENT]->(pay:FinancePayment)
        WHERE pay.Date >= since
        MATCH (po)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(i:RFQItem)
        RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers,
               sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers
      }
      CALL {
        WITH since
        MATCH (f) WHERE id(f) = idFrom("OrderStatusFulfilleD")
        MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_WAREHOUSE_FULFILLMENT]->(wf:WarehouseFulfillment)
        WHERE wf.Date >= since
        MATCH (o)-[:HAS_ORDER_ITEM]->(i:OrderItem)
        RETURN sum(i.Quantity) AS UnitsSold,
               sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue
      }
      RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
             Revenue - AmountPaidToSuppliers AS GrossProfit
  - name: "01 · LIVE · Where is everything? (members per state Collection)"
    query: |-
      MATCH (c) WHERE id(c) IN [idFrom("OrderStatusOpeN"), idFrom("OrderStatusFulfilleD"), idFrom("LowStocK"), idFrom("NewPoS"), idFrom("ApprovedPoS"), idFrom("RejectedPoS"), idFrom("SubmittedPoS"), idFrom("ClosedPoS")]
      OPTIONAL MATCH (c)-[]->(m) WHERE m:Order OR m:Product OR m:PurchaseOrder
      RETURN labels(c)[0] AS Collection, count(m) AS Members
      ORDER BY Collection
  - name: "02 · LIVE · Product Supply/Demand Dashboard (The Inventory Level Report)"
    query: |-
      MATCH (av) WHERE id(av) = idFrom("ProductStatusAvailablE")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel),
            (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel),
            (p)-[:HAS_SUPPLY_ORDER]->(suo:OrderLevel)
      OPTIONAL MATCH (:OrderStatusOpeN)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p)
      WITH p, inv, r, suo, count(DISTINCT o) AS OpenCustomerOrders, coalesce(sum(details.Quantity), 0) AS QtyDemanded
      OPTIONAL MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p)
      WHERE NOT (po)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH p, inv, r, suo, OpenCustomerOrders, QtyDemanded, coalesce(sum(rfi.RFQqt), 0) AS QtyApprovedRFQPendingDelivery
      OPTIONAL MATCH (po2:PurchaseOrder)-[:HAS_PO_ITEM]->(poi2:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE ((po2)<-[:IS_NEW_PO_STATE]-(:NewPoS) OR (po2)<-[:IS_APPROVED_PO_STATE]-(:ApprovedPoS) OR (po2)<-[:IS_SUBMITTED_PO_STATE]-(:SubmittedPoS))
        AND NOT (po2)-[:HAS_APPROVED_RFQ]->(:RFQ)
      WITH p, inv, r, suo, OpenCustomerOrders, QtyDemanded, QtyApprovedRFQPendingDelivery, coalesce(sum(poi2.POqt), 0) AS QtyOpenPOsNotYetConfirmed
      OPTIONAL MATCH (ls:LowStocK)-[low:IS_LOW_STOCK_PRODUCT]->(p)
      RETURN p.ProductName AS ProductName, inv.UnitsInStock AS UnitsInStock, r.StockThreshold AS StockThreshold,
             suo.UnitsOnOrder AS UnitsOnOrder_Tracked, QtyApprovedRFQPendingDelivery, QtyOpenPOsNotYetConfirmed,
             (QtyApprovedRFQPendingDelivery + QtyOpenPOsNotYetConfirmed) AS TotalIncomingQty,
             OpenCustomerOrders, QtyDemanded, low IS NOT NULL AS InLowStock
      ORDER BY ProductName
  - name: "03 · LIVE · Products in LowStock now, and their supplier"
    query: |-
      MATCH (ls) WHERE id(ls) = idFrom("LowStocK")
      MATCH (ls)-[:IS_LOW_STOCK_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel), (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)<-[:SUPPLIES]-(s:Supplier)
      RETURN p.ProductName AS Product, i.UnitsInStock AS UnitsInStock, r.StockThreshold AS StockThreshold, s.CompanyName AS Supplier
      ORDER BY UnitsInStock ASC
  - name: "04 · LIVE · PO Creation test (no writes): the reorder rule per product"
    query: |-
      MATCH (av) WHERE id(av) = idFrom("ProductStatusAvailablE")
      MATCH (s:Supplier)-[:SUPPLIES]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(av), (r:ReorderLevel)<-[:HAS_REORDER_LEVEL]-(p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
      OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[:HAS_PO_ITEM]->(poi2:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE NOT (activePO)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH s, p, r, i, sum(coalesce(poi2.POqt, 0)) AS AlreadyPendingQty
      OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(op:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
      WITH s, p, r, i, AlreadyPendingQty, sum(coalesce(op.Quantity, 0)) AS OpenOrderQty
      WITH s, p, r, i, AlreadyPendingQty, OpenOrderQty, i.UnitsInStock + AlreadyPendingQty - OpenOrderQty AS EffectiveAvailable
      RETURN p.ProductID AS ProductID, p.ProductName AS ProductName, s.SupplierID AS SupplierID, i.UnitsInStock AS UnitsInStock,
             AlreadyPendingQty, OpenOrderQty, EffectiveAvailable, r.StockThreshold AS StockThreshold,
             (EffectiveAvailable - (r.StockThreshold * 0.5) <= r.StockThreshold) AS WouldTriggerReorder,
             (r.StockThreshold - EffectiveAvailable + (r.StockThreshold * 2)) AS WouldOrderQty
      ORDER BY WouldTriggerReorder DESC, ProductID
  - name: "05 · LIVE · Purchase Orders per state (procurement view)"
    query: |-
      MATCH (t) WHERE id(t) = idFrom("PoS")
      MATCH (t)-[]->(st)
      OPTIONAL MATCH (st)-[]->(po:PurchaseOrder)
      RETURN labels(st)[0] AS State, count(po) AS POs
      ORDER BY State
  - name: "06 · LIVE · PO Vetting status by PONumber and Vetting Date"
    query: |-
      MATCH (po:PurchaseOrder)-[r]->(d:VettingDecision)-[:VETTED_BY]->(e:Employee)<-[:IS_ACTIVE_ROLE]-(role)
      WHERE type(r) IN ['HAS_L1_PO_REJECTION','HAS_L2_PO_REJECTION','HAS_L3_PO_REJECTION','HAS_L1_PO_APPROVAL','HAS_L2_PO_APPROVAL','HAS_L3_PO_APPROVAL']
      RETURN po.PONumber AS PONumber, CASE WHEN type(r) ENDS WITH 'REJECTION' THEN 'Rejected on' ELSE 'Approved on' END AS State,
             d.Date AS VettingDate, ' by ' AS Who, e.Email AS Employee, role.Title AS Role, d.Comment AS Comment
      ORDER BY PONumber, VettingDate ASC
  - name: "07 · LIVE · Supplier Reliability -- RFQ Rejection Rate"
    query: |-
      MATCH (s:Supplier)<-[:RFQ_FROM_SUPPLIER]-(rfq:RFQ)
      WITH s, count(rfq) AS TotalRFQs, count(CASE WHEN (rfq)<-[:IS_SUPPLIER_REJECTED_RFQ_STATE]-() THEN 1 END) AS RejectedRFQs
      WHERE TotalRFQs > 0
      RETURN s.CompanyName AS Supplier, TotalRFQs, RejectedRFQs, round(100.0 * RejectedRFQs / TotalRFQs, 1) AS RejectionRatePct
      ORDER BY RejectionRatePct DESC
  - name: "08 · LIVE · PO Rejection Value by Approval Level -- where is procurement friction concentrated?"
    query: |-
      MATCH (po:PurchaseOrder)-[r:HAS_L1_PO_REJECTION|HAS_L2_PO_REJECTION|HAS_L3_PO_REJECTION]->(:VettingDecision), (po)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)
      WITH type(r) AS RejectionLevel, po, sum(poi.POqt * (p.UnitPrice * poi.POPriceDiscount)) AS POCost
      RETURN RejectionLevel, count(DISTINCT po) AS RejectedPOs, round(sum(POCost), 2) AS TotalRejectedValue
      ORDER BY TotalRejectedValue DESC
  - name: "09 · LIVE · Approval Workload by Employee -- who is doing the most PO/RFQ vetting?"
    query: |-
      MATCH (p)<-[:HAS_PERSON]-(e:Employee)<-[:VETTED_BY]-(d:VettingDecision)<-[r:HAS_L1_PO_APPROVAL|HAS_L2_PO_APPROVAL|HAS_L3_PO_APPROVAL|HAS_L1_PO_REJECTION|HAS_L2_PO_REJECTION|HAS_L3_PO_REJECTION|HAS_BUYER_RFQ_APPROVAL|HAS_BUYER_RFQ_REJECTION|HAS_BUYER_PO_APPROVAL]-()
      RETURN e.EmployeeID AS EmployeeID, p.FirstName AS FirstName, p.LastName AS LastName, count(r) AS ActionsTaken
      ORDER BY ActionsTaken DESC
  - name: "10 · LIVE · Full Resubmission Lineage -- POs re-ordered after a rejection"
    query: |-
      MATCH (latest:PurchaseOrder)-[:HAS_PREVIOUS_PO]->(original:PurchaseOrder)
      WHERE NOT ()-[:HAS_PREVIOUS_PO]->(latest)
      OPTIONAL MATCH (latest)-[:HAS_PREVIOUS_PO*1..]->(ancestor:PurchaseOrder)
      WITH latest, collect(DISTINCT ancestor.PONumber) AS lineage
      OPTIONAL MATCH (st)-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE|IS_REJECTED_PO_STATE|IS_CLOSED_PO_STATE]->(latest)
      RETURN latest.PONumber AS CurrentPO, labels(st)[0] AS CurrentState, lineage AS RejectedPredecessors, size(lineage) AS TimesRejectedAndResubmitted
      ORDER BY TimesRejectedAndResubmitted DESC
  - name: "11 · LIVE · RFQ Resubmission Lineage -- RFQs rejected by rule and answered again"
    query: |-
      MATCH (rfq:RFQ)-[:HAS_PREVIOUS_RFQ]->(prev:RFQ)-[:IS_RFQ_FOR_PO]->(po:PurchaseOrder), (rfq)-[:RFQ_FROM_SUPPLIER]->(s:Supplier)
      OPTIONAL MATCH (prev)-[:HAS_BUYER_RFQ_REJECTION]->(d:VettingDecision)
      RETURN po.PONumber AS PO, s.CompanyName AS Supplier, prev.RFQNumber AS RejectedRFQ, d.Comment AS WhyRejected, rfq.RFQNumber AS NewRFQ,
             CASE WHEN (po)-[:HAS_APPROVED_RFQ]->(rfq) THEN "approved" ELSE "pending / rejected" END AS NewRFQState
      ORDER BY PO
  - name: "12 · LIVE · Open Customer Orders currently blocked, waiting on Product Inventory"
    query: |-
      MATCH (op) WHERE id(op) = idFrom("OrderStatusOpeN")
      MATCH (op)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel), (o)-[:HAS_ORDER_CUSTOMER]->(c:Customer)
      WITH c, o, collect({ProductName: p.ProductName, Ordered: details.Quantity, InStock: inv.UnitsInStock, Shortfall: details.Quantity - inv.UnitsInStock}) AS lines
      WITH c, o, [line IN lines WHERE line.Shortfall >= 0] AS blockingProducts
      WHERE size(blockingProducts) > 0
      RETURN c.CompanyName AS Customer, o.OrderID AS OrderID, o.OrderDate AS OrderDate, duration.between(o.OrderDate, datetime()) AS TimeWaiting, blockingProducts
      ORDER BY OrderDate ASC
  - name: "13 · LIVE · Available Products Urgently Needed to Fulfill Blocked Customer Orders"
    query: |-
      MATCH (op), (a) WHERE id(op) = idFrom("OrderStatusOpeN") AND id(a) = idFrom("ProductStatusAvailablE")
      MATCH (op)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel), (p)<-[:IS_AVAILABLE_PRODUCT]-(a)
      WHERE details.Quantity >= inv.UnitsInStock
      WITH p, inv, count(DISTINCT o) AS BlockedOrders, sum(details.Quantity - inv.UnitsInStock) AS TotalUnitsShort
      OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(po:PurchaseOrder)-[:HAS_PO_ITEM]->(:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WITH p, inv, BlockedOrders, TotalUnitsShort, count(po) AS POsAlreadyInFlight
      RETURN p.ProductName AS Product, inv.UnitsInStock AS UnitsInStock, BlockedOrders, TotalUnitsShort, POsAlreadyInFlight
      ORDER BY TotalUnitsShort DESC
  - name: "14 · LIVE · Open Customer Orders waiting time"
    query: |-
      MATCH (op) WHERE id(op) = idFrom("OrderStatusOpeN")
      MATCH (op)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_CUSTOMER]->(c:Customer)
      RETURN o.OrderID AS OrderID, c.CompanyName AS Customer, o.OrderDate AS OrderDate, duration.between(o.OrderDate, datetime()) AS TimeWaiting
      ORDER BY OrderDate ASC
  - name: "15 · LIVE · Fulfilled Customer Orders -- Time to Fulfill (latest shipments first)"
    query: |-
      MATCH (f) WHERE id(f) = idFrom("OrderStatusFulfilleD")
      MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_ORDER_CUSTOMER]->(c:Customer), (o)-[:HAS_SHIPMENT_INFO]->(si:ShipInfo)
      WHERE si.ShippedDate <> datetime("9999-12-31T00:00:00.000Z")
      RETURN o.OrderID AS OrderID, c.CompanyName AS Customer, o.OrderDate AS OrderDate, si.ShippedDate AS ShippedDate, duration.between(o.OrderDate, si.ShippedDate) AS TimeToFulfill
      ORDER BY ShippedDate DESC LIMIT 100
  - name: "16 · LIVE · Open Orders that can be fulfilled now (every line in stock)"
    query: |-
      MATCH (op) WHERE id(op) = idFrom("OrderStatusOpeN")
      MATCH (op)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
      WITH o, count(details) AS TotalLines, sum(CASE WHEN inv.UnitsInStock > details.Quantity THEN 1 ELSE 0 END) AS LinesWithStock
      WHERE TotalLines = LinesWithStock
      RETURN o.OrderID AS OrderID, o.OrderDate AS OrderDate, TotalLines
      ORDER BY OrderDate LIMIT 100
  - name: "17 · LIVE · Products with Low (<10) Inventory"
    query: |-
      MATCH (av) WHERE id(av) = idFrom("ProductStatusAvailablE")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(i)
      WHERE i.UnitsInStock < 10
      RETURN p.ProductName AS Product, i.UnitsInStock AS UnitsInStock
  - name: "18 · GRAPH · The PO state machine (PoS and its Collections, with members)"
    query: |-
      MATCH (t) WHERE id(t) = idFrom("PoS")
      MATCH (t)-[]->(st)
      OPTIONAL MATCH (st)-[]->(po:PurchaseOrder)
      RETURN t, st, po LIMIT 300
  - name: "19 · GRAPH · Full Context Trace of the newest Purchase Order (everything within 3 hops)"
    query: |-
      MATCH (np) WHERE id(np) = idFrom("PoS")
      MATCH (np)-[]->()-[]->(po:PurchaseOrder)
      WITH po ORDER BY po.PODate DESC LIMIT 1
      MATCH (po)-[*1..3]-(connected)
      WITH po, connected WHERE NOT "Order" IN labels(connected) AND NOT "OrderItem" IN labels(connected)
      RETURN DISTINCT po, connected LIMIT 300
  - name: "20 · SALES · Total Amount of OrderID 10461, by Product"
    query: |-
      MATCH (o) WHERE id(o) = idFrom("Order", "10461")
      MATCH (o)-[:HAS_ORDER_ITEM]->(r:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)
      RETURN o.OrderID AS OrderID, p.ProductName AS Product, r.Quantity AS Quantity, r.UnitPrice AS UnitPrice, r.Quantity * r.UnitPrice AS AmountByProduct
      ORDER BY AmountByProduct DESC
  - name: "21 · SALES · Top 25 Orders by Total Amount"
    query: |-
      MATCH (o:Order)-[:HAS_ORDER_ITEM]->(r:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)
      RETURN o.OrderID AS OrderID, sum(r.Quantity * r.UnitPrice) AS TotalAmountOrder
      ORDER BY TotalAmountOrder DESC LIMIT 25
  - name: "22 · SALES · Top 10 Customers by Number of Orders"
    query: |-
      MATCH (cs) WHERE id(cs) = idFrom("CustomerS")
      MATCH (cs)-[:IS_CUSTOMER]->(c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)
      RETURN c.CustomerID AS CustomerID, c.CompanyName AS Customer, count(o) AS NumberOfOrders
      ORDER BY NumberOfOrders DESC LIMIT 10
  - name: "23 · SALES · Top 10 Employees by Number of Orders Sold"
    query: |-
      MATCH (p:Person)<-[:HAS_PERSON]-(e:Employee)<-[:SOLD_BY]-(o:Order)
      RETURN e.EmployeeID AS EmployeeID, p.FirstName AS FirstName, p.LastName AS LastName, count(o) AS NumberOfOrdersSold
      ORDER BY NumberOfOrdersSold DESC LIMIT 10
  - name: "24 · SALES · Employees by Average Discount Given"
    query: |-
      MATCH (n)<-[:HAS_PERSON]-(e:Employee)<-[:SOLD_BY]-(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)
      RETURN n.FirstName AS FirstName, n.LastName AS LastName, e.EmployeeID AS EmployeeID, round(avg(details.Discount), 4) AS AverageDiscount, count(details) AS LinesSold
      ORDER BY AverageDiscount DESC
  - name: "25 · SALES · Total Sales by Region and Territory"
    query: |-
      MATCH (r:Regions)-[:HAS_TERRITORY]->(t:Territory)-[:HAS_EMPLOYEE]->(e:Employee)<-[:SOLD_BY]-(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)
      RETURN r.RegionID AS RegionID, r.RegionDescription AS Region, t.TerritoryDescription AS Territory, sum(details.Quantity * details.UnitPrice) AS TotalSales
      ORDER BY TotalSales DESC
  - name: "26 · SALES · Total Sales by Category"
    query: |-
      MATCH (k) WHERE id(k) = idFrom("CategorieS")
      MATCH (k)-[:HAS_CATEGORY]->(cat:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p:Product)<-[:ORDER_ITEM_PRODUCT]-(details:OrderItem)
      RETURN cat.CategoryName AS Category, sum(details.Quantity * details.UnitPrice) AS TotalSales
      ORDER BY TotalSales DESC
  - name: "27 · SALES · Total Sales by Employee"
    query: |-
      MATCH (s:Person)<-[:HAS_PERSON]-(e:Employee)<-[:SOLD_BY]-(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)
      RETURN e.EmployeeID AS EmployeeID, s.FirstName AS FirstName, s.LastName AS LastName, sum(details.Quantity * details.UnitPrice) AS TotalSales
      ORDER BY TotalSales DESC
  - name: "28 · SALES · Total Product Orders, Stock Available, and Supply Orders"
    query: |-
      MATCH (k) WHERE id(k) = idFrom("CategorieS")
      MATCH (k)-[:HAS_CATEGORY]->(:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(s:InventoryLevel), (p)-[:HAS_SUPPLY_ORDER]->(u)
      OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(details:OrderItem)
      RETURN p.ProductID AS ProductID, p.ProductName AS Product, sum(details.Quantity) AS TotalOrdered, s.UnitsInStock AS StockAvailable, u.UnitsOnOrder AS SupplyOrders
      ORDER BY TotalOrdered DESC
  - name: "29 · SALES · Top 5 Customer/Product pairs by Number of Orders"
    query: |-
      MATCH (c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)
      RETURN c.CompanyName AS Customer, p.ProductName AS Product, count(o) AS Orders
      ORDER BY Orders DESC LIMIT 5
  - name: "30 · SALES · Products Never Ordered by a Customer"
    query: |-
      MATCH (k) WHERE id(k) = idFrom("CategorieS")
      MATCH (k)-[:HAS_CATEGORY]->(:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p:Product)
      WHERE NOT (p)<-[:ORDER_ITEM_PRODUCT]-(:OrderItem)
      RETURN p.ProductName AS Product
  - name: "31 · SALES · Top Products by Quantity Ordered to Date, and the Customer that ordered the most"
    query: |-
      MATCH (f) WHERE id(f) = idFrom("OrderStatusFulfilleD")
      MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(r1:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product), (o)-[:HAS_ORDER_CUSTOMER]->(c:Customer)
      WITH p, c, sum(r1.Quantity) AS qty
      ORDER BY qty DESC
      WITH p, collect({customer: c.CompanyName, qty: qty}) AS buyers
      RETURN p.ProductName AS Product, buyers[0].qty AS QuantityOrderedToDate, buyers[0].customer AS CustomerName
      ORDER BY QuantityOrderedToDate DESC
  - name: "32 · SALES · Top 10 Customers that ordered the most of each Product"
    query: |-
      MATCH (f) WHERE id(f) = idFrom("OrderStatusFulfilleD")
      MATCH (f)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(r1:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product), (o)-[:HAS_ORDER_CUSTOMER]->(c:Customer)
      WITH p, c, sum(r1.Quantity) AS qty
      ORDER BY p.ProductName, qty DESC
      WITH p, collect({CustomerName: c.CompanyName, QuantityOrderedToDate: qty}) AS buyers
      UNWIND buyers[0..10] AS buyer
      RETURN p.ProductName AS Product, buyer.QuantityOrderedToDate AS QuantityOrderedToDate, buyer.CustomerName AS CustomerName
      ORDER BY Product, QuantityOrderedToDate DESC
  - name: "33 · SALES · Product Recommendation for ANTON (same category, bought by others) -- slow, ~20 s"
    query: |-
      MATCH (c) WHERE id(c) = idFrom("Customer", "ANTON")
      MATCH (c)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)<-[:ORDER_ITEM_PRODUCT]-(:OrderItem)<-[:HAS_ORDER_ITEM]-(o2:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p2:Product)<-[:IS_PRODUCT_CATEGORY_OF]-(:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p)
      WHERE NOT (c)<-[:HAS_ORDER_CUSTOMER]-(:Order)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p2)
      RETURN c.CompanyName AS Customer, p.ProductName AS HasPurchased, p2.ProductName AS HasAlsoPurchased, count(DISTINCT o2) AS Occurrences
      ORDER BY Occurrences DESC LIMIT 5
  - name: "34 · GRAPH · Nodes to Edges ratio"
    query: |-
      MATCH (n) WITH count(n) AS totalNodes
      MATCH ()-[r]->() WITH totalNodes, count(r) AS totalEdges
      RETURN totalNodes, totalEdges, CASE WHEN totalEdges = 0 THEN null ELSE "1:" + toString(totalEdges / toFloat(totalNodes)) END AS NodesToEdgesRatio
  - name: "35 · GRAPH · Supernodes: the 25 nodes with the most incoming edges"
    query: |-
      MATCH (n)
      OPTIONAL MATCH (n)<-[r_in]-()
      WITH n, count(r_in) AS IncomingCount
      ORDER BY IncomingCount DESC LIMIT 25
      OPTIONAL MATCH (n)-[r_out]->()
      RETURN labels(n) AS Labels, properties(n) AS Properties, count(r_out) AS OutgoingCount, IncomingCount
      ORDER BY IncomingCount DESC
  - name: "36 · CHECK · No product with negative stock (0 = ok)"
    query: |-
      MATCH (i:InventoryLevel) WHERE i.UnitsInStock < 0 RETURN count(i) AS Violations
  - name: "37 · CHECK · No product with negative units on order (0 = ok)"
    query: |-
      MATCH (s:OrderLevel) WHERE s.UnitsOnOrder < 0 RETURN count(s) AS Violations
  - name: "38 · CHECK · Every PO in exactly one procurement state (0 = ok)"
    query: |-
      MATCH (po:PurchaseOrder)
      WITH po, size([(po)<-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE|IS_REJECTED_PO_STATE|IS_CLOSED_PO_STATE]-(c) | c]) AS states
      WHERE states <> 1
      RETURN count(po) AS Violations, collect(po.PONumber) AS POs
  - name: "39 · CHECK · No PO with two decisions at the same vetting level (0 = ok)"
    query: |-
      MATCH (po:PurchaseOrder)
      WITH po, size([(po)-[:HAS_L1_PO_APPROVAL|HAS_L1_PO_REJECTION]->(d) | d]) AS l1,
           size([(po)-[:HAS_L2_PO_APPROVAL|HAS_L2_PO_REJECTION]->(d) | d]) AS l2,
           size([(po)-[:HAS_L3_PO_APPROVAL|HAS_L3_PO_REJECTION]->(d) | d]) AS l3
      WHERE l1 > 1 OR l2 > 1 OR l3 > 1
      RETURN count(po) AS Violations, collect(po.PONumber) AS POs
  - name: "40 · CHECK · No order both open and fulfilled (0 = ok)"
    query: |-
      MATCH (o:Order)<-[:IS_OPEN_ORDER_STATE]-(), (o)<-[:IS_FULFILLED_ORDER_STATE]-()
      RETURN count(o) AS Violations
  - name: "41 · CHECK · No PO paid before it was delivered, none delivered or paid twice (0 = ok)"
    query: |-
      MATCH (po:PurchaseOrder)
      WITH po, size([(po)-[:HAS_WAREHOUSE_DELIVERY]->(d) | d]) AS deliveries, size([(po)-[:HAS_FINANCE_PAYMENT]->(f) | f]) AS payments
      WHERE deliveries > 1 OR payments > 1 OR (payments > 0 AND deliveries = 0)
      RETURN count(po) AS Violations, collect(po.PONumber) AS POs
  - name: "42 · CHECK · No PO with more than one approved RFQ (0 = ok)"
    query: |-
      MATCH (po:PurchaseOrder)
      WITH po, size([(po)-[:HAS_APPROVED_RFQ]->(r) | r]) AS approved
      WHERE approved > 1
      RETURN count(po) AS Violations, collect(po.PONumber) AS POs
  - name: "43 · CHECK · UnitsOnOrder matches approved RFQs not yet delivered (0 = ok)"
    query: |-
      MATCH (av) WHERE id(av) = idFrom("ProductStatusAvailablE")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_SUPPLY_ORDER]->(suo)
      OPTIONAL MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(:RFQ)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p)
      WHERE NOT (po)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH p, suo, coalesce(sum(rfi.RFQqt), 0) AS pending
      WHERE suo.UnitsOnOrder <> pending
      RETURN count(p) AS Violations, collect(p.ProductName) AS Products
  - name: "44 · CHECK · LowStock membership matches the reorder rule (0 = ok; can be briefly off while a rule is running)"
    query: |-
      MATCH (av), (ls) WHERE id(av) = idFrom("ProductStatusAvailablE") AND id(ls) = idFrom("LowStocK")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
      OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE NOT (activePO)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH ls, p, r, i, sum(coalesce(poi.POqt, 0)) AS pending
      OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
      WITH ls, p, r, i, pending, sum(coalesce(oi.Quantity, 0)) AS openQty
      WITH ls, p, i.UnitsInStock + pending - openQty - (r.StockThreshold * 0.5) <= r.StockThreshold AS low
      OPTIONAL MATCH (ls)-[e:IS_LOW_STOCK_PRODUCT]->(p)
      WITH p, low, e WHERE (low AND e IS NULL) OR (NOT low AND e IS NOT NULL)
      RETURN count(p) AS Violations, collect(p.ProductName) AS Products

# Printed in Quine's log at startup, and reachable as a link in the log.
statusQuery:
  cypherQuery: |-
    MATCH (sim), (op), (ls), (np), (ap), (sp), (cp), (rp)
    WHERE id(sim) = idFrom("Simulation") AND id(op) = idFrom("OrderStatusOpeN") AND id(ls) = idFrom("LowStocK")
      AND id(np) = idFrom("NewPoS") AND id(ap) = idFrom("ApprovedPoS") AND id(sp) = idFrom("SubmittedPoS")
      AND id(cp) = idFrom("ClosedPoS") AND id(rp) = idFrom("RejectedPoS")
    RETURN coalesce(sim.Ready, false) AS live,
           size([(op)-[:IS_OPEN_ORDER_STATE]->(o) | o]) AS openOrders,
           size([(ls)-[:IS_LOW_STOCK_PRODUCT]->(p) | p]) AS lowStock,
           size([(np)-[:IS_NEW_PO_STATE]->(p) | p]) AS newPOs,
           size([(ap)-[:IS_APPROVED_PO_STATE]->(p) | p]) AS approvedPOs,
           size([(sp)-[:IS_SUBMITTED_PO_STATE]->(p) | p]) AS submittedPOs,
           size([(cp)-[:IS_CLOSED_PO_STATE]->(p) | p]) AS closedPOs,
           size([(rp)-[:IS_REJECTED_PO_STATE]->(p) | p]) AS rejectedPOs
