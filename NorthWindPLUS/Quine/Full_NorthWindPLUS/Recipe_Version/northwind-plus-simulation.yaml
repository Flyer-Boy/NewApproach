# =============================================================================
# NorthWind PLUS v2.4 on Quine -- the simulation as a recipe
#
# The outside world arrives as INGEST STREAMS; the company reacts with
# STANDING QUERIES. No Python script runs the simulation.
#
#   ingest streams (the clock: one number per second, each stream acts on its own beat)
#     customer-order           every 10 s   a customer places an order (1-11 products)
#     order-fulfillment        every 15 s   the warehouse ships the oldest fully-stocked open order
#     po-creation              every 30 s   the Procurement Assistant raises ONE PO PER SUPPLIER for
#                                           its products in LowStock (a stream, not a standing query:
#                                           it must run one at a time, and a recipe cannot make a
#                                           standing query do that)
#     rfq-submission           every 15 s   a supplier answers a submitted PO with an RFQ
#                                           (15% of the time priced above the PO budget)
#     rfq-resubmission         every 20 s   a supplier resubmits a rejected RFQ at a better price
#     rfq-fulfillment          every 15 s   the goods of a PO with an approved RFQ arrive (stock up, on-order down)
#     threshold-recalibration  every 300 s  StockThreshold = 150% of average monthly demand, then LowStock re-evaluated
#
#   standing queries (the company's rules, fired the moment the pattern appears)
#     nw-po-vetting-l1/l2/l3      PO vetting, all three levels (rule-based rejections)
#     nw-low-stock-after-reject   a rejected PO's products go back to LowStock if still needed
#     nw-buyer-submission         an approved PO is submitted to its supplier
#     nw-rfq-vetting              an RFQ is approved within the PO budget, rejected above it
#     nw-rfq-approved-on-order    an approved RFQ puts its quantities on order (once)
#     nw-finance-closure          a delivered PO is paid and closed
#     nw-low-stock-on-new-order   a new customer order re-evaluates LowStock for its products
#     nw-log-po-created, nw-log-shipped   read-only alerts, so the log tells the whole story
#
# HOW TO RUN (WSL, Docker), from the folder that holds this file:
#   1. start Quine WITH the recipe (the streams wait; nothing happens yet):
#        docker run --rm --name northwind-quine -p 8080:8080 -v "$PWD":/demo \
#               thatdot/quine -r /demo/northwind-plus-simulation.yaml
#   2. in a second WSL window, load the graph and switch the simulation on:
#        ./northwind-plus-quine-batch.sh --import-only
#      Its last step sets Simulation.Ready = true -- every stream checks that
#      flag on every beat, so the simulation starts by itself.
#   3. watch the company act (third window):
#        docker logs -f northwind-quine 2>&1 | grep --line-buffered -o '"alert":"[^"]*"'
#   4. explore at http://localhost:8080 -- sample queries in the drop-down of
#      the query bar, quick queries on right-click of a node.
#   Stop with Ctrl-C in window 1. Quine runs a recipe on a throwaway store:
#   the graph is gone when it stops, so step 2 always starts from empty.
#
# Change a pace: edit the "n % <seconds>" on the first line of a stream's
# query (maxPerSecond: 1 makes n count seconds). The streams have no limit:
# they run until Quine stops.
#
# Quine 2.1.1 facts this file relies on (found by running it):
#   * recipe standing-query outputs accept only name, filter, preEnrichmentTransformation,
#     resultEnrichment {query, parameter} and destinations -- no parallelism, no
#     shouldRetry. So the rules are written to be safe when run concurrently and
#     re-checked before every write; PO creation, which is not, is a stream.
#   * Quine warns that ingest queries may be retried after a timeout. The guards
#     ("NOT already ...") make a retried beat a no-op in every stream except
#     customer-order, where a retry would add one extra order.
#   * a pattern predicate on a WITH that follows ORDER BY/LIMIT or an aggregation
#     evaluates as false, so re-checks are written MATCH (x) WHERE <pattern>.
# =============================================================================

version: 2
title: NorthWind PLUS v2.4 Simulation
contributor: Marcos Pinedo
summary: NorthWind PLUS as a running business -- the outside world as ingest streams, the company's rules as standing queries
description: |-
  Load the graph with northwind-plus-quine-batch.sh --import-only after Quine
  starts with this recipe. Customers, suppliers and the warehouse dock are
  ingest streams; PO vetting, Buyer submission, RFQ vetting, on-order
  bookkeeping, LowStock re-evaluation and Finance closure are standing queries.
  State is position: every state change is an edge moving between Collection
  nodes, and every mutable count lives on its own isotope node.

ingestStreams:

  # ---------------------------------------------------------------------------
  # Customer Order -- a random customer orders 1-11 available products from a
  # random Sales Representative. The open-order membership edge is written
  # LAST, so nw-low-stock-on-new-order sees the order with all its items.
  # ---------------------------------------------------------------------------
  - name: customer-order
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 10 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (op), (cs), (sr), (av)
      WHERE id(op) = idFrom("OrderStatusOpeN") AND id(cs) = idFrom("CustomerS")
        AND id(sr) = idFrom("RolE", "Sales Representative") AND id(av) = idFrom("ProductStatusAvailablE")
      MATCH (sr)-[:IS_ACTIVE_ROLE]->(e:Employee)
      WITH op, cs, av, e ORDER BY rand() LIMIT 1
      MATCH (cs)-[:IS_CUSTOMER]->(c:Customer)
      WITH op, av, e, c ORDER BY rand() LIMIT 1
      CREATE (o:Order {OrderDate: datetime(), RequiredDate: datetime() + duration("P7D")})
      SET o.OrderID = "CO-" + left(strId(o), 5) + right(strId(o), 5)
      CREATE (o)-[:HAS_ORDER_CUSTOMER]->(c), (o)-[:SOLD_BY]->(e)
      WITH op, o, av
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)
      WITH op, o, p ORDER BY rand() LIMIT toInteger(round(rand() * 10 + 1))
      CREATE (o)-[:HAS_ORDER_ITEM]->(:OrderItem {Quantity: toInteger(round(rand() * 19) + 1), UnitPrice: p.UnitPrice, Discount: rand() * 0.07})-[:ORDER_ITEM_PRODUCT]->(p)
      WITH op, o, count(p) AS lines
      CREATE (op)-[:IS_OPEN_ORDER_STATE]->(o)

  # ---------------------------------------------------------------------------
  # Order Fulfillment -- the oldest open order with stock for every line is
  # shipped (ShipInfo + WarehouseFulfillment event), Open -> Fulfilled, and
  # each line's stock goes down with the atomic int.add. One beat ships one
  # order, one at a time, so stock cannot be oversold.
  # ---------------------------------------------------------------------------
  - name: order-fulfillment
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 15 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (ro), (ss), (op), (f)
      WHERE id(ro) = idFrom("RolE", "WarehouseClerk") AND id(ss) = idFrom("ShipperS")
        AND id(op) = idFrom("OrderStatusOpeN") AND id(f) = idFrom("OrderStatusFulfilleD")
      MATCH (ro)-[:IS_ACTIVE_ROLE]->(wc:Employee), (ss)-[:IS_SHIPPER]->(s:Shipper)<-[:HAS_SHIPPER]-(si:ShipInfo)
      WITH op, f, wc, si, s ORDER BY rand() LIMIT 1
      MATCH (op)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
      WITH op, f, wc, si, s, o,
           count(details) AS TotalLines,
           sum(CASE WHEN inv.UnitsInStock > details.Quantity THEN 1 ELSE 0 END) AS LinesWithStock
      WHERE TotalLines = LinesWithStock
      WITH op, f, wc, si, s, o ORDER BY o.OrderDate LIMIT 1
      MATCH (o)-[:HAS_ORDER_ITEM]->(details:OrderItem)-[:ORDER_ITEM_PRODUCT]->(pr:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
      WITH op, f, wc, si, s, o, collect({qty: details.Quantity, inv: inv}) AS lines
      MATCH (op)-[r:IS_OPEN_ORDER_STATE]->(o)
      WHERE all(x IN lines WHERE x.inv.UnitsInStock > x.qty)
      MATCH (o)-[:HAS_ORDER_CUSTOMER]->(:Customer)-[:HAS_CUSTOMER_ADDRESS]->(a)
      CREATE (i:ShipInfo {ShippedDate: datetime(), ShipName: si.ShipName, Freight: round(rand() * 100, 2)})
      SET i.ShippmentID = "SH-" + strId(i)
      CREATE (o)-[:HAS_SHIPMENT_INFO]->(i), (i)-[:HAS_SHIPPER]->(s), (i)-[:HAS_SHIPMENT_ADDRESS]->(a),
             (o)-[:HAS_WAREHOUSE_FULFILLMENT]->(:WarehouseFulfillment {Date: datetime(), Comment: "Order picked, packed, and shipped by the Warehouse Clerk."})-[:FULFILLED_BY]->(wc)
      DELETE r
      WITH f, o, lines
      UNWIND lines AS x
      WITH f, o, x.inv AS inv, toInteger(x.qty) AS qty
      CALL int.add(inv, "UnitsInStock", -qty) YIELD result
      SET inv.LastUpdate = datetime()
      WITH f, o, count(result) AS shippedLines
      CREATE (f)-[:IS_FULFILLED_ORDER_STATE]->(o)

  # ---------------------------------------------------------------------------
  # PO Creation (Procurement Assistant) -- ONE PO PER SUPPLIER for all its
  # products in LowStock that still meet the reorder rule:
  #   UnitsInStock + qty on active, undelivered POs - open-order qty - 0.5 x threshold <= threshold
  # order qty = threshold - effective available + 2 x threshold, at the 30%
  # negotiated discount. A rejected, not yet re-ordered PO of the same supplier
  # for the product becomes HAS_PREVIOUS_PO lineage (+ ResubmissionNote); a
  # product whose previous PO was rejected at L3 (over every approval limit)
  # is left in LowStock for a person to decide. Memberships that no longer
  # meet the rule are dropped. The NewPoS edge is written LAST, after the items.
  # ---------------------------------------------------------------------------
  - name: po-creation
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 30 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (pa), (np), (ls), (app)
      WHERE id(pa) = idFrom("RolE", "Procurement Assistant") AND id(np) = idFrom("NewPoS")
        AND id(ls) = idFrom("LowStocK") AND id(app) = idFrom("ApprovedSupplierS")
      MATCH (pa)-[:IS_ACTIVE_ROLE]->(emp:Employee)
      WITH np, ls, app, emp ORDER BY rand() LIMIT 1
      MATCH (ls)-[e:IS_LOW_STOCK_PRODUCT]->(p:Product)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
      OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(a:PurchaseOrder)-[:HAS_PO_ITEM]->(q:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE NOT (a)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH np, ls, app, emp, e, p, r, i, sum(coalesce(q.POqt, 0)) AS pending
      OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
      WITH np, ls, app, emp, e, p, r, i.UnitsInStock + pending - sum(coalesce(oi.Quantity, 0)) AS effective
      FOREACH (_ IN CASE WHEN effective - (r.StockThreshold * 0.5) <= r.StockThreshold THEN [] ELSE [1] END | DELETE e)
      WITH np, ls, app, emp, p, r, effective WHERE effective - (r.StockThreshold * 0.5) <= r.StockThreshold
      MATCH (p)<-[:SUPPLIES]-(s:Supplier)<-[:IS_SUPPLIER_APPROVED_STATE]-(app)
      OPTIONAL MATCH (rej)-[:IS_REJECTED_PO_STATE]->(prev:PurchaseOrder)-[:HAS_PO_ITEM]->(:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE id(rej) = idFrom("RejectedPoS") AND (prev)-[:PO_FOR_SUPPLIER]->(s) AND NOT ()-[:HAS_PREVIOUS_PO]->(prev)
      OPTIONAL MATCH (prev)-[l3:HAS_L3_PO_REJECTION]->()
      WITH np, ls, emp, s, p, r, effective, collect(DISTINCT prev) AS prevs, count(l3) AS overLimit
      WHERE overLimit = 0
      WITH np, ls, emp, s,
           collect({p: p, qty: r.StockThreshold - effective + (r.StockThreshold * 2)}) AS items,
           reduce(acc = [], x IN collect(prevs) | acc + x) AS prevPOs
      CREATE (po:PurchaseOrder {PODate: datetime()})
      SET po.PONumber = "PO-" + left(strId(po), 5) + right(strId(po), 5)
      CREATE (po)-[:PO_FOR_SUPPLIER]->(s), (po)-[:PO_CREATED_BY]->(emp)
      FOREACH (prev IN prevPOs | CREATE (po)-[:HAS_PREVIOUS_PO]->(prev))
      FOREACH (_ IN CASE WHEN size(prevPOs) > 0 THEN [1] ELSE [] END |
        CREATE (po)-[:HAS_RESUBMISSION_NOTE]->(:ResubmissionNote {Justification: "Re-ordered by the Procurement Assistant after the previous PO was rejected; the rule that rejected it no longer applies.", Date: datetime()}))
      WITH np, ls, po, items
      UNWIND items AS item
      WITH np, ls, po, item.p AS p, item.qty AS qty
      CREATE (po)-[:HAS_PO_ITEM]->(:POItem {POqt: qty, POPriceDiscount: 0.7})-[:PO_ITEM_PRODUCT]->(p)
      WITH np, ls, po, p
      OPTIONAL MATCH (ls)-[low:IS_LOW_STOCK_PRODUCT]->(p)
      FOREACH (_ IN CASE WHEN low IS NULL THEN [] ELSE [1] END | DELETE low)
      WITH np, po, count(p) AS lines
      CREATE (np)-[:IS_NEW_PO_STATE]->(po)

  # ---------------------------------------------------------------------------
  # RFQ Submission (the suppliers) -- a supplier answers one PO the Buyer
  # submitted to it with an RFQ for every line: usually at the negotiated 30%
  # discount (x0.70), 15% of the time at x0.75 -- above the PO budget, so
  # nw-rfq-vetting rejects it by rule. The PoNewRFQ edge is written LAST.
  # ---------------------------------------------------------------------------
  - name: rfq-submission
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 15 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (app) WHERE id(app) = idFrom("ApprovedSupplierS")
      MATCH (app)-[:IS_SUPPLIER_APPROVED_STATE]->(su:Supplier)-[:HAS_SUPPLIER_NEW_PENDING_POS]->(snp)-[r:IS_SUPPLIER_NEW_PO_STATE]->(po:PurchaseOrder)
      WITH su, r, po ORDER BY rand() LIMIT 1
      WITH su, r, po, CASE WHEN rand() < 0.15 THEN 0.75 ELSE 0.7 END AS factor
      MATCH (po)-[:HAS_PO_ITEM]->(pq:POItem)-[:PO_ITEM_PRODUCT]->(p:Product), (po)-[:HAS_SUPPLIER_NEW_RFQ]->(snr), (su)-[:HAS_SUPPLIER_OPEN_POS]->(sop)
      WITH su, r, po, snr, sop, collect({p: p, qty: pq.POqt, cost: p.UnitPrice * factor}) AS rfqItems
      MATCH (po) WHERE NOT ()-[:IS_RFQ_FOR_PO]->(po)
      CREATE (rfq:RFQ {RFQDate: datetime(), RFQComments: "Thanks for your order, we are able to supply the full PO product request at the discounted price negotiated on our master agreement."})
      SET rfq.RFQNumber = "RFQ-" + left(strId(rfq), 5) + right(strId(rfq), 5)
      CREATE (rfq)-[:IS_RFQ_FOR_PO]->(po), (rfq)-[:RFQ_FROM_SUPPLIER]->(su), (sop)-[:IS_SUPPLIER_OPEN_PO_STATE]->(po)
      DELETE r
      WITH rfq, po, snr, rfqItems
      UNWIND rfqItems AS item
      WITH rfq, po, snr, item.p AS p, item.qty AS qty, item.cost AS cost
      CREATE (rfq)-[:HAS_RFQ_ITEM]->(:RFQItem {RFQqt: qty, RFQcost: cost})-[:RFQ_ITEM_PRODUCT]->(p)
      WITH rfq, po, snr, count(p) AS items
      CREATE (snr)-[:IS_SUPPLIER_NEW_RFQ]->(rfq)

  # ---------------------------------------------------------------------------
  # RFQ Resubmission (the suppliers) -- a rejected RFQ that was not yet
  # resubmitted is answered with a new one at x0.65 (within budget), linked by
  # HAS_PREVIOUS_RFQ, with a ResubmissionNote. The PoNewRFQ edge is written LAST.
  # ---------------------------------------------------------------------------
  - name: rfq-resubmission
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 20 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (sub) WHERE id(sub) = idFrom("SubmittedPoS")
      MATCH (sub)-[:IS_SUBMITTED_PO_STATE]->(po:PurchaseOrder)-[:HAS_SUPPLIER_REJECTED_RFQ]->(prr)-[:IS_SUPPLIER_REJECTED_RFQ_STATE]->(rrfq:RFQ)
      WHERE NOT ()-[:HAS_PREVIOUS_RFQ]->(rrfq)
      WITH po, rrfq ORDER BY rand() LIMIT 1
      MATCH (rrfq)-[:RFQ_FROM_SUPPLIER]->(su:Supplier), (po)-[:HAS_SUPPLIER_NEW_RFQ]->(snr)
      MATCH (po)-[:HAS_PO_ITEM]->(pq:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)
      WITH rrfq, su, po, snr, collect({p: p, qty: pq.POqt, cost: p.UnitPrice * 0.65}) AS rfqItems
      MATCH (rrfq) WHERE NOT ()-[:HAS_PREVIOUS_RFQ]->(rrfq)
      CREATE (rfq:RFQ {RFQDate: datetime(), RFQComments: "Thanks for your order, we are resubmitting our RFQ with updated pricing."})
      SET rfq.RFQNumber = "RFQ-" + left(strId(rfq), 5) + right(strId(rfq), 5)
      CREATE (rfq)-[:IS_RFQ_FOR_PO]->(po), (rfq)-[:RFQ_FROM_SUPPLIER]->(su),
             (rfq)-[:HAS_PREVIOUS_RFQ]->(rrfq),
             (rfq)-[:HAS_RESUBMISSION_NOTE]->(:ResubmissionNote {Justification: "Resubmitted with updated pricing after the Buyer rejected the previous RFQ.", Date: datetime()})
      WITH rfq, po, snr, rfqItems
      UNWIND rfqItems AS item
      WITH rfq, po, snr, item.p AS p, item.qty AS qty, item.cost AS cost
      CREATE (rfq)-[:HAS_RFQ_ITEM]->(:RFQItem {RFQqt: qty, RFQcost: cost})-[:RFQ_ITEM_PRODUCT]->(p)
      WITH rfq, po, snr, count(p) AS items
      CREATE (snr)-[:IS_SUPPLIER_NEW_RFQ]->(rfq)

  # ---------------------------------------------------------------------------
  # RFQ Fulfillment (the goods arrive) -- one submitted PO with an approved RFQ
  # is received by a Warehouse Clerk: WarehouseDelivery event, stock up and
  # on-order down (atomic int.add). nw-finance-closure then pays and closes it.
  # ---------------------------------------------------------------------------
  - name: rfq-fulfillment
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 15 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (sub) WHERE id(sub) = idFrom("SubmittedPoS")
      MATCH (sub)-[:IS_SUBMITTED_PO_STATE]->(po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(rfq:RFQ)
      WHERE NOT (po)-[:HAS_WAREHOUSE_DELIVERY]->()
      MATCH (po)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)<-[:RFQ_ITEM_PRODUCT]-(rfi:RFQItem)<-[:HAS_RFQ_ITEM]-(rfq)
      WHERE poi.POqt = rfi.RFQqt
      WITH po, collect({p: p, qty: rfi.RFQqt}) AS items ORDER BY rand() LIMIT 1
      MATCH (ro) WHERE id(ro) = idFrom("RolE", "WarehouseClerk")
      MATCH (ro)-[:IS_ACTIVE_ROLE]->(wc:Employee)
      WITH po, items, wc ORDER BY rand() LIMIT 1
      MATCH (po) WHERE NOT (po)-[:HAS_WAREHOUSE_DELIVERY]->()
      CREATE (po)-[:HAS_WAREHOUSE_DELIVERY]->(:WarehouseDelivery {Date: datetime(), Comment: "The products have been received as per PO at the Warehouse and the Inventory Levels have been updated accordingly."})-[:RECEIVED_BY]->(wc)
      WITH po, items
      UNWIND items AS item
      WITH po, item.p AS p, toInteger(item.qty) AS qty
      MATCH (p)-[:HAS_INVENTORY_LEVEL]->(inv), (p)-[:HAS_SUPPLY_ORDER]->(suo)
      CALL int.add(inv, "UnitsInStock", qty) YIELD result AS stock
      CALL int.add(suo, "UnitsOnOrder", -qty) YIELD result AS onOrder
      SET inv.LastUpdate = datetime()

  # ---------------------------------------------------------------------------
  # Threshold Recalibration (the slow job) -- StockThreshold = 150% of the
  # average monthly quantity ordered, then LowStock is re-evaluated for every
  # available product (new members are picked up by po-creation).
  # ---------------------------------------------------------------------------
  - name: threshold-recalibration
    source: { type: NumberIterator }
    maxPerSecond: 1
    parallelism: 1
    query: |-
      WITH toInteger($that) AS n WHERE n % 300 = 0
      MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
      MATCH (av) WHERE id(av) = idFrom("ProductStatusAvailablE")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_REORDER_LEVEL]->(re:ReorderLevel)
      MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(o:Order)
      WITH p, re, sum(oi.Quantity) AS TotalQuantityOrdered,
           count(DISTINCT (toString(o.OrderDate.year) + "-" + toString(o.OrderDate.month))) AS MonthsWithOrders
      SET re.StockThreshold = toInteger(round((toFloat(TotalQuantityOrdered) / MonthsWithOrders) * 1.5)), re.LastUpdate = datetime()
      WITH count(p) AS recalibrated
      MATCH (av), (ls) WHERE id(av) = idFrom("ProductStatusAvailablE") AND id(ls) = idFrom("LowStocK")
      MATCH (av)-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
      OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p)
      WHERE NOT (activePO)-[:HAS_WAREHOUSE_DELIVERY]->()
      WITH ls, p, r, i, sum(coalesce(poi.POqt, 0)) AS pending
      OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
      WITH ls, p, r, i, pending, sum(coalesce(oi.Quantity, 0)) AS openQty
      WITH ls, p, i.UnitsInStock + pending - openQty - (r.StockThreshold * 0.5) <= r.StockThreshold AS low
      OPTIONAL MATCH (ls)-[e:IS_LOW_STOCK_PRODUCT]->(p)
      FOREACH (_ IN CASE WHEN low AND e IS NULL THEN [1] ELSE [] END | CREATE (ls)-[:IS_LOW_STOCK_PRODUCT]->(p))
      FOREACH (_ IN CASE WHEN NOT low AND e IS NOT NULL THEN [1] ELSE [] END | DELETE e)

# =============================================================================
# STANDING QUERIES -- the company's rules. Each pattern is a Collection
# membership (state = position): "a business event happened" and "a node
# moved into a Collection" are the same thing. Writers move a node into a
# Collection LAST and out of its old Collection FIRST, so no rule ever sees a
# half-written node or a node in two states.
# =============================================================================
standingQueries:

  # --- nw-po-vetting-l1: PO in NewPoS -> L1: reject by rule / approve within the L1 limit / pass to L2
  - name: nw-po-vetting-l1
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (n:NewPoS)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (np0)-[np:IS_NEW_PO_STATE]->(po) WHERE id(np0) = idFrom("NewPoS")
            MATCH (po) WHERE NOT (po)-[:HAS_L1_PO_APPROVAL|HAS_L1_PO_REJECTION]->()
            MATCH (po)-[:PO_FOR_SUPPLIER]->(s:Supplier), (po)-[:HAS_PO_ITEM]->(it:POItem)-[:PO_ITEM_PRODUCT]->(pr:Product)
            OPTIONAL MATCH (av)-[avail:IS_AVAILABLE_PRODUCT]->(pr) WHERE id(av) = idFrom("ProductStatusAvailablE")
            WITH po, np, s, sum(it.POqt * (pr.UnitPrice * it.POPriceDiscount)) AS POCost,
                 collect(CASE WHEN avail IS NULL THEN pr.ProductName END) AS unavailable
            OPTIONAL MATCH (app)-[sa:IS_SUPPLIER_APPROVED_STATE]->(s) WHERE id(app) = idFrom("ApprovedSupplierS")
            MATCH (ro), (appr), (rej) WHERE id(ro) = idFrom("RolE", "Level1Approver") AND id(appr) = idFrom("ApprovedPoS") AND id(rej) = idFrom("RejectedPoS")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(l:Employee)
            WITH po, np, s, POCost, unavailable, sa, ro, appr, rej, l ORDER BY rand() LIMIT 1
            WITH po, np, POCost, ro, appr, rej, l,
                 CASE WHEN sa IS NULL THEN "supplier " + s.CompanyName + " is not approved"
                      WHEN size(unavailable) > 0 THEN "no longer available: " + reduce(t = "", x IN unavailable | t + x + " ")
                      ELSE null END AS reason
            WITH po, np, POCost, ro, appr, rej, l, reason,
                 CASE WHEN reason IS NOT NULL THEN "reject" WHEN POCost < ro.ApprovalLimit THEN "approve" ELSE "pass" END AS decision
            FOREACH (_ IN CASE WHEN decision = "reject" THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L1_PO_REJECTION]->(:VettingDecision {Date: datetime(), Comment: "Rejected by L1: " + reason})-[:VETTED_BY]->(l),
                     (rej)-[:IS_REJECTED_PO_STATE]->(po))
            FOREACH (_ IN CASE WHEN decision = "approve" THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L1_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Approved by L1: within the L1 approval limit"})-[:VETTED_BY]->(l),
                     (appr)-[:IS_APPROVED_PO_STATE]->(po))
            FOREACH (_ IN CASE WHEN decision = "pass" THEN [1] ELSE [] END |
              CREATE (po)-[:HAS_L1_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Vetted by L1, passed to L2: above the L1 approval limit"})-[:VETTED_BY]->(l))
            RETURN "[L1 " + CASE decision WHEN "reject" THEN "REJECTED] " WHEN "approve" THEN "APPROVED] " ELSE "-> L2] " END
                   + po.PONumber + " $" + toString(round(POCost, 2)) + CASE WHEN reason IS NULL THEN "" ELSE " (" + reason + ")" END AS alert
        destinations:
          - type: StandardOut

  # --- nw-po-vetting-l2: PO in NewPoS with an L1 approval -> L2: reject by rule / approve within the L2 limit / pass to L3
  - name: nw-po-vetting-l2
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (n:NewPoS)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder)-[:HAS_L1_PO_APPROVAL]->(d:VettingDecision) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (np0)-[np:IS_NEW_PO_STATE]->(po) WHERE id(np0) = idFrom("NewPoS")
            MATCH (po) WHERE (po)-[:HAS_L1_PO_APPROVAL]->() AND NOT (po)-[:HAS_L2_PO_APPROVAL|HAS_L2_PO_REJECTION]->()
            MATCH (po)-[:PO_FOR_SUPPLIER]->(s:Supplier), (po)-[:HAS_PO_ITEM]->(it:POItem)-[:PO_ITEM_PRODUCT]->(pr:Product)
            OPTIONAL MATCH (av)-[avail:IS_AVAILABLE_PRODUCT]->(pr) WHERE id(av) = idFrom("ProductStatusAvailablE")
            WITH po, np, s, sum(it.POqt * (pr.UnitPrice * it.POPriceDiscount)) AS POCost,
                 collect(CASE WHEN avail IS NULL THEN pr.ProductName END) AS unavailable
            OPTIONAL MATCH (app)-[sa:IS_SUPPLIER_APPROVED_STATE]->(s) WHERE id(app) = idFrom("ApprovedSupplierS")
            MATCH (ro), (appr), (rej) WHERE id(ro) = idFrom("RolE", "Level2Approver") AND id(appr) = idFrom("ApprovedPoS") AND id(rej) = idFrom("RejectedPoS")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(l:Employee)
            WITH po, np, s, POCost, unavailable, sa, ro, appr, rej, l ORDER BY rand() LIMIT 1
            WITH po, np, POCost, ro, appr, rej, l,
                 CASE WHEN sa IS NULL THEN "supplier " + s.CompanyName + " is not approved"
                      WHEN size(unavailable) > 0 THEN "no longer available: " + reduce(t = "", x IN unavailable | t + x + " ")
                      ELSE null END AS reason
            WITH po, np, POCost, ro, appr, rej, l, reason,
                 CASE WHEN reason IS NOT NULL THEN "reject" WHEN POCost < ro.ApprovalLimit THEN "approve" ELSE "pass" END AS decision
            FOREACH (_ IN CASE WHEN decision = "reject" THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L2_PO_REJECTION]->(:VettingDecision {Date: datetime(), Comment: "Rejected by L2: " + reason})-[:VETTED_BY]->(l),
                     (rej)-[:IS_REJECTED_PO_STATE]->(po))
            FOREACH (_ IN CASE WHEN decision = "approve" THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L2_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Approved by L2: within the L2 approval limit"})-[:VETTED_BY]->(l),
                     (appr)-[:IS_APPROVED_PO_STATE]->(po))
            FOREACH (_ IN CASE WHEN decision = "pass" THEN [1] ELSE [] END |
              CREATE (po)-[:HAS_L2_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Vetted by L2, passed to L3: above the L2 approval limit"})-[:VETTED_BY]->(l))
            RETURN "[L2 " + CASE decision WHEN "reject" THEN "REJECTED] " WHEN "approve" THEN "APPROVED] " ELSE "-> L3] " END
                   + po.PONumber + " $" + toString(round(POCost, 2)) + CASE WHEN reason IS NULL THEN "" ELSE " (" + reason + ")" END AS alert
        destinations:
          - type: StandardOut

  # --- nw-po-vetting-l3: PO in NewPoS with an L2 approval -> L3: reject by rule or over every limit / approve
  - name: nw-po-vetting-l3
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (n:NewPoS)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder)-[:HAS_L2_PO_APPROVAL]->(d:VettingDecision) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (np0)-[np:IS_NEW_PO_STATE]->(po) WHERE id(np0) = idFrom("NewPoS")
            MATCH (po) WHERE (po)-[:HAS_L2_PO_APPROVAL]->() AND NOT (po)-[:HAS_L3_PO_APPROVAL|HAS_L3_PO_REJECTION]->()
            MATCH (po)-[:PO_FOR_SUPPLIER]->(s:Supplier), (po)-[:HAS_PO_ITEM]->(it:POItem)-[:PO_ITEM_PRODUCT]->(pr:Product)
            OPTIONAL MATCH (av)-[avail:IS_AVAILABLE_PRODUCT]->(pr) WHERE id(av) = idFrom("ProductStatusAvailablE")
            WITH po, np, s, sum(it.POqt * (pr.UnitPrice * it.POPriceDiscount)) AS POCost,
                 collect(CASE WHEN avail IS NULL THEN pr.ProductName END) AS unavailable
            OPTIONAL MATCH (app)-[sa:IS_SUPPLIER_APPROVED_STATE]->(s) WHERE id(app) = idFrom("ApprovedSupplierS")
            MATCH (ro), (appr), (rej) WHERE id(ro) = idFrom("RolE", "Level3Approver") AND id(appr) = idFrom("ApprovedPoS") AND id(rej) = idFrom("RejectedPoS")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(l:Employee)
            WITH po, np, s, POCost, unavailable, sa, ro, appr, rej, l ORDER BY rand() LIMIT 1
            WITH po, np, POCost, ro, appr, rej, l,
                 CASE WHEN sa IS NULL THEN "supplier " + s.CompanyName + " is not approved"
                      WHEN size(unavailable) > 0 THEN "no longer available: " + reduce(t = "", x IN unavailable | t + x + " ")
                      WHEN POCost >= ro.ApprovalLimit THEN "exceeds every approval limit"
                      ELSE null END AS reason
            FOREACH (_ IN CASE WHEN reason IS NOT NULL THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L3_PO_REJECTION]->(:VettingDecision {Date: datetime(), Comment: "Rejected by L3: " + reason})-[:VETTED_BY]->(l),
                     (rej)-[:IS_REJECTED_PO_STATE]->(po))
            FOREACH (_ IN CASE WHEN reason IS NULL THEN [1] ELSE [] END |
              DELETE np
              CREATE (po)-[:HAS_L3_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Approved by L3: within the L3 approval limit"})-[:VETTED_BY]->(l),
                     (appr)-[:IS_APPROVED_PO_STATE]->(po))
            RETURN "[L3 " + CASE WHEN reason IS NULL THEN "APPROVED] " ELSE "REJECTED] " END
                   + po.PONumber + " $" + toString(round(POCost, 2)) + CASE WHEN reason IS NULL THEN "" ELSE " (" + reason + ")" END AS alert
        destinations:
          - type: StandardOut

  # --- nw-low-stock-after-reject: PO in RejectedPoS -> its products go back to LowStock if they still meet the reorder rule
  - name: nw-low-stock-after-reject
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (r:RejectedPoS)-[:IS_REJECTED_PO_STATE]->(po:PurchaseOrder) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (av), (ls) WHERE id(av) = idFrom("ProductStatusAvailablE") AND id(ls) = idFrom("LowStocK")
            MATCH (po)-[:HAS_PO_ITEM]->(:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(av)
            MATCH (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
            OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p)
            WHERE NOT (activePO)-[:HAS_WAREHOUSE_DELIVERY]->()
            WITH po, ls, p, r, i, sum(coalesce(poi.POqt, 0)) AS pending
            OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
            WITH po, ls, p, r, i, pending, sum(coalesce(oi.Quantity, 0)) AS openQty
            WITH po, ls, p, i.UnitsInStock + pending - openQty - (r.StockThreshold * 0.5) <= r.StockThreshold AS low
            OPTIONAL MATCH (ls)-[e:IS_LOW_STOCK_PRODUCT]->(p)
            FOREACH (_ IN CASE WHEN low AND e IS NULL THEN [1] ELSE [] END | CREATE (ls)-[:IS_LOW_STOCK_PRODUCT]->(p))
            FOREACH (_ IN CASE WHEN NOT low AND e IS NOT NULL THEN [1] ELSE [] END | DELETE e)
            WITH po, collect(CASE WHEN low THEN p.ProductName END) AS backInLowStock
            RETURN "[LOWSTOCK RECHECK] after rejection of " + po.PONumber + ": "
                   + CASE WHEN size(backInLowStock) = 0 THEN "no product back in LowStock" ELSE "back in LowStock: " + reduce(t = "", x IN backInLowStock | t + x + " ") END AS alert
        destinations:
          - type: StandardOut

  # --- nw-buyer-submission: PO in ApprovedPoS -> the Buyer submits it to the supplier (SupplierNewPoS edge last)
  - name: nw-buyer-submission
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (a:ApprovedPoS)-[:IS_APPROVED_PO_STATE]->(po:PurchaseOrder) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (a)-[ap:IS_APPROVED_PO_STATE]->(po) WHERE id(a) = idFrom("ApprovedPoS")
            MATCH (po) WHERE NOT (po)-[:HAS_BUYER_PO_APPROVAL]->()
            MATCH (po)-[:PO_FOR_SUPPLIER]->(s:Supplier)-[:HAS_SUPPLIER_NEW_PENDING_POS]->(snp)
            MATCH (ro), (su) WHERE id(ro) = idFrom("RolE", "Buyer") AND id(su) = idFrom("SubmittedPoS")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(bu:Employee)
            WITH po, ap, s, snp, su, bu ORDER BY rand() LIMIT 1
            CREATE (po)-[:HAS_BUYER_PO_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Submitted to the Supplier by the Buyer"})-[:VETTED_BY]->(bu),
                   (po)-[:HAS_SUPPLIER_NEW_RFQ]->(:PoNewRFQ {Name: "PoNewRFQ"}),
                   (po)-[:HAS_SUPPLIER_REJECTED_RFQ]->(:PoRejectedRFQ {Name: "PoRejectedRFQ"}),
                   (su)-[:IS_SUBMITTED_PO_STATE]->(po)
            DELETE ap
            WITH po, s, snp
            CREATE (snp)-[:IS_SUPPLIER_NEW_PO_STATE]->(po)
            RETURN "[SUBMITTED] " + po.PONumber + " sent to " + s.CompanyName + ", awaiting its RFQ" AS alert
        destinations:
          - type: StandardOut

  # --- nw-rfq-vetting: RFQ in a submitted PO's PoNewRFQ -> approve within the PO budget, else reject
  - name: nw-rfq-vetting
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (s:SubmittedPoS)-[:IS_SUBMITTED_PO_STATE]->(po:PurchaseOrder)-[:HAS_SUPPLIER_NEW_RFQ]->(pnr:PoNewRFQ)-[:IS_SUPPLIER_NEW_RFQ]->(rfq:RFQ) RETURN DISTINCT id(rfq) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (rfq) WHERE id(rfq) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (pnr)-[r:IS_SUPPLIER_NEW_RFQ]->(rfq)-[:IS_RFQ_FOR_PO]->(po:PurchaseOrder)-[:HAS_SUPPLIER_REJECTED_RFQ]->(prr)
            MATCH (rfq)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p:Product)<-[:PO_ITEM_PRODUCT]-(poi:POItem)<-[:HAS_PO_ITEM]-(po)
            WITH rfq, r, po, prr,
                 sum(rfi.RFQqt * rfi.RFQcost) AS quoted,
                 sum(poi.POqt * (p.UnitPrice * poi.POPriceDiscount)) AS budget,
                 collect(CASE WHEN poi.POqt * (p.UnitPrice * poi.POPriceDiscount) < rfi.RFQqt * rfi.RFQcost THEN p.ProductName END) AS overBudget
            OPTIONAL MATCH (po)-[already:HAS_APPROVED_RFQ]->()
            MATCH (ro) WHERE id(ro) = idFrom("RolE", "Buyer")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(bu:Employee)
            WITH rfq, r, po, prr, quoted, budget, overBudget, already, bu ORDER BY rand() LIMIT 1
            WITH rfq, r, po, prr, quoted, budget, bu,
                 CASE WHEN already IS NOT NULL THEN "the PO already has an approved RFQ"
                      WHEN size(overBudget) > 0 THEN "over budget on " + reduce(t = "", x IN overBudget | t + x + " ")
                      ELSE null END AS reason
            FOREACH (_ IN CASE WHEN reason IS NOT NULL THEN [1] ELSE [] END |
              DELETE r
              CREATE (rfq)-[:HAS_BUYER_RFQ_REJECTION]->(:VettingDecision {Date: datetime(), Comment: "Rejected by the Buyer: " + reason})-[:VETTED_BY]->(bu),
                     (prr)-[:IS_SUPPLIER_REJECTED_RFQ_STATE]->(rfq))
            FOREACH (_ IN CASE WHEN reason IS NULL THEN [1] ELSE [] END |
              DELETE r
              CREATE (rfq)-[:HAS_BUYER_RFQ_APPROVAL]->(:VettingDecision {Date: datetime(), Comment: "Approved by the Buyer: within the PO budget"})-[:VETTED_BY]->(bu),
                     (po)-[:HAS_APPROVED_RFQ]->(rfq))
            RETURN "[RFQ " + CASE WHEN reason IS NULL THEN "APPROVED] " ELSE "REJECTED] " END + rfq.RFQNumber + " for " + po.PONumber
                   + " quoted $" + toString(round(quoted, 2)) + " / budget $" + toString(round(budget, 2))
                   + CASE WHEN reason IS NULL THEN "" ELSE " (" + reason + ")" END AS alert
        destinations:
          - type: StandardOut

  # --- nw-rfq-approved-on-order: PO gets an approved RFQ -> UnitsOnOrder += RFQ quantities, once (rfq.OnOrderPosted)
  - name: nw-rfq-approved-on-order
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(rfq:RFQ) RETURN DISTINCT id(rfq) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (rfq) WHERE id(rfq) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
              AND rfq.OnOrderPosted IS NULL
            SET rfq.OnOrderPosted = datetime()
            WITH rfq
            MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(rfq)-[:HAS_RFQ_ITEM]->(rfi:RFQItem)-[:RFQ_ITEM_PRODUCT]->(p:Product)-[:HAS_SUPPLY_ORDER]->(suo)
            CALL int.add(suo, "UnitsOnOrder", toInteger(rfi.RFQqt)) YIELD result
            RETURN "[ON ORDER] " + po.PONumber + ": " + reduce(t = "", x IN collect(p.ProductName + " +" + toString(toInteger(rfi.RFQqt))) | t + x + "  ") AS alert
        destinations:
          - type: StandardOut

  # --- nw-finance-closure: submitted PO gets a WarehouseDelivery -> Finance pays and closes it
  - name: nw-finance-closure
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: |-
        MATCH (sub:SubmittedPoS)-[:IS_SUBMITTED_PO_STATE]->(po:PurchaseOrder)-[:HAS_WAREHOUSE_DELIVERY]->(d:WarehouseDelivery) RETURN DISTINCT id(po) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (t) WHERE id(t) = idFrom("PoS")
            MATCH (cpo)<-[:HAS_CLOSED_PO_STATE]-(t)-[:HAS_SUBMITTED_PO_STATE]->(:SubmittedPoS)-[r1:IS_SUBMITTED_PO_STATE]->(po)-[:HAS_WAREHOUSE_DELIVERY]->(:WarehouseDelivery),
                  (po)<-[r2:IS_SUPPLIER_OPEN_PO_STATE]-(:SupplierOpenPoS)<-[:HAS_SUPPLIER_OPEN_POS]-(su:Supplier)-[:HAS_SUPPLIER_CLOSED_POS]->(scp)
            MATCH (po) WHERE NOT (po)-[:HAS_FINANCE_PAYMENT]->()
            MATCH (ro) WHERE id(ro) = idFrom("RolE", "Finance")
            MATCH (ro)-[:IS_ACTIVE_ROLE]->(f:Employee)
            WITH po, cpo, scp, r1, r2, su, f ORDER BY rand() LIMIT 1
            CREATE (po)-[:HAS_FINANCE_PAYMENT]->(:FinancePayment {Date: datetime(), Comment: "The PO has been paid by Finance and the PO is now closed."})-[:PAID_BY]->(f),
                   (cpo)-[:IS_CLOSED_PO_STATE]->(po),
                   (scp)-[:HAS_SUPPLIER_CLOSED_PO_STATE]->(po)
            DELETE r1, r2
            RETURN "[PO CLOSED] " + po.PONumber + " paid to " + su.CompanyName AS alert
        destinations:
          - type: StandardOut


  # --- a new customer order re-evaluates LowStock for its products ----------
  # Gated on Simulation.Ready: the open orders the batch imports fire this too,
  # and are skipped -- the batch evaluates LowStock once for all of them.
  - name: nw-low-stock-on-new-order
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: MATCH (op:OrderStatusOpeN)-[:IS_OPEN_ORDER_STATE]->(o:Order) RETURN DISTINCT id(o) AS id
    outputs:
      - name: act
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (o) WHERE id(o) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (sim) WHERE id(sim) = idFrom("Simulation") AND sim.Ready = true
            MATCH (av), (ls) WHERE id(av) = idFrom("ProductStatusAvailablE") AND id(ls) = idFrom("LowStocK")
            MATCH (o)-[:HAS_ORDER_ITEM]->(:OrderItem)-[:ORDER_ITEM_PRODUCT]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(av)
            MATCH (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
            OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[:HAS_PO_ITEM]->(poi:POItem)-[:PO_ITEM_PRODUCT]->(p)
            WHERE NOT (activePO)-[:HAS_WAREHOUSE_DELIVERY]->()
            WITH o, ls, p, r, i, sum(coalesce(poi.POqt, 0)) AS pending
            OPTIONAL MATCH (p)<-[:ORDER_ITEM_PRODUCT]-(oi:OrderItem)<-[:HAS_ORDER_ITEM]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
            WITH o, ls, p, r, i, pending, sum(coalesce(oi.Quantity, 0)) AS openQty
            WITH o, ls, p, i.UnitsInStock + pending - openQty - (r.StockThreshold * 0.5) <= r.StockThreshold AS low
            OPTIONAL MATCH (ls)-[e:IS_LOW_STOCK_PRODUCT]->(p)
            FOREACH (_ IN CASE WHEN low AND e IS NULL THEN [1] ELSE [] END | CREATE (ls)-[:IS_LOW_STOCK_PRODUCT]->(p))
            FOREACH (_ IN CASE WHEN NOT low AND e IS NOT NULL THEN [1] ELSE [] END | DELETE e)
            WITH o, count(p) AS lines, collect(CASE WHEN low AND e IS NULL THEN p.ProductName END) AS entered
            RETURN "[ORDER] " + o.OrderID + " (" + toString(lines) + " product(s))"
                   + CASE WHEN size(entered) = 0 THEN "" ELSE " -> LowStock + " + reduce(t = "", x IN entered | t + x + "  ") END AS alert
        destinations:
          - type: StandardOut

  # --- read-only alerts --------------------------------------------------------
  - name: nw-log-po-created
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: MATCH (n:NewPoS)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder) RETURN DISTINCT id(po) AS id
    outputs:
      - name: alert
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (po) WHERE id(po) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (po)-[:PO_FOR_SUPPLIER]->(s:Supplier), (po)-[:HAS_PO_ITEM]->(it:POItem)-[:PO_ITEM_PRODUCT]->(p:Product)
            OPTIONAL MATCH (po)-[:HAS_PREVIOUS_PO]->(prev:PurchaseOrder)
            WITH po, s, collect(DISTINCT p.ProductName + " x" + toString(it.POqt)) AS lines, collect(DISTINCT prev.PONumber) AS prevs
            RETURN "[PO CREATED] " + po.PONumber + " to " + s.CompanyName + ": " + reduce(t = "", l IN lines | t + l + "  ")
                   + CASE WHEN size(prevs) = 0 THEN "" ELSE "(re-order of " + reduce(t = "", x IN prevs | t + x + " ") + ")" END AS alert
        destinations:
          - type: StandardOut

  - name: nw-log-shipped
    pattern:
      type: Cypher
      mode: DISTINCT_ID
      query: MATCH (f:OrderStatusFulfilleD)-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[:HAS_WAREHOUSE_FULFILLMENT]->(w:WarehouseFulfillment) RETURN DISTINCT id(o) AS id
    outputs:
      - name: alert
        filter: { type: OnlyPositiveMatch }
        resultEnrichment:
          query: |-
            MATCH (o) WHERE id(o) = quineId($that.data.id) AND $that.meta.isPositiveMatch = true
            MATCH (o)-[:HAS_ORDER_CUSTOMER]->(c:Customer), (o)-[:HAS_ORDER_ITEM]->(oi:OrderItem)
            RETURN "[SHIPPED] " + o.OrderID + " to " + c.CompanyName + " (" + toString(count(oi)) + " line(s))" AS alert
        destinations:
          - type: StandardOut

