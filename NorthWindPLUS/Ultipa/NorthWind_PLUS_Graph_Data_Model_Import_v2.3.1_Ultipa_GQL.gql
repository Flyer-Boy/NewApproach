// Property indexes for the Order Details join below (not in the Cypher script -- Neo4j got away without them).
// Without them each of the ~2,155 order-detail rows scans every Order and every Product, which can exceed the driver's 30s default deadline.
// GQLDB builds indexes in the background: SHOW INDEX shows progress.
// RUN THESE TWO ONCE PER GRAPH: indexes survive "MATCH (n) DETACH DELETE n", and creating one that already exists fails with error 5017.
// On a brand-new graph, uncomment them (or run them by hand) before the Order Details load.
