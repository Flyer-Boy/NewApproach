// The bellow command will create 50 Random Customer orders.
// GQL port notes:
//  - GQLDB's LIMIT takes a literal integer, so "LIMIT toInteger(round(rand()*10 + 1))" can't be written directly. Instead, 11 random Products are
//    picked (ORDER BY random() LIMIT 11) and the first k of them are used, with k a random integer from 1 to 11.
//  - If your GQLDB build rejects INSERT inside CALL, run "python NorthwindPlus_Stress_Test_Ultipa.py --loop customer-order --rate 600 --duration 5"
//    instead (about 50 orders in 5 seconds), then continue with the next statement.
FOR i IN range(1, 50)
CALL (i) {
  MATCH (e:Employee)-[]-(:RolE {Title: "Sales Representative"}), (op:OrderStatusOpeN {Status: "Open"})
  ORDER BY random() LIMIT 1
  MATCH (c:Customer)
  ORDER BY random() LIMIT 1
  INSERT (op)-[:IS_OPEN_ORDER_STATE]->(o:Order {OrderDate: local_datetime(), RequiredDate: date_add(local_datetime(), 7, "day")}),
         (o)-[:HAS_ORDER_CUSTOMER]->(c),
         (o)-[:SOLD_BY]->(e)
  SET o.OrderID = "CO-" || left(o._id, 5) || right(o._id, 5)
  CALL (o) {
    MATCH (p:Product)-[]-(:ProductStatusAvailablE {Status: "Available"})
    ORDER BY random() LIMIT 11
    RETURN collect(p.ProductID) AS candidateIDs
  }
  LET k = to_integer(round(random() * 10 + 1))
  FOR pid IN candidateIDs[0:k]
  MATCH (p:Product WHERE p.ProductID = pid)
  INSERT (o)-[ins_e1:HAS_ORDER_PRODUCT {Quantity: to_integer(round(random() * 19) + 1), UnitPrice: p.UnitPrice, Discount: random() * 0.07}]->(p)
};

// ###### Run the **Inventory Level Report** ######
// You will see how the Inventory Level changes after the random Customer Orders were created.
// Feel free to run the above command multiple times to create more random Customer Orders and see how the Inventory Level changes after each run.


// You will notice that the above command creates a random Customer Order with 1 to 11 products and it only creates one new Order node per Order and the rest is managed by the relatioships.
// Unlike Relational databases, where you would likely have to create new records for each Item in the Order table,
// in a Graph database you can create a single Order node and connect it to multiple Product nodes with the HAS_ORDER_PRODUCT relationship,
// which can hold the Quantity, UnitPrice, and Discount properties for each product in the order.

// Let's check which Products have Stock Levels below the Restock Threshold level so we can place new POs with their respective Suppliers.
// We will set a minimum order quantity based on the current stock level and the reorder threshold.
// (Cypher's integer division r.StockThreshold/2 is written to_integer(floor(r.StockThreshold / 2)) because GQL "/" returns a FLOAT.)
MATCH (s:Supplier)-[]->(p:Product)<-[]-(a:ProductStatusAvailablE), (r:ReorderLevel)<-[]-(p)-[]->(i:InventoryLevel)
WHERE i.UnitsInStock <= r.StockThreshold
RETURN DISTINCT s.SupplierID, s.CompanyName, p.ProductName, p.ProductID, i.UnitsInStock, r.StockThreshold,
       (r.StockThreshold) - i.UnitsInStock + to_integer(floor(r.StockThreshold / 2)) AS MinOrder
ORDER BY s.SupplierID;

// Let's check the open Customer Orders by Product.
MATCH (p:Product)<-[cop:HAS_ORDER_PRODUCT]-(o:Order)-[]-(op:OrderStatusOpeN {Status: "Open"})
RETURN p.ProductID AS ProductID, sum(cop.Quantity) AS OpenQuantity
ORDER BY ProductID;

// Creating PO's states schemas in preparation for the PO Vetting process.

// For PO States, I will create the respective Node Labels and property names.
// Create the PO Domain Collection Nodes.
// The "PoS" Node/Collection is the superset of all the PO States.
INSERT (t:PoS {Name: "PoS"}),
       (t)-[:HAS_NEW_PO_STATE]->(ins_n1:NewPoS {Name: "NewPoS"}),
       (t)-[:HAS_APPROVED_PO_STATE]->(ins_n2:ApprovedPoS {Name: "ApprovedPoS"}),
       (t)-[:HAS_REJECTED_PO_STATE]->(ins_n3:RejectedPoS {Name: "RejectedPoS"}),
       (t)-[:HAS_SUBMITTED_PO_STATE]->(ins_n4:SubmittedPoS {Name: "SubmittedPoS"}),
       (t)-[:HAS_CLOSED_PO_STATE]->(ins_n5:ClosedPoS {Name: "ClosedPoS"});

// Procurement Perspective: As we move the POs through the Vetting process, we will connect the PO State to the POs.
// We will use the following Ontology for this:
// For Approved POs: (PO)<-[:IS_APPROVED_PO_STATE {Date:datetime()}]-(:ApprovedPoS {Name:"ApprovedPoS"}) - POs approved during the vetting workflow.
// For Rejected POs: (PO)<-[:IS_REJECTED_PO_STATE {Date:datetime()}]-(:RejectedPoS {Name:"RejectedPoS"}) - POs rejected during the vetting workflow.
// For Submitted POs: (PO)<-[:IS_SUBMITTED_PO_STATE {Date:datetime()}]-(:SubmittedPoS {Name:"SubmittedPoS"}) - Approved POs submitted to the Supplier so they can send an RFQ.
// For Closed POs: (PO)<-[:IS_CLOSED_PO_STATE {Date:datetime()}]-(:ClosedPoS {Name:"ClosedPoS"}) - POs closed (RFQ approved and products delivered, all RFQs rejected, PO canceled, etc.).

// We will also create a collection of POs for the Supplier to see only the POs that matter to them. We will use them later in the PO Submission and RFQ process.
// Suppliers must have a collection to hold the New POs so they can query, "What new/open POs do I have to submit RFQs for?" You might say: "Easy, check all the Approved/Submitted POs from Procurement where I am the Supplier."
// However, we don't want a query from the Supplier frontend to have access to all the Approved/Submitted POs from Procurement, but only to a subset controlled by Procurement containing their POs.
// This subset that the Supplier has access to is the collection I am referring to.
// Procurement will then "connect" the Submitted POs to this Supplier Collection, where the Supplier can see only the POs that matter to them.
// There is much more to access rights that I have not covered in these code comments or in my articles. However, access rights are considered throughout this model.
// The original models/graph from which these concepts came used DRM down to the Node level. This was a huge overhead at the time, but it helped frame our work and models.
// I will write about this in an article at some point. For now, let's get our model working.

// SupplierNewPoS answers to supplier question: Do I have any new PO's
// SupplierOpenPoS answers to supplier question: Do I have PO's in progress that require my followup
MATCH (s:Supplier)
INSERT (s)-[:HAS_SUPPLIER_NEW_PENDING_POS]->(ins_n1:SupplierNewPoS {Name: "SupplierNewPoS"}),
       (s)-[:HAS_SUPPLIER_OPEN_POS]->(ins_n2:SupplierOpenPoS {Name: "SupplierOpenPoS"}),
       (s)-[:HAS_SUPPLIER_CLOSED_POS]->(ins_n3:SupplierClosedPoS {Name: "SupplierClosedPoS"});

// Supplier Perspective: As the Supplier receives POs and start submitting RFQ's we will move (disconnect/connect) the 'POs from the Supplier collections as they are addressed.
// We will use the following Ontology for this:
// For New incoming POs: (PO)<-[:IS_SUPPLIER_NEW_PO_STATE {Date:datetime()}]-(:SupplierNewPoS {Name:"SupplierNewPoS"}) - New POs submitted by Buyer.
// For Open/Replied POs: (PO)<-[:IS_SUPPLIER_OPEN_PO_STATE {Date:datetime()}]-(:SupplierOpenPoS {Name:"SupplierOpenPoS"}) - POs that the Supplier has an RFQ, is negotiating or has still to deliver the products.
// For Closed POs: (PO)<-[:HAS_SUPPLIER_CLOSED_PO_STATE {Date:datetime()}]-(:SupplierClosedPoS {Name:"SupplierClosedPoS"}) - POs closed (RFQ approved and products delivered, all RFQs rejected, PO canceled, etc.).


//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **PO Creation**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// The Procurement Assistant will create POs for Suppliers whose Products have low Inventory Levels (nearing restock threashold level).
// Select a random Employee with the role "Procurement Assistant".
// Make sure the Product is available for sale and is supplied by the Supplier.
// Check if there are any open POs for this Product that have not yet been fulfilled, and any open Customer Orders for this Product that have not yet been fulfilled.
// Check if the Product's Inventory Level is below the Reorder Threshold level, taking into account any open POs and open Customer Orders.
// Calculate the minimum order quantity based on the current stock level, the reorder threshold, and any open POs and open Customer Orders, plus 1 (minimum order quantity).
// Create ONE Purchase Order per Supplier with the Products that have low Inventory Levels, connect it to the Supplier and to the Procurement Assistant who created it,
// and add the PO items with a 30% discount applied to the UnitPrice.
MATCH (pa:RolE {Title: "Procurement Assistant"})-[:IS_ACTIVE_ROLE]->(e:Employee), (n:NewPoS {Name: "NewPoS"})
ORDER BY random() LIMIT 1
MATCH (s:Supplier)-[:SUPPLIES]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(a:ProductStatusAvailablE),
      (r:ReorderLevel)<-[:HAS_REORDER_LEVEL]-(p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[poi2:HAS_PO_ITEM]->(p)
RETURN e, n, s, p, r, i, sum(coalesce(poi2.POqt, 0)) AS AlreadyPendingQty
NEXT
OPTIONAL MATCH (p)<-[op:HAS_ORDER_PRODUCT]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
RETURN e, n, s, p, r, i, AlreadyPendingQty, sum(coalesce(op.Quantity, 0)) AS OpenOrderQty
NEXT
FILTER i.UnitsInStock + AlreadyPendingQty - OpenOrderQty - (r.StockThreshold * 0.5) <= r.StockThreshold
RETURN e, n, s, collect({ProductID: p.ProductID,
                         qty: (r.StockThreshold) - (i.UnitsInStock + AlreadyPendingQty - OpenOrderQty) + (r.StockThreshold * 2) + 1}) AS orderItems
NEXT
INSERT (n)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder {PODate: local_datetime()}),
       (po)-[:PO_FOR_SUPPLIER]->(s),
       (po)-[:PO_CREATED_BY]->(e)
SET po.PONumber = "PO-" || left(po._id, 5) || right(po._id, 5)
FOR item IN orderItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (po)-[ins_e1:HAS_PO_ITEM {POqt: item.qty, POPriceDiscount: 0.7}]->(p)
RETURN DISTINCT po.PONumber AS PONumber, s.SupplierID AS SupplierID, size(orderItems) AS ItemCount;


// ###### Run the **Inventory Level Report** ######
// You will see how the Inventory Level changes after the POs were created.
// You will notice that the Inventory Level has not changed yet, as the POs have not been fulfilled yet,
// but you will see the OpePO quantys in the report, which are the quantities of products that are on open POs that have not yet been fulfilled.

// Check the POs that were created:
MATCH n = (p:PurchaseOrder)-[]->() RETURN n;

//Let's get the PO costs per product and the total cost per PO.
MATCH (p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product),
      (p)-[:PO_FOR_SUPPLIER]-(s:Supplier)
LET EstimatedCost = poi.POqt * i.UnitPrice
// Find the total cost for each specific purchase order.
MATCH (p)-[r:HAS_PO_ITEM]->(otherItem:Product)
RETURN p, s, poi, i, EstimatedCost, sum(r.POqt * otherItem.UnitPrice) AS TotalPurchaseOrderCost
NEXT
RETURN p.PONumber AS PONumber,
       p.PODate AS PODate,
       s.SupplierID AS SupplierID,
       s.CompanyName AS CompanyName,
       i.ProductName AS ProductName,
       poi.POqt AS POqt,
       i.UnitPrice AS UnitPrice,
       EstimatedCost,
       TotalPurchaseOrderCost
ORDER BY SupplierID, PONumber;



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **PO Vetting**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// We will do a 3+1 Level Vetting process folowing the PO Budget approval level of each Procurement Approver as defined by their Role.
// GQL port note: Cypher's "ORDER BY p" (by internal node id) is written "ORDER BY p.PONumber" -- GQL has no ordering on node values.
//                Cypher's "WITH ... LIMIT n WHERE cond" (filter applied after the limit) is written "RETURN ... LIMIT n NEXT FILTER cond".

//Summary of New (pending approval) POs by Total Cost (we will apply a ~30% standard discount by Suppliers as product cost).
MATCH (:NewPoS {Name: "NewPoS"})-[r]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier)
RETURN p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS EstimatedCost
ORDER BY EstimatedCost;

// **Level 1 vetting**

// Level 1 is now ready to vet the New (pending approval) POs.
// For our Demo, we will Reject two POs at Level 1 so we have one instance (we will resubmit one of them later)
MATCH (l1:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level1Approver"}), (a:RejectedPoS {Name: "RejectedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier)
RETURN a, ro, l1, np, p, p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
ORDER BY PONumber LIMIT 2
NEXT
FILTER POCost > ro.ApprovalBase
INSERT (p)-[ins_e1:HAS_L1_PO_REJECTION {Date: local_datetime(), Comment: "This PO is rejected by L1 due to..< Rejection justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l1),
       (a)-[ins_e2:IS_REJECTED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;


// Let's have the L1 approver approve all the remaining applicable POs.
// We select the POs that are below the L1 Approval Limit and move them to the Approved State. For Demo purposes we will only approve 20 PO's here
MATCH (l1:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level1Approver"}), (a:ApprovedPoS {Name: "ApprovedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier)
RETURN a, ro, l1, np, p, p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
ORDER BY PONumber LIMIT 20
NEXT
FILTER POCost > ro.ApprovalBase AND POCost < ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L1_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by L1 due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l1),
       (a)-[ins_e2:IS_APPROVED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;

// Level 1 is now ready to vet the New (pending approval) POs whose cost exceeds the Level 1 approval limit, so they cannot fully approve them,
// however, they will still vet them so the next Approval level can continue the approval process.
MATCH (l1:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level1Approver"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier)
RETURN ro, l1, np, p, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
NEXT
FILTER POCost > ro.ApprovalBase AND POCost > ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L1_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by L1 due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l1);


// The original script's comment here asked for a single statement that could conditionally CREATE/DELETE (a CASE around write clauses), as an
// enhancement request for the Graph Database provider. ISO GQL has no conditional write clause either, so that note still applies to GQLDB.

// **Level 2 vetting**

// Now we move to Level 2 vetting - similar to Level 1, but we will check whether L1 has already approved the PO.
MATCH (l2:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level2Approver"}), (a:ApprovedPoS {Name: "ApprovedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier), (p)-[:HAS_L1_PO_APPROVAL]-()
RETURN a, ro, l2, np, p, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
NEXT
FILTER POCost > ro.ApprovalBase AND POCost < ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L2_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by L2 due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l2),
       (a)-[ins_e2:IS_APPROVED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;

// Level 2 is now ready to vet the New (pending approval) POs whose cost exceeds the Level 2 approval limit, so they cannot fully approve them,
// however, they will still vet them so the next Approval level can continue the approval process.

// For our Demo, we will Reject one PO at level 2 so we have one instance s these PO will not be approved by L3 as it will be rejected at L2 despite the fact that they were approved at L1 and beyond the L2 approval limit.
MATCH (l2:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level2Approver"}), (a:RejectedPoS {Name: "RejectedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier), (p)-[:HAS_L1_PO_APPROVAL]-()
RETURN a, ro, l2, np, p, p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
ORDER BY PONumber LIMIT 1
NEXT
FILTER POCost > ro.ApprovalBase AND POCost > ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L2_PO_REJECTION {Date: local_datetime(), Comment: "This PO is rejected by L2 due to..< Rejection justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l2),
       (a)-[ins_e2:IS_REJECTED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;


MATCH (l2:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level2Approver"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier), (p)-[:HAS_L1_PO_APPROVAL]-()
RETURN ro, l2, np, p, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
NEXT
FILTER POCost > ro.ApprovalBase AND POCost > ro.ApprovalLimit
INSERT (p)-[ins_e3:HAS_L2_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by L2 due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l2);


// **Level 3 vetting**

//Finally, Level 3 vetting
// For our Demo, we will Reject one PO at level 3 so we have one instance
MATCH (l3:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level3Approver"}), (a:RejectedPoS {Name: "RejectedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier), (p)-[:HAS_L2_PO_APPROVAL]-()
RETURN a, ro, l3, np, p, p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
ORDER BY PONumber LIMIT 1
NEXT
FILTER POCost > ro.ApprovalBase AND POCost < ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L3_PO_REJECTION {Date: local_datetime(), Comment: "This PO is rejected by L3 due to..< Rejection justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l3),
       (a)-[ins_e2:IS_REJECTED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;


// Level 3 will approve the two remaining PO's , so we leave some PO's pending approval.
MATCH (l3:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Level3Approver"}), (a:ApprovedPoS {Name: "ApprovedPoS"})
ORDER BY random() LIMIT 1
MATCH (:NewPoS {Name: "NewPoS"})-[np]->(p:PurchaseOrder)-[poi:HAS_PO_ITEM]->(i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier), (p)-[:HAS_L2_PO_APPROVAL]-()
RETURN a, ro, l3, np, p, p.PONumber AS PONumber, sum(poi.POqt * (i.UnitPrice * poi.POPriceDiscount)) AS POCost
ORDER BY PONumber LIMIT 2
NEXT
FILTER POCost > ro.ApprovalBase AND POCost < ro.ApprovalLimit
INSERT (p)-[ins_e1:HAS_L3_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by L3 due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(l3),
       (a)-[ins_e2:IS_APPROVED_PO_STATE {Date: local_datetime()}]->(p)
DELETE np;



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **PO Resubmission**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Remember those PO's that were rejected, well, we will now act as one of the Procurement Assistants that had one PO rejected and have him/her resubmit the PO
// Notice that the New PO will point back to the Rejected one for auditing and added context
MATCH (re:RejectedPoS)-[:IS_REJECTED_PO_STATE]->(rpo:PurchaseOrder)-[:PO_CREATED_BY]->(e:Employee),
      (rpo)-[:PO_FOR_SUPPLIER]->(s:Supplier),
      (n:NewPoS {Name: "NewPoS"})
WHERE NOT EXISTS { MATCH ()-[:HAS_PREVIOUS_PO]->(rpo) }
ORDER BY random() LIMIT 1
MATCH (rpo)-[:HAS_PO_ITEM]->(p)<-[:SUPPLIES]-(s),
      (p)<-[:IS_AVAILABLE_PRODUCT]-(:ProductStatusAvailablE),
      (r:ReorderLevel)<-[:HAS_REORDER_LEVEL]-(p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[poi2:HAS_PO_ITEM]->(p)
RETURN rpo, e, n, s, p, r, i, sum(coalesce(poi2.POqt, 0)) AS AlreadyPendingQty
NEXT
OPTIONAL MATCH (p)<-[op:HAS_ORDER_PRODUCT]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
RETURN rpo, e, n, s, p, r, i, AlreadyPendingQty, sum(coalesce(op.Quantity, 0)) AS OpenOrderQty
NEXT
FILTER i.UnitsInStock + AlreadyPendingQty - OpenOrderQty - (r.StockThreshold * 0.5) <= r.StockThreshold
RETURN rpo, e, n, s, collect({ProductID: p.ProductID,
                              qty: (r.StockThreshold) - (i.UnitsInStock + AlreadyPendingQty - OpenOrderQty) + to_integer(floor(r.StockThreshold / 2))}) AS orderItems
NEXT
FILTER size(orderItems) > 0
INSERT (n)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder {PODate: local_datetime()}),
       (po)-[:PO_FOR_SUPPLIER]->(s),
       (po)-[:PO_CREATED_BY]->(e),
       (po)-[ins_e1:HAS_PREVIOUS_PO {Resubmission_Justification: "Reason for resubmission. What changed. What was missing or not accurate in the previous one. Comments, etc. "}]->(rpo)
SET po.PONumber = "PO-" || left(po._id, 5) || right(po._id, 5)
FOR item IN orderItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (po)-[ins_e2:HAS_PO_ITEM {POqt: item.qty, POPriceDiscount: 0.7}]->(p)
RETURN DISTINCT po.PONumber AS PONumber, rpo.PONumber AS ResubmittedFrom;


// You can add as many vetting levels as you want, following the same pattern. Simple, isn't it?

// Next up in the workflow is the "Buyer", who will review the Approved POs (and vet them if needed) and submit them to the respective Suppliers so they can send their RFQs for each PO.
// Before we start submitting POs to the Suppliers, we must create the appropriate Graph schemas for Suppliers to receive and submit RFQs, and for POs to accept or reject RFQs.

// We will also have to Create a schemas for the PO's that have made it through the entire vetting process and are submitted to the Supplier.
// We will do this as part of the PO submission process.

// **PO Submisson** to Suppliers (last phase of the vetting)

// Let's now put on the "Buyer" hat and do the last phase of the PO vetting.
// The Buyer will Approve and Submit the PO's to the respective Supplier. For Demo purpouse, we will limit to 10 submission and we will leave a few PO's on the Approved collection (state) pending submission
// When the Buyer submits the PO to the Supplier:
//   - We connect the PO to the Buyer that Submitted it, and to the Submitted state Collection
//   - The Buyer places the PO in the Supplier's NewPoS collection
//   - The Buyer creates the PO's state collections for upcoming RFQ's vetting process - PoNewRFQ (to hold the new RFQ's submitted by the Supplier)
//     and PoRejectedRFQ (to hold the Rejected RFQ's as there could be more than one rejection in the vetting).
//     We don't need a collection to hold the Approved RFQ as there will only be one and we can connect it directly to the PO.
//   - We remove the PO from the Approved state as we have connected it to Submitted.
MATCH (bu:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Buyer"}), (su:SubmittedPoS {Name: "SubmittedPoS"})
ORDER BY random() LIMIT 1
MATCH (a:ApprovedPoS {Name: "ApprovedPoS"})-[ap]->(po:PurchaseOrder)-[:PO_FOR_SUPPLIER]->(s:Supplier)-[:HAS_SUPPLIER_NEW_PENDING_POS]->(snp)
ORDER BY po.PONumber LIMIT 10
INSERT (po)-[ins_e3:HAS_BUYER_PO_APPROVAL {Date: local_datetime(), Comment: "This PO is approved by Buyer due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(bu),
       (su)-[ins_e4:IS_SUBMITTED_PO_STATE {Date: local_datetime()}]->(po),
       (snp)-[ins_e5:IS_SUPPLIER_NEW_PO_STATE {Date: local_datetime()}]->(po),
       (po)-[:HAS_SUPPLIER_NEW_RFQ]->(ins_n1:PoNewRFQ {Name: "PoNewRFQ"}),
       (po)-[:HAS_SUPPLIER_REJECTED_RFQ]->(ins_n2:PoRejectedRFQ {Name: "PoRejectedRFQ"})
DELETE ap;

// As we move the 'RFQs through the Vetting process, we will connect the respective RFQ State to the RFQs.
// We will use the following Ontology for this:
// For Approved RFQs: We connect the PO to the RFQ as: (PO)-[:HAS_APPROVED_RFQ]->(RFQ)
// For Rejected RFQs: (PO)-[:HAS_SUPPLIER_REJECTED_RFQ]->(:PoRejectedRFQ {Name:"PoRejectedRFQ)"})-[:IS_SUPPLIER_REJECTED_RFQ_STATE {Date:datetime()}]->(RFQ) - hold the RFQ's that were rejected during the vetting workflow.
// And, just as we did in the PO vetting, each employee that participated in the vetting process will be connected to the RFQ with the timedate and justification for the vetting



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// ** Supplier RFQ**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Next step, Suppliers will check what are the Open PO's and submit the respective RFQ's (they will apply the 30% discount on the products)
// The Supplier enters the Quantity of products they will supply and the discount they will provide in their RFQ.
// We create the RFQ, connect it to the Supplier, place it in the PO's new RFQ state collection, move the PO to the Supplier Open PO's (with RFQ submitted),
// remove the PO from the Supplier New PO's, and add the RFQ data (product quantity and unit cost) in the Relationship of the RFQ.
MATCH (su:Supplier)-[np:HAS_SUPPLIER_NEW_PENDING_POS]->()-[r]->(po)-[pq:HAS_PO_ITEM]-(p), (po)-[:HAS_SUPPLIER_NEW_RFQ]->(snr), (su)-[:HAS_SUPPLIER_OPEN_POS]->(sop)
RETURN su, r, po, snr, sop, collect({ProductID: p.ProductID, qty: pq.POqt, cost: p.UnitPrice * 0.7}) AS rfqItems
NEXT
INSERT (rfq:RFQ {RFQDate: local_datetime(), RFQComments: "Thanks for your order, we are able to supply the full PO product request at the discounted price negotiated on our master agreement"}),
       (rfq)-[:IS_RFQ_FOR_PO]->(po),
       (rfq)-[:RFQ_FROM_SUPPLIER]->(su),
       (snr)-[:IS_SUPPLIER_NEW_RFQ]->(rfq),
       (sop)-[ins_e1:IS_SUPPLIER_OPEN_PO_STATE {Date: local_datetime()}]->(po)
SET rfq.RFQNumber = "RFQ-" || left(rfq._id, 5) || right(rfq._id, 5)
DELETE r
FOR item IN rfqItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (rfq)-[ins_e2:HAS_RFQ_ITEM {RFQqt: item.qty, RFQcost: item.cost}]->(p);



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **RFQ Vetting**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Lets Compare the PO Budget to the RFQ Costs and check our Inventory Levels prior to approving the RFQ.
MATCH (su:SubmittedPoS)-[]->(po)-[:HAS_SUPPLIER_NEW_RFQ]->(pnr)-[r:IS_SUPPLIER_NEW_RFQ]->(rfq:RFQ)-[rfi:HAS_RFQ_ITEM]-(p)<-[poi:HAS_PO_ITEM]-(po), (inv)<-[:HAS_INVENTORY_LEVEL]-(p)-[:HAS_SUPPLY_ORDER]-(suo)
WHERE poi.POqt * (p.UnitPrice * poi.POPriceDiscount) >= rfi.RFQqt * rfi.RFQcost
RETURN po.PONumber, rfq.RFQNumber, p.ProductID, poi.POqt, poi.POqt * (p.UnitPrice * poi.POPriceDiscount) AS POBudget, rfi.RFQqt, rfi.RFQqt * rfi.RFQcost AS RFQcost, inv.UnitsInStock, suo.UnitsOnOrder;


// To keep things simple we will have only the Buyer, who was the last level of the PO Approval and the one who submitted the PO, to vet the RFQ.
// Alternatively, we could have a 3+1 Level RFQ approval just as we did with the PO

// We will reject one RFQs just to have an instance and be able to query it later.
// We conect the rfq to the Buyer with the datetime of the Rejection and the Buyer justification, and connect the rfq to the PO's PoRejectedRFQ state collection.
MATCH (bu:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Buyer"})
ORDER BY random() LIMIT 1
MATCH (su:SubmittedPoS)-[]->(po)-[:HAS_SUPPLIER_NEW_RFQ]->(pnr)-[r:IS_SUPPLIER_NEW_RFQ]->(rfq)-[rfi:HAS_RFQ_ITEM]->(p)<-[poi:HAS_PO_ITEM]-(po), (po)-[:HAS_SUPPLIER_REJECTED_RFQ]->(prr)
WHERE poi.POqt * (p.UnitPrice * poi.POPriceDiscount) >= rfi.RFQqt * rfi.RFQcost
ORDER BY po.PONumber DESC LIMIT 1
INSERT (rfq)-[ins_e1:HAS_BUYER_RFQ_REJECTION {Date: local_datetime(), Comment: "This RFQ is rejected by Buyer due to..< Rejection justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(bu),
       (prr)-[ins_e2:IS_SUPPLIER_REJECTED_RFQ_STATE {Date: local_datetime()}]->(rfq)
DELETE r;

// The Supplier can then submit another FRQ and just as we did with the PO, the new RFQ will point back to the rejected one for tracking.
// For this demo we will have one radom suppier resubmit one RFQ and we will leave the other in the Rejected state pending resubmisson (so we caq query and find it)
MATCH (su:Supplier)-[np:HAS_SUPPLIER_NEW_PENDING_POS]->()-[r]->(po)-[pq:HAS_PO_ITEM]-(p), (po)-[:HAS_SUPPLIER_NEW_RFQ]->(snr), (su)-[:HAS_SUPPLIER_OPEN_POS]->(sop)
RETURN su, r, po, snr, sop, collect({ProductID: p.ProductID, qty: pq.POqt, cost: p.UnitPrice * 0.7}) AS rfqItems
NEXT
INSERT (rfq:RFQ {RFQDate: local_datetime(), RFQComments: "Thanks for your order, we are able to supply the full PO product request at the discounted price negotiated on our master agreement"}),
       (rfq)-[:IS_RFQ_FOR_PO]->(po),
       (rfq)-[:RFQ_FROM_SUPPLIER]->(su),
       (snr)-[:IS_SUPPLIER_NEW_RFQ]->(rfq),
       (sop)-[ins_e1:IS_SUPPLIER_OPEN_PO_STATE {Date: local_datetime()}]->(po)
SET rfq.RFQNumber = "RFQ-" || left(rfq._id, 5) || right(rfq._id, 5)
DELETE r
FOR item IN rfqItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (rfq)-[ins_e2:HAS_RFQ_ITEM {RFQqt: item.qty, RFQcost: item.cost}]->(p);


// *** ISOTOPE NODES: a deliberate, isolated exception to Read-Only Nodes. ***
//
// InventoryLevel, OrderLevel, and ReorderLevel are the three places in this model where a property is genuinely mutated rather than superseded by a new relationship. Like isotopes
// of a stable element -- same identity, different neutron count -- these are variants of the same principle, not violations of it: the volatility is isolated to small, dedicated nodes
// rather than leaking into Product itself, so Product stays a true Proper Noun Node no matter how often its stock and order levels change underneath it.
//
// The split isn't only about isolating *that* something mutates -- it's about isolating mutation *by frequency*, and these three don't all mutate at the same rate:
//
//   - InventoryLevel.UnitsInStock and OrderLevel.UnitsOnOrder are both high-frequency, high-contention. UnitsInStock changes on every order fulfillment; UnitsOnOrder changes
//     on every RFQ approval (incoming supply) and again on every Warehouse delivery (outgoing from "on order," incoming to stock) -- two separate write paths into the same
//     property.
//   - ReorderLevel.StockThreshold is low-frequency by comparison, changing only via periodic recalculation (see "Update the Stock Threshold" below).
//
// Keeping all three on separate, dedicated nodes means a hot property never drags a cold one into its contention footprint, and a write to one can never block a read of another.
//
// If Graph Databases evolve into hybrid engines with native stream support, InventoryLevel and OrderLevel are the stronger candidates to become actual streams -- high write rate, real value
// in a point-in-time history ("what was stock/on-order at 2pm Tuesday"). ReorderLevel behaves more like a periodically-recomputed business parameter than a stream -- there's less inherent
// value in a full time-series of past thresholds versus simply knowing the current one -- so it would likely remain a conventional mutable node even in that future.
// However, it would be ideal to keep a temporar record of its changes.


// For our Demo we will select 8 RFQ's that are within the PO Budget (PO Budget >= RFQ Cost) and have the Buyer Approve them.
// We conect the rfq to the Buyer with the datetime of the Approval and the Buyer justification, connect the PO to the Approved RFQ,
// update the Supply Order status to reflect the Approved RFQ, and delete the connection between the PO's PoNewRFQ state collection.
// GQL port note: Cypher created the approval edges with MERGE once per RFQ line (deduplicated because datetime() is constant within a statement).
//                Here they are INSERTed once per RFQ, then the RFQ lines are matched again to update the OrderLevel nodes -- same end result.
MATCH (bu:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Buyer"})
ORDER BY random() LIMIT 1
MATCH (su:SubmittedPoS)-[]->(po)-[:HAS_SUPPLIER_NEW_RFQ]->(pnr)-[r:IS_SUPPLIER_NEW_RFQ]->(rfq:RFQ)-[rfi:HAS_RFQ_ITEM]-(p)<-[poi:HAS_PO_ITEM]-(po)
WHERE poi.POqt * (p.UnitPrice * poi.POPriceDiscount) >= rfi.RFQqt * rfi.RFQcost
RETURN bu, po, rfq, r, po.PONumber AS PONumber, count(rfi) AS ItemsWithinBudget
ORDER BY PONumber LIMIT 8
NEXT
INSERT (rfq)-[ins_e1:HAS_BUYER_RFQ_APPROVAL {Date: local_datetime(), Comment: "This RFQ is approved by Buyer due to..< Approval justification for Decision Traces - for Context Graph > - alternatively this could be placed on a separate Node  >..."}]->(bu),
       (po)-[ins_e2:HAS_APPROVED_RFQ {Date: local_datetime()}]->(rfq)
DELETE r
MATCH (rfq)-[rfi:HAS_RFQ_ITEM]-(p)<-[poi:HAS_PO_ITEM]-(po), (inv)<-[:HAS_INVENTORY_LEVEL]-(p)-[:HAS_SUPPLY_ORDER]-(suo)
WHERE poi.POqt * (p.UnitPrice * poi.POPriceDiscount) >= rfi.RFQqt * rfi.RFQcost
SET suo.UnitsOnOrder = suo.UnitsOnOrder + rfi.RFQqt;

// Check the RFQ's that were approved and the updated Supply Order status for the products.
MATCH (su:SubmittedPoS)-[]->(po)-[:HAS_APPROVED_RFQ]->(rfq:RFQ)-[rfi:HAS_RFQ_ITEM]-(p)<-[poi:HAS_PO_ITEM]-(po), (inv)<-[:HAS_INVENTORY_LEVEL]-(p)-[:HAS_SUPPLY_ORDER]-(suo)
WHERE poi.POqt * (p.UnitPrice * poi.POPriceDiscount) >= rfi.RFQqt * rfi.RFQcost
RETURN po.PONumber, rfq.RFQNumber, p.ProductID, poi.POqt, poi.POqt * (p.UnitPrice * poi.POPriceDiscount) AS POBudget, rfi.RFQqt, rfi.RFQqt * rfi.RFQcost AS RFQcost, inv.UnitsInStock, suo.UnitsOnOrder;

// Unlike the PO, we will not create state collections on the RFQ's as we only have one Supplier per product in this model.
// The RFQ has been Approved but the PO remains Open for the Procurement (SubmittedPoS state) and Supplier (SupplierOpenPoS state) until it is fulfilled (products deleivered, suppliere payment made, etc.).
// We could craete other states (state collections) in both the Procurement perspective and Supplier perspective to reflect the



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **RFQ Resubmission**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// For our Demo we will have one Supplier resubmit one RFQ that was rejected by the Buyer.
// As this is a resubmission, the Supplier will provide a better discount than the previous RFQ (0.65).
// (The Cypher version had an apoc.lock.nodes call here, copied from the Python harness; it is not needed in this single-user script.)
MATCH (su:Supplier)<-[:RFQ_FROM_SUPPLIER]-(rrfq:RFQ)<-[:IS_SUPPLIER_REJECTED_RFQ_STATE]-(), (rrfq)-[:IS_RFQ_FOR_PO]-(po:PurchaseOrder)
WHERE NOT EXISTS { MATCH ()-[:HAS_PREVIOUS_RFQ]->(rrfq) }
ORDER BY random() LIMIT 1
MATCH (p)<-[pq:HAS_PO_ITEM]-(po)-[:HAS_SUPPLIER_NEW_RFQ]->(snr)
RETURN rrfq, su, po, snr, collect({ProductID: p.ProductID, qty: pq.POqt, cost: p.UnitPrice * 0.65}) AS rfqItems
NEXT
INSERT (rfq:RFQ {RFQDate: local_datetime(), RFQComments: "Thanks for your order, we resubmitting our RFQ and hope weare able to supply the full PO product request at the discounted price negotiated on our master agreement"}),
       (rfq)-[:IS_RFQ_FOR_PO]->(po),
       (rfq)-[:RFQ_FROM_SUPPLIER]->(su),
       (snr)-[:IS_SUPPLIER_NEW_RFQ]->(rfq),
       (rfq)-[ins_e1:HAS_PREVIOUS_RFQ {Justification: "This RFQ is a resubmission of the previous rejected RFQ. The Supplier has provided additional justification and/or updated pricing and/or updated product availability."}]->(rrfq)
SET rfq.RFQNumber = "RFQ-" || left(rfq._id, 5) || right(rfq._id, 5)
FOR item IN rfqItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (rfq)-[ins_e2:HAS_RFQ_ITEM {RFQqt: item.qty, RFQcost: item.cost}]->(p)
RETURN DISTINCT rfq.RFQNumber AS RFQNumber, po.PONumber AS PONumber;

// We will not vet it yet so we can query it later and see that it is pending vetting. We can vet it in a later step.

// ###### Run the **Inventory Level Report** ######
// You will see how the Inventory Level changes after the RFQ approval and the updated Supply Order status for the products.
// You will now see that the Supply Order status has been updated to reflect the approved RFQ quantities for each product.


//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **Update the Stock Threshold**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Check the updated Stock Threshold for each Product before the update of Stock Threshold.
// (Variables "in" and "or" are reserved words in GQL, so they are renamed inv / ord.)
MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]-(inv), (p)-[:HAS_SUPPLY_ORDER]->(so), (p)-[:HAS_REORDER_LEVEL]->(re), (p)<-[oi:HAS_ORDER_PRODUCT]-(ord)
RETURN p.ProductName AS ProductName, inv.UnitsInStock AS UnitsInStock, so.UnitsOnOrder AS UnitsOnOrder, re.StockThreshold AS StockThreshold,
       to_integer(avg(oi.Quantity)) AS AverageQuantityPerOrder, min(oi.Quantity) AS MinQuantity, max(oi.Quantity) AS MaxQuantity,
       count(DISTINCT (to_string(year(ord.OrderDate)) || "-" || to_string(month(ord.OrderDate)))) AS OrdersPerMonth
ORDER BY ProductName;

// ** IMPORTANT NOTE **: The Stock Threshold is a critical parameter in inventory management that determines when to reorder products.
//    It is essential to keep it updated based on the latest order data to ensure that it reflects current demand patterns and helps in maintaining optimal inventory levels.
//    The Python Simulation does not update this value, so you will have to update it from time to time depending on the Order volume you define.

// The following query will update the Stock Threshold to 150% of the average monthly order volume for each Product, based on the average quantity ordered per month for each product.
// This will help in maintaining optimal inventory levels and ensuring that products are reordered in a timely manner to meet customer demand.
// From time to time, the Stock Threshold can be recalculated based on the latest order data to ensure that it reflects current demand patterns and helps in maintaining optimal inventory levels.
MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_REORDER_LEVEL]->(re)
MATCH (p)<-[oi:HAS_ORDER_PRODUCT]-(o:Order)
RETURN p, re,
       sum(oi.Quantity) AS TotalQuantityOrdered,
       count(DISTINCT (to_string(year(o.OrderDate)) || "-" || to_string(month(o.OrderDate)))) AS MonthsWithOrders
NEXT
SET re.StockThreshold = to_integer(round((to_float(TotalQuantityOrdered) / MonthsWithOrders) * 1.5));


// Check the Stock Threshold for each Product after the update of Stock Threshold.
MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]-(inv), (p)-[:HAS_SUPPLY_ORDER]->(so), (p)-[:HAS_REORDER_LEVEL]->(re), (p)<-[oi:HAS_ORDER_PRODUCT]-(ord)
RETURN p.ProductName AS ProductName, inv.UnitsInStock AS UnitsInStock, so.UnitsOnOrder AS UnitsOnOrder, re.StockThreshold AS StockThreshold,
       to_integer(avg(oi.Quantity)) AS AverageQuantityPerOrder, min(oi.Quantity) AS MinQuantity, max(oi.Quantity) AS MaxQuantity,
       count(DISTINCT (to_string(year(ord.OrderDate)) || "-" || to_string(month(ord.OrderDate)))) AS OrdersPerMonth
ORDER BY ProductName;

// ###### Run the **Inventory Level Report** ######
// You will see how the updated Stock Threshold affects the creation of new Purchase Orders for products that are below their Stock Threshold.

//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// GOTO **PO Creation**   ;-)
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// If you wish, after running the above command, run the entire script from **PO Creation** onward. You will see how the updated Stock Threshold affects the creation of new Purchase Orders for products that are below their Stock Threshold.
// New PO's, new PO vetting, new RFQ's, new RFQ vetting, and new product deliveries will be created based on the updated Stock Thresholds.

// I will run the PO Creation command once here so that we can have some new PO's created based on the updated Stock Thresholds.
// This will be usefull once you run the Python code to simulate the creation of new Orders, PO and RFQ Vetting, Supplier restock, Order Fulfillment, and Inventory Updates.


// The Procurement Assistant will create POs for Suppliers whose Products have low Inventory Levels (nearing restock threashold level).
// Select a random Employee with the role "Procurement Assistant".
// Find Products with low inventory (Inventory Level <= Restock Threshold).
// Check if there are any active POs for this product that are either New or Approved (not yet submitted to Supplier).
// (Same as the Cypher v2.3.1 statement at this point: this second PO Creation does not subtract open Customer Order quantities.)
// We add the PO items and their order quantity, in this demo we will get the unit cost as a % of the Product price.
MATCH (pa:RolE {Title: "Procurement Assistant"})-[:IS_ACTIVE_ROLE]->(e:Employee), (n:NewPoS {Name: "NewPoS"})
ORDER BY random() LIMIT 1
MATCH (s:Supplier)-[:SUPPLIES]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(a:ProductStatusAvailablE),
      (r:ReorderLevel)<-[:HAS_REORDER_LEVEL]-(p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
OPTIONAL MATCH ()-[:IS_NEW_PO_STATE|IS_APPROVED_PO_STATE|IS_SUBMITTED_PO_STATE]->(activePO:PurchaseOrder)-[poi2:HAS_PO_ITEM]->(p)
RETURN e, n, s, p, r, i, sum(coalesce(poi2.POqt, 0)) AS AlreadyPendingQty
NEXT
FILTER i.UnitsInStock + AlreadyPendingQty - (r.StockThreshold * 0.5) <= r.StockThreshold
RETURN e, n, s, collect({ProductID: p.ProductID,
                         qty: (r.StockThreshold) - (i.UnitsInStock + AlreadyPendingQty) + (r.StockThreshold * 2)}) AS orderItems
NEXT
INSERT (n)-[:IS_NEW_PO_STATE]->(po:PurchaseOrder {PODate: local_datetime()}),
       (po)-[:PO_FOR_SUPPLIER]->(s),
       (po)-[:PO_CREATED_BY]->(e)
SET po.PONumber = "PO-" || left(po._id, 5) || right(po._id, 5)
FOR item IN orderItems
MATCH (p:Product WHERE p.ProductID = item.ProductID)
INSERT (po)-[ins_e1:HAS_PO_ITEM {POqt: item.qty, POPriceDiscount: 0.7}]->(p)
RETURN DISTINCT po.PONumber AS PONumber, s.SupplierID AS SupplierID, size(orderItems) AS ItemCount;


// ###### Run the **Inventory Level Report** ######
// You will see how the updated Stock Threshold affects the creation of new Purchase Orders for products that are below their Stock Threshold.
// You will now see that new PO's have been created for Suppliers whose Products have low Inventory Levels (nearing restock threashold level).

//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **Product Delivery at Warhouse and Inventory Update**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Now that we have some RFQ's approved the respective Suppliers will ship the products.
// This happens on the Supplier system, hopefully also running on a Graph ;-) - We could potentialy have a Graph-to-Graph (federation) integration between the Supplier and the Procurement system to automate this process.
// On our side, we will have the Warehouse Clerk receive the products and update the Inventory Levels accordingly by updating the Product's UnitsOnOrder and UnitsInStock,
// Once the Warehouse Clerk receives the products, Finance will Pay and close the PO and move it to the Closed state.

// First, we will have the Warehouse Clerk (Employee) receive the products and update the Inventory Levels accordingly.
// We will recive 5 PO's and update the Inventory Levels for the products in those PO's. We will leave a few PO's pending delivery so we can query them later and see that they are pending delivery.
// v2.3.1: pick ONE Warehouse Clerk first, so each PO line is received exactly once; the LIMIT counts whole POs, not PO lines, so no PO is half-received.
// We only want to receive the products for the PO's that have not been received yet (no Warehouse Delivery yet).
// We connect the PO to the Warehouse Clerk that received the products and update the Inventory Level and Supply Order status to reflect the received products.
MATCH (wc:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "WarehouseClerk"})
ORDER BY random() LIMIT 1
MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(rfq:RFQ)
WHERE NOT EXISTS { MATCH (po)-[:HAS_WAREHOUSE_DELIVERY]->() }
ORDER BY po.PONumber LIMIT 5
INSERT (po)-[ins_e1:HAS_WAREHOUSE_DELIVERY {Date: local_datetime(), Comment: "The products have been received as per PO at the Warehouse and the Inventory Levels have been updated accordingly."}]->(wc)
MATCH (p)<-[poi:HAS_PO_ITEM]-(po)-[:HAS_APPROVED_RFQ]->(rfq)-[rfi:HAS_RFQ_ITEM]->(p)-[:HAS_INVENTORY_LEVEL]->(inv), (p)-[:HAS_SUPPLY_ORDER]->(suo)
WHERE poi.POqt = rfi.RFQqt
SET inv.UnitsInStock = inv.UnitsInStock + rfi.RFQqt,
    suo.UnitsOnOrder = suo.UnitsOnOrder - rfi.RFQqt;



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **PO Payment and Closure by Finance**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//


// Next, Finance will Pay and close the PO and move it to the Closed state on both the Procurement and Supplier perspectives.
// We will pay and close 4 PO's and leave a few pending payment so we can query them later and see that they are pending payment.
// We connect the PO to the Finance employee that paid the PO and closed it, connect the PO to the Closed state on the Procurement and Supplier perspectives,
// and remove the PO from the Submitted state on the Procurement perspective and from the Open state on the Supplier perspective.
MATCH (f:Employee)<-[:IS_ACTIVE_ROLE]-(ro:RolE {Title: "Finance"}),
      (cpo)<-[:HAS_CLOSED_PO_STATE]-(:PoS)-[:HAS_SUBMITTED_PO_STATE]->(:SubmittedPoS)-[r1]->(po:PurchaseOrder)-[:HAS_WAREHOUSE_DELIVERY]->(wc:Employee),
      (po)<-[r2:IS_SUPPLIER_OPEN_PO_STATE]-()<-[]-(su:Supplier)-[:HAS_SUPPLIER_CLOSED_POS]->(scp)
ORDER BY po.PONumber LIMIT 4
INSERT (po)-[ins_e1:HAS_FINANCE_PAYMENT {Date: local_datetime(), Comment: "The PO has been paid by Finance and the PO is now closed."}]->(f),
       (cpo)-[ins_e2:IS_CLOSED_PO_STATE {Date: local_datetime(), Comment: "The PO has been paid by Finance and the PO is now closed."}]->(po),
       (scp)-[ins_e3:HAS_SUPPLIER_CLOSED_PO_STATE {Date: local_datetime(), Comment: "The PO has been paid by Finance and the PO is now closed."}]->(po)
DELETE r1, r2;



//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// **Customer Order Fulfillment**
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//


// The Warehouse Clerk will fulfill Open Customer Orders that have sufficient stock for every Product line, ship them, and update the Inventory Levels accordingly. Orders missing stock for
// one or more Products are skipped and remain Open, pending restock -- we don't want to fulfill a partial Order or push Inventory negative.

// Select the Warehouse Clerk and a Shipper who will handle this batch of fulfillments.
// (Same disconnected-pattern Cartesian product noted earlier in the script -- harmless here since we cap it to one Employee and one Shipper via ORDER BY random() LIMIT 1.)
// Find the oldest Open Order where every line currently has sufficient stock (grouped by Order).
// Then re-match this order's lines so shipment creation happens once -- not once per line -- and decrement the Inventory per line.
MATCH (wc:Employee)<-[:IS_ACTIVE_ROLE]-(:RolE {Title: "WarehouseClerk"}), (s:Shipper)<-[:HAS_SHIPPER]-(si:ShipInfo)
ORDER BY random() LIMIT 1
MATCH (op:OrderStatusOpeN {Status: "Open"})-[r:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
RETURN wc, si, s, op, o, r,
       count(details) AS TotalLines,
       sum(CASE WHEN inv.UnitsInStock > details.Quantity THEN 1 ELSE 0 END) AS LinesWithStock
NEXT
FILTER TotalLines = LinesWithStock
ORDER BY o.OrderDate
LIMIT 1
MATCH (a)<-[:HAS_CUSTOMER_ADDRESS]-(:Customer)<-[:HAS_ORDER_CUSTOMER]-(o)
MATCH (f:OrderStatusFulfilleD {Status: "Fulfilled"})
INSERT (i:ShipInfo {ShippedDate: local_datetime(), ShipName: si.ShipName, Freight: round(random() * 100, 2)}),
       (o)-[:HAS_SHIPMENT_INFO]->(i),
       (i)-[:HAS_SHIPPER]->(s),
       (i)-[:HAS_SHIPMENT_ADDRESS]->(a),
       (f)-[ins_e1:IS_FULFILLED_ORDER_STATE {FulfillDate: local_datetime()}]->(o),
       (o)-[ins_e2:HAS_WAREHOUSE_FULFILLMENT {Date: local_datetime(), Comment: "Order picked, packed, and shipped by the Warehouse Clerk."}]->(wc)
SET i.ShippmentID = "SH-" || i._id
DELETE r
MATCH (o)-[details:HAS_ORDER_PRODUCT]->(:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
SET inv.UnitsInStock = inv.UnitsInStock - details.Quantity,
    inv.LastUpdate = local_datetime()
RETURN DISTINCT o.OrderID AS OrderID;

