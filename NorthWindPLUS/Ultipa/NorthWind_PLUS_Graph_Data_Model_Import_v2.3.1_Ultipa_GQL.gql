// -- NorthWind PLUS Graph Data Model Import v2.3.1 -- Ultipa GQLDB (ISO GQL) port --//
//
// Converted from the Neo4j Aura Cypher script v2.3.1 (same model, same nodes/edges/properties).
// Target: Ultipa GQLDB ("Ultipa Graph v6"), documented at https://www.ultipa.com/docs/gql
//
// ================================ CONVERSION NOTES (read first) ================================
//  Cypher                                  ->  GQL used here
//  CREATE                                  ->  INSERT
//  WITH ... (projection / aggregation)     ->  RETURN ... NEXT  (aggregation),  LET (new variable),  FILTER (WHERE on a computed value)
//  WITH x ORDER BY rand() LIMIT 1          ->  ORDER BY random() LIMIT 1   (standalone statements, all variables stay in scope)
//  UNWIND list AS x                        ->  FOR x IN list
//  NOT (a)-[:R]->()                        ->  NOT EXISTS { MATCH (a)-[:R]->() }
//  count{ pattern }                        ->  VALUE { MATCH pattern RETURN count(*) }
//  datetime()                              ->  local_datetime()   (used everywhere, so every stored date has ONE type and compares/sorts cleanly)
//  datetime() + duration("P7D")            ->  date_add(local_datetime(), 7, "day")
//  x.year / x.month                        ->  year(x) / month(x)
//  toInteger / toFloat / toString          ->  to_integer / to_float / to_string
//  "a" + "b"                               ->  "a" || "b"
//  list[0..10]                             ->  list[0:10]
//  -[:R*1..]->                             ->  -[:R]->{1,}
//  randomUUID()                            ->  no UUID function in GQLDB. Every node without an explicit _id gets a UUID v4 _id,
//                                              so IDs are built from it right after INSERT:  SET po.PONumber = "PO-" || left(po._id,5) || right(po._id,5)
//  int / int  (integer division)           ->  GQL "/" always returns FLOAT, so integer division is written to_integer(floor(a / b))
//  LOAD CSV ... AS row MERGE (...)         ->  LOAD CSV FROM '<url>' WITH HEADER INTO <StagingLabel> MAPPING (...)
//                                              (GQLDB's LOAD CSV writes straight into one label and allows no expressions), then a normal
//                                              MATCH/INSERT transforms the staging nodes, exactly like the original OrderTmp approach.
//  CALL apoc.lock.nodes([...])             ->  not needed in this single-user script (removed). See the Python harness for the concurrency replacement.
//  Undirected MERGE (a)-[:R]-(b)           ->  GQLDB edges are always directed (see the Recommendation Engine note).
//
// Every statement ends with ";" at the end of a line. Run them one at a time in Ultipa Manager / CLI, or use the companion
// run_gql_script.py, which splits this file and runs the section between the //@@ BEGIN SETUP and //@@ END SETUP markers.
// ===============================================================================================

// v2.3.1 -- bug fixes to v2.3 (no model changes):
//   1. PO vetting cost was counted twice. The vetting queries matched (i:Product)-[]-(s:Supplier), an undirected pattern that hits BOTH
//      (Product)-[:HAS_PRODUCT_SUPPLIER]->(Supplier) and (Supplier)-[:SUPPLIES]->(Product), so every PO item appeared twice and SUM(POCost)
//      doubled. POs were therefore compared against the L1/L2/L3 approval limits at twice their real cost. Now (i:Product)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier).
//   2. Warehouse receiving could add stock twice and could half-receive a PO. It matched every Warehouse Clerk (there are two) together with the
//      PO lines, so each line could appear once per clerk and its quantity was added to UnitsInStock (and removed from UnitsOnOrder) twice.
//      And LIMIT 5 counted PO lines, not POs, so a PO's last lines could be cut off; the PO still got HAS_WAREHOUSE_DELIVERY and those lines
//      were never received. Now one clerk is picked first, then 5 whole POs, then all their lines.

// If you find yourself filtering on a Node property that represents state, context, or an entity's relevance to something else, that's a sign the model needs a relationship instead,
// as it was most likely built with a table mentality.
// This is what this model intends to achieve, by using a Graph mentality to rebuild a well known model that once was a reference for a Relational Database model.

// This v2 introduces changes of truly *ontological* proportions.
// Previously, I used a single generic relationship type [:HAS] for all elements belonging to a collection ("Hub Nodes" that aggregate nodes of a given Label
// based on their State or Context), mainly to preserve UI reusability.
// To maintain some level of Ontology, I added a property called RelType to the relationship/edge to indicate its intended ontological meaning.
// This was a conscious trade-off: it kept the UI simple, but it negatively affected edge indexing and would eventually impact performance at scale.
// In v2, I removed the common [:HAS] relationship type entirely and adopted proper ontology-specific relationship types. This restores semantic clarity
// and improves indexing behavior for large-scale graphs.
// For UI reusability, I will rely on the naming convention I use to distinguish Nodes from Collection Nodes (Pascal with ending capital letter).

// I will stick to the key principles:

// **Proper Noun Nodes:**
//    Nodes should only store properties that define the uniqueness of the entity (the "Thing") they represent.
//    Any property that represents a state or an entity's contextual relevance to another entity should be modeled as a relationship, not a property of the entity. This makes the model semantically explicit.
//    Nothing is hidden inside entity properties. You (and AI) can understand and reason on the entire model at any state without reading its properties.

// **Never Delete Nodes:**
//    Nodes are never deleted, ensuring full traceability of all entities over time. Time flows in one direction. What is done cannot be undone.
//    If the model is a faithful representation of the real world, this principle should be respected. In this model, entities are archived and timestamped so they can be looked up later.

// **Read-Only Nodes:**
//    Once created, node properties should remain unchanged. The SET command is strictly reserved for value corrections or certain edge cases/exceptions, but not the norm.
//    This approach significantly simplifies transaction concurrency and consistency management, which is a major differentiator from traditional RDBMS models, where property updates are common and often introduce complexity.
//    If your domain model requires/demands constant property updates across multiple entities (e.g., ledger systems), you might stick to the traditional RDBMS/table-based architecture rather than the one being proposed here.
//    (GQL port note: the only extra SETs added by this port are the ID-building SETs right after INSERT -- PONumber, RFQNumber, OrderID, ShippmentID --
//     which stand in for Cypher's randomUUID() at creation time.)

// **Relationships Drive the System (workflow):**
//    The system relies on creating new nodes and then creating/deleting their relationships according to the model workflow rules/state changes.
//    This might sound odd at first, but think of it...this is how everything you know, from the micro to macro universe, including yourself, works.
//    There are 118 stable elements in the periodic table (that we know of) that create everything we know just by altering their relationships.
//    Not by changing their properties, except for isotopes (the edge cases I mention earlier, the exceptions but not the norm). Nature is showing us the way.
//    This is biomimicry applied to software architecture.

//  **Lean Nodes:**
//    Outgoing relationships are minimized. For one-to-many connections, we use some nodes as Collections.
//    Collections can represent domain States as well as Context (i.e, virtual aggregation). While relational algebra relies on implicit set operations (Union, Intersection, Difference, Cartesian product),
//    I will use explicit ones (Superset, Subset, Element of), aligning with how nature and humans intuitively organize reality into sets. This aligns the Graph with the domain expert mental model.
//    While this introduces an additional traversal cost, the structure scales better as the database grows.
//    There are deeper considerations behind this, involving how the Graph is stored (how Node properties and its adjacency table are stored) and the implications for indexing, query optimization, and performance,
//    as well as Node digital rights management (DRM) considerations. Still, I won't go down that rabbit hole here. However, they are highly relevant and taken into consideration.
//
//    I'm aware that current Graph Databases are not fully optimized for this approach I am suggesting, but I trust they will at some point. I witnessed and worked with the first RDBMS and saw how they evolved in the past decades;
//    Graph Databases will too.

// ------------------------------------------------------------------------------------ //

// This script will create the NorthWind Graph Data Model in Ultipa GQLDB.
// It will load data from CSV files and create Nodes and Relationships.
// Use the CSV provided in the import folder (https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/), as they have been fixed.
// The original NorthWind CSV files (https://github.com/neo4j-graph-examples/northwind) have some issues with commas in the data fields, mainly in the Address fields (for Brazil, France, and Belgium) and some Description fields (Notes).
// These issues can cause problems during import, resulting in misplaced fields and compromising data integrity.
// NOTE: those CSVs store missing values as the literal text NULL (e.g. Region = "NULL"). Neo4j imported them as the string "NULL" and so does this port,
//       so equality checks such as a.Region = n.ShipRegion behave exactly as they did in Neo4j.

// Here we go!!

//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
//                                                                    ** Quick Run Instructions: **
// 1) Create an OPEN graph (schema-free, the same behaviour as Neo4j) and select it -- in Ultipa Manager/CLI:
//        CREATE GRAPH IF NOT EXISTS NorthWindPLUS
//        USE NorthWindPLUS
//    (run_gql_script.py does both for you).
// 2) Run everything between //@@ BEGIN SETUP and //@@ END SETUP (python run_gql_script.py --section setup). Optionally run the Recommendation Engine section.
// 3) Follow the instructions near the end of the setup section to run the Python simulation loops, then run the Query section as the loops run. Enjoy!!
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

//@@ BEGIN SETUP

// Let's clear all Nodes and Relationships before we start. (Alternatively: DROP GRAPH NorthWindPLUS, then CREATE GRAPH NorthWindPLUS.)
MATCH (n) DETACH DELETE n;

// (Cypher had a commented-out apoc.schema.assert here to drop indexes/constraints. GQLDB equivalent: SHOW INDEX, then DROP INDEX <name>.)

//-- Loading Data from CSV files --//
// Numeric CSV columns are converted by LOAD CSV itself (MAPPING ... AS INT / AS FLOAT). On GQLDB, to_integer()/to_float() on a
// LOAD CSV value returned null for UnitsInStock, Quantity, etc., which left InventoryLevel.UnitsInStock and ReorderLevel.StockThreshold null.
// EXCEPTION: Discontinued stays text + to_integer() in the FILTERs -- that combination is the one proven to link the 69 Available products;
// loading it AS INT linked none.
// GQLDB's LOAD CSV can only copy CSV columns into properties of ONE label (no expressions), so wherever the Cypher version computed something
// during the load, we load into a staging label (Stg...) first and transform from there. Staging nodes are deleted at the end of the import.

// We start by importing the Product Categories (same three properties the Cypher MERGE used; the Picture column is not imported).
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/categories.csv' WITH HEADER
INTO ProductCategorY MAPPING (CategoryID: 'CategoryID', CategoryName: 'CategoryName', Description: 'Description');

// Let's create the Product availability Status as Collections where we will connect the products later and the SuperSet CategorieS
INSERT (ins_n1:CategorieS {Name: "CategorieS"});
// We will create the Product Status Collections and connect the Products to them based on their Discontinued property.
INSERT (ins_n1:ProductStatusDiscontinueD {Status: "Discontinued"});
// We will create the Product Status Collections and connect the Products to them based on their Discontinued property.
INSERT (ins_n1:ProductStatusAvailablE {Status: "Available"});

// We import the Suppliers (staging first, because HomePage and the Contact Email are computed).
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/suppliers.csv' WITH HEADER
INTO StgSupplier MAPPING (SupplierID: 'SupplierID', CompanyName: 'CompanyName', ContactName: 'ContactName', ContactTitle: 'ContactTitle', Address: 'Address',
                          City: 'City', Region: 'Region', PostalCode: 'PostalCode', Country: 'Country', Phone: 'Phone', Fax: 'Fax');

// We do our first Graph normalization extracting the Address and Contact from the Supplier and placing them in different Nodes with a proper relationship.
// (The Cypher version first copied everything onto Supplier and removed the extra properties afterwards; the end result is the same:
//  Supplier keeps SupplierID, CompanyName and HomePage.)
MATCH (r:StgSupplier)
INSERT (n:Supplier {SupplierID: r.SupplierID, CompanyName: r.CompanyName,
                    HomePage: "https://www." || replace(replace(replace(r.CompanyName, " ", ""), "'", ""), ".", "") || ".com"}),
       (n)-[:HAS_SUPPLIER_ADDRESS]->(ins_n1:Address {Address: r.Address, City: r.City, Region: r.Region, PostalCode: r.PostalCode, Country: r.Country}),
       (n)-[:HAS_SUPPLIER_CONTACT]->(ins_n2:Contact {ContactName: r.ContactName, ContactTitle: r.ContactTitle, Phone: r.Phone, Fax: r.Fax,
                    Email: replace(r.ContactName, " ", ".") || "@" || replace(replace(replace(r.CompanyName, " ", ""), "'", ""), ".", "") || ".com"});


// We import the Product and as we import we normalize it so the Product only keeps the Properties that define the Product

// **Read-Only Nodes note:**
//    Once created, node properties should remain unchanged. The SET command is strictly reserved for value corrections or certain edge cases/exceptions, but not the norm.
//    This approach significantly simplifies transaction concurrency and consistency management, which is a major differentiator from traditional RDBMS models, where property updates are common and often introduce complexity.
//    If your domain model requires/demands constant property updates across multiple entities (e.g., ledger systems), you might stick to the traditional RDBMS/table-based architecture rather than the one being proposed here.
//    This model has three deliberate exceptions to this rule -- InventoryLevel.UnitsInStock, OrderLevel.UnitsOnOrder and ReorderLevel.StockThreshold -- explained where they occur below.
//    Therefore, we will place the reorder level, supply order level and Inventory level in separate Nodes.
//    We will keep the Price though, for simplicity. In an ideal model we should place it in a separate Node as the Price is not part of the Product Identity but an attribute that might change over time.
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/products.csv' WITH HEADER
INTO StgProduct MAPPING (ProductID: 'ProductID', ProductName: 'ProductName', SupplierID: 'SupplierID', CategoryID: 'CategoryID', QuantityPerUnit: 'QuantityPerUnit',
                         UnitPrice: 'UnitPrice' AS FLOAT, UnitsInStock: 'UnitsInStock' AS INT, ReorderLevel: 'ReorderLevel' AS INT, Discontinued: 'Discontinued');

// The InventoryLevel.UnitsInStock is a separate Node, as it is a state that will change over time.
// The ReorderLevel.StockThreshold is a separate Node. The StockThreshold is intentionally set to the UnitsInStock + 10 for this Demo. This number will allow the script to generate more PO's later
// and subsequently more RFQ's in the process creating a richer dataset for us to play with.
// The OrderLevel.UnitsOnOrder is a separate Node, as it is a state that will change over time.
// (Discontinued, ReorderLevel and SupplierID are read from the staging node instead of being stored on Product and removed later -- same end result.)
MATCH (r:StgProduct)
INSERT (n:Product {ProductID: r.ProductID, ProductName: r.ProductName, UnitPrice: r.UnitPrice, QuantityPerUnit: r.QuantityPerUnit}),
       (n)-[:HAS_REORDER_LEVEL]->(ins_n1:ReorderLevel {StockThreshold: r.UnitsInStock + 10, LastUpdate: local_datetime()}),
       (n)-[:HAS_SUPPLY_ORDER]->(ins_n2:OrderLevel {UnitsOnOrder: 0, LastUpdate: local_datetime()}),
       (n)-[:HAS_INVENTORY_LEVEL]->(ins_n3:InventoryLevel {UnitsInStock: r.UnitsInStock, LastUpdate: local_datetime()});

// We will connect the Product to its respective Product Category
MATCH (r:StgProduct)
MATCH (n:Product WHERE n.ProductID = r.ProductID)
MATCH (c:ProductCategorY WHERE c.CategoryID = r.CategoryID)
INSERT (c)-[:IS_PRODUCT_CATEGORY_OF]->(n);

// We will normalize the Discontinued products by connecting them to the respective collection
MATCH (d:ProductStatusDiscontinueD {Status: "Discontinued"}), (r:StgProduct)
MATCH (n:Product WHERE n.ProductID = r.ProductID)
FILTER to_integer(r.Discontinued) = 1
INSERT (d)-[:IS_DISCONTINUED_PRODUCT]->(n);

// We will normalize the Available products by connecting them to the respective collection
MATCH (a:ProductStatusAvailablE {Status: "Available"}), (r:StgProduct)
MATCH (n:Product WHERE n.ProductID = r.ProductID)
FILTER to_integer(r.Discontinued) = 0
INSERT (a)-[:IS_AVAILABLE_PRODUCT]->(n);

// Connect the Product to the respective supplier
MATCH (r:StgProduct)
MATCH (p:Product WHERE p.ProductID = r.ProductID)
MATCH (s:Supplier WHERE s.SupplierID = r.SupplierID)
INSERT (p)-[:HAS_PRODUCT_SUPPLIER]->(s), (s)-[:SUPPLIES]->(p);

// We will connect the Product Category to the CategorieS Superset Collection
MATCH (k:CategorieS {Name: "CategorieS"}), (c:ProductCategorY)
INSERT (k)-[:HAS_CATEGORY]->(c);

// We will import the Customers into the Graph and normalize them by creating an Address Node and a Contact Node and connecting them to the Customer Node.
// (Cypher: MERGE (n:Customer) SET n += row  ->  load every column, then relabel the staging node as Customer.)
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/customers.csv' WITH HEADER
INTO StgCustomer MAPPING (CustomerID: 'CustomerID', CompanyName: 'CompanyName', ContactName: 'ContactName', ContactTitle: 'ContactTitle', Address: 'Address',
                          City: 'City', Region: 'Region', PostalCode: 'PostalCode', Country: 'Country', Phone: 'Phone', Fax: 'Fax');

MATCH (n:StgCustomer)
SET n:Customer
REMOVE n:StgCustomer;

// We will create the CustomerS Superset Collection and the subset Customer Collection Nodes
INSERT (ins_n1:CustomerS {Name: "CustomerS"});

// We will connect the Customer to the respective CustomerS Superset Collection
MATCH (c:CustomerS {Name: "CustomerS"}), (o:Customer)
INSERT (c)-[:IS_CUSTOMER]->(o);

//  We will normalize the Customers by creating an Address Node and a Contact Node and connecting them to the Customer Node.
MATCH (n:Customer)
INSERT (n)-[:HAS_CUSTOMER_ADDRESS]->(ins_n1:Address {Address: n.Address, City: n.City, Region: n.Region, PostalCode: n.PostalCode, Country: n.Country}),
       (n)-[:HAS_CUSTOMER_CONTACT]->(ins_n2:Contact {ContactName: n.ContactName, ContactTitle: n.ContactTitle, Phone: n.Phone, Fax: n.Fax,
                    Email: replace(n.ContactName, " ", ".") || "@" || replace(replace(replace(n.CompanyName, " ", ""), "'", ""), ".", "") || ".com"});

// Remove the Customer properties that were normalized (in an open graph, SET prop = null removes the property)
MATCH (n:Customer)
SET n.Address = null, n.City = null, n.Region = null, n.PostalCode = null, n.Country = null, n.ContactName = null, n.ContactTitle = null, n.Phone = null, n.Fax = null;

// We will create the RoleS Superset Collection and the subset RolE Collection Nodes
INSERT (ins_n1:RoleS {Name: "RoleS"});

// Load the Employees (every column, like Cypher's SET n += row). The Photo column (a large hex blob) was removed again by the Cypher script, so it is not loaded.
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/employees.csv' WITH HEADER
INTO StgEmployee MAPPING (EmployeeID: 'EmployeeID', LastName: 'LastName', FirstName: 'FirstName', Title: 'Title', TitleOfCourtesy: 'TitleOfCourtesy',
                          BirthDate: 'BirthDate', HireDate: 'HireDate', Address: 'Address', City: 'City', Region: 'Region', PostalCode: 'PostalCode',
                          Country: 'Country', HomePhone: 'HomePhone', Extension: 'Extension', Notes: 'Notes', ReportsTo: 'ReportsTo', PhotoPath: 'PhotoPath');

// We will normalize the Employees by creating a Role Node and connecting it to the Employee Node. (Cypher: MERGE (l:RolE {Title:row.Title}) -> one RolE per distinct Title.)
MATCH (r:StgEmployee)
RETURN DISTINCT r.Title AS Title
NEXT
MATCH (rs:RoleS {Name: "RoleS"})
INSERT (rs)-[:HAS_ROLE_TITLE]->(ins_n1:RolE {Title: Title});

// The staging Employee nodes become the Employee nodes (Cypher: MERGE (n:Employee {EmployeeID, Email}) SET n += row).
MATCH (n:StgEmployee)
SET n:Employee, n.Email = n.FirstName || "." || n.LastName || "@northwind.com"
REMOVE n:StgEmployee;

// We will normalize the Employees by creating a Person Node and an Address Node and connecting them to the Employee Node.
MATCH (n:Employee), (l:RolE)
FILTER l.Title = n.Title
INSERT (l)-[ins_e3:IS_ACTIVE_ROLE {StartDate: local_datetime()}]->(n),
       (n)-[:HAS_PERSON]->(c:Person {FirstName: n.FirstName, LastName: n.LastName, TitleOfCourtesy: n.TitleOfCourtesy, BirthDate: n.BirthDate,
                                     PersonalPhone: n.HomePhone, PersonalEmail: n.FirstName || "." || n.LastName || "@outlook.com"}),
       (c)-[:HAS_HOME_ADDRESS]->(ins_n1:Address {Address: n.Address, City: n.City, Region: n.Region, PostalCode: n.PostalCode, Country: n.Country}),
       (n)-[:HAS_EMPLOYEE_NOTES]->(ins_n2:Notes {Notes: n.Notes});

// We will normalize the Employee's ReportsTo by creating a relationship between the Employee and the Employee that they report to.
MATCH (n:Employee WHERE n.ReportsTo IS NOT NULL)
MATCH (m:Employee WHERE m.EmployeeID = n.ReportsTo)
INSERT (n)-[:REPORTS_TO]->(m);

// Remove the Employee properties that were normalized
MATCH (n:Employee)
SET n.FirstName = null, n.LastName = null, n.TitleOfCourtesy = null, n.BirthDate = null, n.Address = null, n.City = null, n.Region = null,
    n.PostalCode = null, n.Country = null, n.HomePhone = null, n.Notes = null, n.ReportsTo = null, n.Title = null;

// We will normalize the Territories by creating a Territory Node and connecting it to the respective Employee
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/territories.csv' WITH HEADER
INTO Territory MAPPING (TerritoryID: 'TerritoryID', TerritoryDescription: 'TerritoryDescription', RegionID: 'RegionID');

// We will normalize the Territories by connecting them to the respective Employee
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/regions.csv' WITH HEADER
INTO Regions MAPPING (RegionID: 'RegionID', RegionDescription: 'RegionDescription');

// We will normalize the Employee Territories by connecting them to the respective Employee and Territory
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/employee-territories.csv' WITH HEADER
INTO StgEmployeeTerritory MAPPING (EmployeeID: 'EmployeeID', TerritoryID: 'TerritoryID');

MATCH (x:StgEmployeeTerritory)
MATCH (e:Employee WHERE e.EmployeeID = x.EmployeeID)
MATCH (t:Territory WHERE t.TerritoryID = x.TerritoryID)
INSERT (t)-[:HAS_EMPLOYEE]->(e);

// We will normalize the Territories by connecting them to the respective Region
MATCH (t:Territory)
MATCH (r:Regions WHERE r.RegionID = t.RegionID)
INSERT (r)-[:HAS_TERRITORY]->(t);

// Remove the Territory properties that were normalized
MATCH (t:Territory) SET t.RegionID = null;

// We will import the Shippers into the Graph
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/shippers.csv' WITH HEADER
INTO Shipper MAPPING (ShipperID: 'ShipperID', CompanyName: 'CompanyName', Phone: 'Phone');

// We will create the ShipperS Superset Collection and the subset Shipper Collection Nodes
INSERT (ins_n1:ShipperS {Name: "ShipperS"});
MATCH (c:ShipperS {Name: "ShipperS"}), (o:Shipper)
INSERT (c)-[:IS_SHIPPER]->(o);


// We will import the Orders into a temporary Node OrderTmp and then we will normalize the OrderDate, RequiredDate and ShippedDate to proper datetime format.
// We will not have the OrderTmp Node declared on the GRAPH TYPE constraint as it is a temporary node only used during the import process.
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/orders.csv' WITH HEADER
INTO OrderTmp MAPPING (OrderID: 'OrderID', CustomerID: 'CustomerID', EmployeeID: 'EmployeeID', OrderDate: 'OrderDate', RequiredDate: 'RequiredDate',
                       ShippedDate: 'ShippedDate', ShipVia: 'ShipVia', Freight: 'Freight' AS FLOAT, ShipName: 'ShipName', ShipAddress: 'ShipAddress',
                       ShipCity: 'ShipCity', ShipRegion: 'ShipRegion', ShipPostalCode: 'ShipPostalCode', ShipCountry: 'ShipCountry');

// We will normalize the OrderDate, RequiredDate to proper datetime format.
// We did a tweak on the ShippedDate to set it to 9999-12-31 for all Orders that have not been shipped yet.
// This will allow us to easily identify the Open Orders and Fulfilled Orders later on in the process.
// In the original Order.cvs file the ShippedDate is empty (NULL) for all Orders that have not been shipped yet,
// we chahge it to 9999-12-31 to avoid NULL values in the ShippedDate property.
MATCH (o:OrderTmp)
SET o.OrderDate    = local_datetime(left(o.OrderDate, 10) || "T" || right(o.OrderDate, 12)),
    o.RequiredDate = local_datetime(left(o.RequiredDate, 10) || "T" || right(o.RequiredDate, 12)),
    o.ShippedDate  = local_datetime(left(o.ShippedDate, 10) || "T" || right(o.ShippedDate, 12));

// Now that we have normalized the dates, the OrderTmp node becomes the Order node (Cypher created a copy with SET m = properties(n) and deleted OrderTmp;
// relabelling gives the same result in one step).
MATCH (n:OrderTmp)
SET n:Order
REMOVE n:OrderTmp;

// We will connect the Order to the respective Customer, Shipper and Employee
MATCH (o:Order)
MATCH (c:Customer WHERE c.CustomerID = o.CustomerID)
INSERT (o)-[:HAS_ORDER_CUSTOMER]->(c);

// We will create a ShipInfo Node to hold the shipment information and connect it to the Order and Shipper
//** NOTE **:  We could have normalized the ShipName into a separate Node, but we will keep it as a property of the ShipInfo Node for simplicity.
MATCH (n:Order)
MATCH (s:Shipper WHERE s.ShipperID = n.ShipVia)
INSERT (n)-[:HAS_SHIPMENT_INFO]->(i:ShipInfo {ShipName: n.ShipName, ShippedDate: n.ShippedDate, Freight: n.Freight}),
       (i)-[:HAS_SHIPPER]->(s)
SET i.ShippmentID = "SH-" || i._id;

// Connect each ShipInfo to the existing Address that matches the Order's ship-to fields.
// FIDELITY NOTE: in the Cypher v2.3.1 statement, the "create a new Address when none matches" branch could never run (it came after a non-optional MATCH
// on Address, so the rows with no match were already gone). With the fixed CSVs that leaves 55 of the 830 Orders with no HAS_SHIPMENT_ADDRESS.
// This port reproduces that behaviour so both databases match. The commented statement after this one is the fix, if you want it in both.
MATCH (n:Order)-[:HAS_SHIPMENT_INFO]->(i:ShipInfo)
MATCH (a:Address WHERE a.Address = n.ShipAddress AND a.City = n.ShipCity AND a.Region = n.ShipRegion AND a.PostalCode = n.ShipPostalCode AND a.Country = n.ShipCountry)
INSERT (i)-[:HAS_SHIPMENT_ADDRESS]->(a);

// OPTIONAL FIX (not in the Neo4j v2.3.1 script): give the remaining ShipInfo nodes their own Address.
// MATCH (n:Order)-[:HAS_SHIPMENT_INFO]->(i:ShipInfo)
// FILTER NOT EXISTS { MATCH (i)-[:HAS_SHIPMENT_ADDRESS]->() }
