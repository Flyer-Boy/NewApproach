//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// Recommendation Engine based on the Neo4j NorthWind Recommendation Engine GraphGist, adapted for the NorthWind Application Graph Data Model (GQL port).
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

//@@ BEGIN RECOMMENDATION

// Collaborative Filtering - Product Ratings by Customers
// Collaborative Filtering is a technique used by recommendation engines to recommend content based on feedback from other Customers.
// To do this, we can use the k-NN (k-nearest neighbors) algorithm. k-NN works by grouping items based on their similarity to each other.
// In our case, the similarity is based on ratings between two Customers for a Product.
// As a real-world example, this is how sites like Netflix can make recommendations based on ratings given to shows you have already watched.

// The first thing we need to do to make this model work is create some "rating relationships".
// For now, let's create a score between 0 and 1 for each Product based on the number of times a Customer has purchased that Product.
// (Cypher's ON CREATE SET is called ON INSERT SET in GQL.)
MATCH (c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_PRODUCT]->(p:Product)
RETURN c, count(p) AS Total
NEXT
MATCH (c)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_PRODUCT]->(p:Product)
RETURN c, Total, p, count(o) * 1.0 AS Orders
NEXT
MERGE (c)-[rated:RATED]->(p)
ON INSERT SET rated.Rating = Orders / Total
ON MATCH SET rated.Rating = Orders / Total
RETURN c.CompanyName AS Company, p.ProductName AS Product, Orders, Total, rated.Rating AS Rating
ORDER BY Rating DESC
LIMIT 10;

// Now that we have ratings between Customers and Products, we can start finding similarities between Customers based on their ratings.

// View a Customer's Ratings
MATCH (me:Customer)-[r:RATED]->(p:Product)
WHERE me.CustomerID = 'ANTON'
RETURN p.ProductName, r.Rating LIMIT 10;

// View a Customer's Ratings Compared with Other Customers
// (c2 <> c1 is explicit here: Cypher's relationship-uniqueness rule excluded it implicitly.)
MATCH (c1:Customer {CustomerID: 'ANTON'})-[r1:RATED]->(p:Product)<-[r2:RATED]-(c2:Customer)
WHERE c2.CustomerID <> c1.CustomerID
RETURN c1.CustomerID, c2.CustomerID, p.ProductName, r1.Rating, r2.Rating,
       CASE WHEN r1.Rating - r2.Rating < 0 THEN -(r1.Rating - r2.Rating) ELSE r1.Rating - r2.Rating END AS difference
ORDER BY difference ASC
LIMIT 15;

// Now we can calculate the similarity between Customers based on their ratings using Cosine Similarity.
// GQL port notes:
//  - SQRT(REDUCE(x=0.0, a IN COLLECT(r1.Rating) | x + a^2)) is the same number as sqrt(sum(r1.Rating ^ 2)), which is written directly here.
//  - Cypher's MERGE (c1)-[s:SIMILARITY]-(c2) was undirected: it stored ONE edge per pair of Customers, in whichever direction it met first.
//    GQLDB edges are always directed, so this keeps one edge per pair by only writing it from the lower CustomerID to the higher one,
//    and the two queries below read SIMILARITY in either direction. (In the Cypher version, those queries used -> and so only found about
//    half of each Customer's similar Customers.)
MATCH (c1:Customer)-[r1:RATED]->(p:Product)<-[r2:RATED]-(c2:Customer)
WHERE c1.CustomerID < c2.CustomerID
RETURN c1, c2,
       sum(r1.Rating * r2.Rating) AS dot_product,
       sqrt(sum(r1.Rating ^ 2)) AS r1_length,
       sqrt(sum(r2.Rating ^ 2)) AS r2_length
NEXT
MERGE (c1)-[s:SIMILARITY]->(c2)
SET s.Similarity = dot_product / (r1_length * r2_length);

// Now we can use the similarity scores to recommend Products to Customers based on what similar Customers have rated highly.
MATCH (me:Customer)-[r:SIMILARITY]-(them:Customer)
WHERE me.CustomerID = 'ANTON'
RETURN me.CompanyName, them.CompanyName, r.Similarity
ORDER BY r.Similarity DESC LIMIT 10;

// Finally, we can use the similarity scores to recommend Products to a Customer based on what similar Customers have rated highly.
// (Cypher's NOT ((me)-[:RATED*1..2]->(p)) can only ever match one RATED hop -- RATED goes Customer->Product -- so it is written as one hop.)
MATCH (me:Customer)-[:SIMILARITY]-(c:Customer)-[r:RATED]->(p:Product)
WHERE me.CustomerID = 'ANTON' AND NOT EXISTS { MATCH (me)-[:RATED]->(p) }
RETURN p, collect(r.Rating) AS AllRatings, collect(c.CompanyName) AS AllCustomers
NEXT
LET Ratings = AllRatings[0:1], Customers = AllCustomers[0:1]
LET Recommendation = round(reduce(s = 0, x IN Ratings | s + x) / size(Ratings), 5)
RETURN p.ProductName AS ProductName, Customers, Recommendation
ORDER BY Recommendation DESC
LIMIT 25;

//@@ END RECOMMENDATION


//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// Query Examples to Run Against the NorthWind Graph Data Model
// These are examples of queries that can be used to extract insights from the NorthWind Graph Data Model.
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

//@@ BEGIN EXAMPLES

// Total Amount of OrderID 10461
MATCH (o:Order {OrderID: "10461"})-[r:HAS_ORDER_PRODUCT]->(p:Product)
RETURN o.OrderID AS OrderID, sum(r.Quantity * r.UnitPrice) AS TotalAmmountOrder;

// Total Amount of OrderID 10461 broken down by Product
MATCH (o:Order {OrderID: "10461"})-[r:HAS_ORDER_PRODUCT]->(p:Product)
RETURN o.OrderID, p.ProductName, r.Quantity, r.UnitPrice, r.Quantity * r.UnitPrice AS AmmountByProduct
ORDER BY AmmountByProduct DESC;

// Top 25 Orders by Total Amount
MATCH (o:Order)-[r:HAS_ORDER_PRODUCT]->(p:Product)
RETURN o.OrderID AS OrderID, sum(r.Quantity * r.UnitPrice) AS TotalAmmountOrder
ORDER BY TotalAmmountOrder DESC
LIMIT 25;

// Top 10 Customers by Number of Orders
MATCH (c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)
RETURN c.CustomerID AS CustomerID, count(o) AS NumberOfOrders
ORDER BY NumberOfOrders DESC
LIMIT 10;

// Top 10 Employees by Number of Orders Sold
MATCH (p:Person)<-[]-(e:Employee)<-[:SOLD_BY]-(o:Order)
RETURN e.EmployeeID AS EmployeeID, p.FirstName AS FirstName, p.LastName AS LastName, count(o) AS NumberOfOrdersSold
ORDER BY NumberOfOrdersSold DESC
LIMIT 10;

// Employees by Average Discount Given
MATCH (n)<-[:HAS_PERSON]-(e:Employee)<-[:SOLD_BY]-(o:Order)-[details:HAS_ORDER_PRODUCT]->(:Product)
RETURN n.FirstName AS FirstName, n.LastName AS LastName, e.EmployeeID AS EmployeeID,
       round(avg(details.Discount), 4) AS AverageDiscount,
       count(details) AS LinesSold
ORDER BY AverageDiscount DESC;

// Total Sales by Region
MATCH (r:Regions)-[:HAS_TERRITORY]->(t:Territory)-[:HAS_EMPLOYEE]->(e:Employee)<-[:SOLD_BY]-(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)
RETURN r.RegionID AS RegionID, r.RegionDescription AS RegionDescription, sum(details.Quantity * details.UnitPrice) AS TotalSales
ORDER BY TotalSales DESC;

// Total Sales by Region and Territory
MATCH (r:Regions)-[:HAS_TERRITORY]->(t:Territory)-[:HAS_EMPLOYEE]->(e:Employee)<-[:SOLD_BY]-(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)
RETURN r.RegionID AS RegionID, r.RegionDescription AS RegionDescription, t.TerritoryDescription AS TerritoryDescription,
       sum(details.Quantity * details.UnitPrice) AS TotalSales
ORDER BY TotalSales DESC;

// Total Sales by Category
MATCH (cat:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p:Product)<-[details:HAS_ORDER_PRODUCT]-(o:Order)
RETURN cat.CategoryName AS CategoryName, sum(details.Quantity * details.UnitPrice) AS TotalSales
ORDER BY TotalSales DESC;

// Total Sales by Employee
MATCH (s:Person)<-[]-(e:Employee)<-[:SOLD_BY]-(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)
RETURN e.EmployeeID AS EmployeeID, s.FirstName AS FirstName, s.LastName AS LastName, sum(details.Quantity * details.UnitPrice) AS TotalSales
ORDER BY TotalSales DESC;

// Total Product Orders, Stock Available, and Supply Orders
MATCH (u)<-[:HAS_SUPPLY_ORDER]-(p:Product)-[:HAS_INVENTORY_LEVEL]->(s:InventoryLevel), (o:Order)-[details:HAS_ORDER_PRODUCT]->(p)
RETURN p.ProductID AS ProductID, p.ProductName AS ProductName, sum(details.Quantity) AS TotalOrdered, s.UnitsInStock AS StockAvailable, u.UnitsOnOrder AS SupplyOrders
ORDER BY TotalOrdered DESC;

// Top 5 Products by Number of Orders
MATCH (c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_PRODUCT]->(p:Product)
RETURN c.CompanyName AS CompanyName, p.ProductName AS ProductName, count(o) AS orders
ORDER BY orders DESC
LIMIT 5;

// Products Never Ordered by a Customer
MATCH (p:Product)
WHERE NOT EXISTS { MATCH (p)<-[:HAS_ORDER_PRODUCT]-(:Order) }
RETURN p.ProductName;

// Products Currently Below Restock Threshold, with their Supplier
MATCH (p:Product)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel), (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel), (p)-[:HAS_PRODUCT_SUPPLIER]->(s:Supplier)
WHERE i.UnitsInStock <= r.StockThreshold
RETURN p.ProductName, i.UnitsInStock AS UnitsInStock, r.StockThreshold, s.CompanyName AS Supplier
ORDER BY UnitsInStock ASC;

// At-Risk Products -- below Restock Threshold with NO Purchase Order currently in flight to resupply them
MATCH (p:Product)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel), (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel)
WHERE i.UnitsInStock <= r.StockThreshold
OPTIONAL MATCH (po:PurchaseOrder)-[:HAS_PO_ITEM]->(p)
  WHERE EXISTS { MATCH (po)<-[:IS_NEW_PO_STATE]-(:NewPoS) } OR EXISTS { MATCH (po)<-[:IS_APPROVED_PO_STATE]-(:ApprovedPoS) } OR EXISTS { MATCH (po)<-[:IS_SUBMITTED_PO_STATE]-(:SubmittedPoS) }
RETURN p, i, r, count(po) AS InFlightPOs
NEXT
FILTER InFlightPOs = 0
RETURN p.ProductName AS ProductName, i.UnitsInStock AS UnitsInStock, r.StockThreshold AS StockThreshold
ORDER BY UnitsInStock ASC;

// Supplier Reliability -- RFQ Rejection Rate
// (Cypher counted CASE WHEN <pattern> ...; here the rejection edge is OPTIONAL MATCHed and counted -- same numbers.)
MATCH (s:Supplier)<-[:RFQ_FROM_SUPPLIER]-(rfq:RFQ)
OPTIONAL MATCH (rfq)<-[rej:IS_SUPPLIER_REJECTED_RFQ_STATE]-()
RETURN s, count(DISTINCT rfq) AS TotalRFQs, count(DISTINCT rej) AS RejectedRFQs
NEXT
FILTER TotalRFQs > 0
RETURN s.CompanyName AS CompanyName, TotalRFQs, RejectedRFQs, round(100.0 * RejectedRFQs / TotalRFQs, 1) AS RejectionRatePct
ORDER BY RejectionRatePct DESC;

// PO Rejection Value by Approval Level -- where is procurement friction concentrated?
MATCH (po:PurchaseOrder)-[r:HAS_L1_PO_REJECTION|HAS_L2_PO_REJECTION|HAS_L3_PO_REJECTION]->(:Employee), (po)-[poi:HAS_PO_ITEM]->(p:Product)
RETURN type(r) AS RejectionLevel, po, sum(poi.POqt * (p.UnitPrice * poi.POPriceDiscount)) AS POCost
NEXT
RETURN RejectionLevel, count(DISTINCT po) AS RejectedPOs, round(sum(POCost), 2) AS TotalRejectedValue
ORDER BY TotalRejectedValue DESC;

// Approval Workload by Employee -- who is doing the most PO/RFQ vetting?
MATCH (p)<-[:HAS_PERSON]-(e:Employee)<-[r:HAS_L1_PO_APPROVAL|HAS_L2_PO_APPROVAL|HAS_L3_PO_APPROVAL|HAS_L1_PO_REJECTION|HAS_L2_PO_REJECTION|HAS_L3_PO_REJECTION|HAS_BUYER_RFQ_APPROVAL|HAS_BUYER_RFQ_REJECTION]-()
RETURN e.EmployeeID AS EmployeeID, p.FirstName AS FirstName, count(r) AS ActionsTaken
ORDER BY ActionsTaken DESC;

// Open Customer Orders currently blocked, waiting on Product Inventory to fulfill
MATCH (:OrderStatusOpeN)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel), (o)-[:HAS_ORDER_CUSTOMER]->(c:Customer)
RETURN c, o, collect({ProductName: p.ProductName, Ordered: details.Quantity, InStock: inv.UnitsInStock, Shortfall: details.Quantity - inv.UnitsInStock}) AS lines
NEXT
LET blockingProducts = [line IN lines WHERE line.Shortfall > 0]
FILTER size(blockingProducts) > 0
RETURN c.CompanyName AS Customer, o.OrderID AS OrderID, o.OrderDate AS OrderDate, duration_between(local_datetime(), o.OrderDate) AS TimeWaiting, blockingProducts
ORDER BY OrderDate ASC;

// Top Products by Total Quantity Ordered to Date, and the Customer that ordered the most of that Product
MATCH (:OrderStatusFulfilleD)-[]->(o)-[r1:HAS_ORDER_PRODUCT]->(p), (o)-[:HAS_ORDER_CUSTOMER]-(c)
RETURN p, c, sum(r1.Quantity) AS qty
NEXT
RETURN p, max(qty) AS maxQty
NEXT
MATCH (:OrderStatusFulfilleD)-[]->(o2)-[r2:HAS_ORDER_PRODUCT]->(p), (o2)-[:HAS_ORDER_CUSTOMER]-(c2)
RETURN p, maxQty, c2, sum(r2.Quantity) AS qty2
NEXT
FILTER qty2 = maxQty
RETURN p.ProductName AS Product, maxQty AS QuantityOrderedToDate, c2.CompanyName AS CustomerName
ORDER BY QuantityOrderedToDate DESC;

// Top 10 Customers that ordered the most of each Product
// (Relies on collect() keeping the ORDER BY order, as the Cypher version did.)
MATCH (:OrderStatusFulfilleD)-[]->(o)-[r1:HAS_ORDER_PRODUCT]->(p), (o)-[:HAS_ORDER_CUSTOMER]-(c)
RETURN p, c, sum(r1.Quantity) AS qty
NEXT
ORDER BY p.ProductName, qty DESC
RETURN p, collect({CustomerName: c.CompanyName, QuantityOrderedToDate: qty}) AS buyers
NEXT
FOR buyer IN buyers[0:10]
RETURN p.ProductName AS Product, buyer.QuantityOrderedToDate AS QuantityOrderedToDate, buyer.CustomerName AS CustomerName
ORDER BY Product, QuantityOrderedToDate DESC;

// Open Customer Orders waiting time (short query to see how long Orders have been waiting to be fulfilled)
MATCH (:OrderStatusOpeN)-[]->(o:Order)-[]->(c:Customer)
RETURN o.OrderID, c.CompanyName AS Customer, o.OrderDate AS OrderDate, duration_between(local_datetime(), o.OrderDate) AS TimeWaiting;

// Fulfilled Customer Orders - Time to Fulfill
MATCH (:OrderStatusFulfilleD)-[f]->(o:Order)-[]->(c:Customer)
RETURN o.OrderID, c.CompanyName AS Customer, o.OrderDate AS OrderDate, duration_between(f.FulfillDate, o.OrderDate) AS TimeToFulfill
ORDER BY TimeToFulfill DESC;

// Available Products Urgently Needed to Fulfill Blocked Customer Orders (Might influence vetting proecess of new Purchase Orders and/or RFQ's)
MATCH (:OrderStatusOpeN)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel), (p)<-[:IS_AVAILABLE_PRODUCT]-(a:ProductStatusAvailablE)
WHERE details.Quantity > inv.UnitsInStock
RETURN p, inv, count(DISTINCT o) AS BlockedOrders, sum(details.Quantity - inv.UnitsInStock) AS TotalUnitsShort
NEXT
OPTIONAL MATCH (po:PurchaseOrder)-[:HAS_PO_ITEM]->(p)
  WHERE EXISTS { MATCH (po)<-[:IS_NEW_PO_STATE]-(:NewPoS) } OR EXISTS { MATCH (po)<-[:IS_APPROVED_PO_STATE]-(:ApprovedPoS) } OR EXISTS { MATCH (po)<-[:IS_SUBMITTED_PO_STATE]-(:SubmittedPoS) }
RETURN p, inv, BlockedOrders, TotalUnitsShort, count(po) AS POsAlreadyInFlight
NEXT
RETURN p.ProductName AS ProductName, inv.UnitsInStock AS UnitsInStock, BlockedOrders, TotalUnitsShort, POsAlreadyInFlight
ORDER BY TotalUnitsShort DESC;

// Full Resubmission Lineage -- how many times has a Purchase Order's line item journey been rejected and resubmitted?
// This is the kind of query that needs a recursive CTE (or isn't supported at all) in most relational databases --
// here it's a one-line variable-length path traversal. (Cypher *1.. is GQL {1,}; "chain" is bound to the list of edges, so size(chain) is the path length.)
MATCH (latest:PurchaseOrder)-[chain:HAS_PREVIOUS_PO]->{1,}(original:PurchaseOrder)
WHERE NOT EXISTS { MATCH ()-[:HAS_PREVIOUS_PO]->(latest) }
RETURN latest.PONumber AS CurrentPO, original.PONumber AS OriginalPO, size(chain) AS TimesRejectedAndResubmitted
ORDER BY TimesRejectedAndResubmitted DESC;

// Full Context Trace for a single Purchase Order -- everything within 2 hops (edit PONumber).
// Run this one on the Graph console: it visually shows every Employee, Supplier, RFQ, Product, and
// state Collection touching one PO, without a single JOIN or ETL step -- the graph IS the answer.
MATCH path = (po:PurchaseOrder {PONumber: "PO-XXXXXXX"})-[]-{1,2}(connected)
RETURN path;

// Product Recommendation for Customers Based on the Most-Ordered Products by Other Customers (if you ran the Recommendation Engine commands earlier )
// (o2 <> o is explicit here: Cypher's relationship-uniqueness rule excluded it implicitly.)
MATCH (c:Customer)<-[:HAS_ORDER_CUSTOMER]-(o:Order)-[:HAS_ORDER_PRODUCT]->(p:Product)<-[:HAS_ORDER_PRODUCT]-(o2:Order)-[:HAS_ORDER_PRODUCT]->(p2:Product)<-[:IS_PRODUCT_CATEGORY_OF]-(:ProductCategorY)-[:IS_PRODUCT_CATEGORY_OF]->(p)
WHERE c.CustomerID = 'ANTON' AND o2.OrderID <> o.OrderID
  AND NOT EXISTS { MATCH (c)<-[:HAS_ORDER_CUSTOMER]-(:Order)-[:HAS_ORDER_PRODUCT]->(p2) }
RETURN c.CompanyName AS CompanyName, p.ProductName AS has_purchased, p2.ProductName AS has_also_purchased, count(DISTINCT o2) AS occurrences
ORDER BY occurrences DESC
LIMIT 5;

// The Inventory Level Report
// To visualize the Product's Inventory Levels, Supply Orders (RFQ Approved) pending fulfillment, Stock Threshold, Open Customer Orders,
// and Open PO's to resupply from Today on the Graph console, use the following query:
  // Product Supply/Demand Dashboard -- one row per Product, ordered by name
  MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel),
        (p)-[:HAS_REORDER_LEVEL]->(r:ReorderLevel),
        (p)-[:HAS_SUPPLY_ORDER]->(suo:OrderLevel)
  // Open Customer Order demand for this Product
  OPTIONAL MATCH (:OrderStatusOpeN)-[:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(p)
  RETURN p, inv, r, suo,
         count(DISTINCT o) AS OpenCustomerOrders,
         coalesce(sum(details.Quantity), 0) AS QtyDemanded
  NEXT
  // Quantity confirmed by an approved RFQ, not yet delivered by the Warehouse
  OPTIONAL MATCH (po:PurchaseOrder)-[:HAS_APPROVED_RFQ]->(:RFQ)-[rfi:HAS_RFQ_ITEM]->(p)
    WHERE NOT EXISTS { MATCH (po)-[:HAS_WAREHOUSE_DELIVERY]->() }
  RETURN p, inv, r, suo, OpenCustomerOrders, QtyDemanded,
         coalesce(sum(rfi.RFQqt), 0) AS QtyApprovedRFQPendingDelivery
  NEXT
  // Quantity requested via an open PO that does NOT yet have an approved RFQ
  // (excluded here to avoid double-counting the same units already captured above)
  OPTIONAL MATCH (po2:PurchaseOrder)-[poi2:HAS_PO_ITEM]->(p)
    WHERE (EXISTS { MATCH (po2)<-[:IS_NEW_PO_STATE]-(:NewPoS) }
        OR EXISTS { MATCH (po2)<-[:IS_APPROVED_PO_STATE]-(:ApprovedPoS) }
        OR EXISTS { MATCH (po2)<-[:IS_SUBMITTED_PO_STATE]-(:SubmittedPoS) })
      AND NOT EXISTS { MATCH (po2)-[:HAS_APPROVED_RFQ]->(:RFQ) }
  RETURN p, inv, r, suo, OpenCustomerOrders, QtyDemanded, QtyApprovedRFQPendingDelivery,
         coalesce(sum(poi2.POqt), 0) AS QtyOpenPOsNotYetConfirmed
  NEXT
  RETURN p.ProductName AS ProductName,
         inv.UnitsInStock AS UnitsInStock,
         r.StockThreshold AS StockThreshold,
         suo.UnitsOnOrder AS UnitsOnOrder_Tracked,
         QtyApprovedRFQPendingDelivery AS QtyApprovedRFQPendingDelivery,
         QtyOpenPOsNotYetConfirmed AS QtyOpenPOsNotYetConfirmed,
         (QtyApprovedRFQPendingDelivery + QtyOpenPOsNotYetConfirmed) AS TotalIncomingQty,
         OpenCustomerOrders AS OpenCustomerOrders,
         QtyDemanded AS QtyDemanded
  ORDER BY ProductName;

// Check for Open Orders that can be fulfilled (all lines have sufficient stock) and return the first 100 of them, ordered by OrderID and OrderDate.
// This is part of the Order Fulfillment process, where the Warehouse Clerk will fulfill Open Customer Orders that have sufficient stock
// for every Product line, ship them, and update the Inventory Levels accordingly.
// FIDELITY NOTE: the Cypher version grouped by (details, inv, op, p, r, o) -- i.e. per LINE, not per Order -- so TotalLines was always 1 and it really listed
// every open line that has stock. The first statement reproduces that; the second (commented) one is the per-Order check its comment describes.
MATCH (op:OrderStatusOpeN {Status: "Open"})-[r:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
WHERE inv.UnitsInStock >= details.Quantity
RETURN o.OrderID AS OrderID, o.OrderDate AS OrderDate, p.ProductName AS ProductName, inv.UnitsInStock AS UnitsInStock, details.Quantity AS Quantity
ORDER BY OrderID, OrderDate LIMIT 100;
// MATCH (op:OrderStatusOpeN {Status: "Open"})-[:IS_OPEN_ORDER_STATE]->(o:Order)-[details:HAS_ORDER_PRODUCT]->(:Product)-[:HAS_INVENTORY_LEVEL]->(inv:InventoryLevel)
// RETURN o, count(details) AS TotalLines, sum(CASE WHEN inv.UnitsInStock >= details.Quantity THEN 1 ELSE 0 END) AS LinesWithStock
// NEXT
// FILTER TotalLines = LinesWithStock
// RETURN o.OrderID AS OrderID, o.OrderDate AS OrderDate, TotalLines ORDER BY OrderID, OrderDate LIMIT 100;

// PO Creation - TEST QUERY -- no writes, inspect the reorder logic per product
// This is the logic that the PO Creation process uses to determine if a Product needs to be reordered and how much to order.
MATCH (s:Supplier)-[:SUPPLIES]->(p:Product)<-[:IS_AVAILABLE_PRODUCT]-(a:ProductStatusAvailablE),
      (r:ReorderLevel)<-[:HAS_REORDER_LEVEL]-(p)-[:HAS_INVENTORY_LEVEL]->(i:InventoryLevel)
OPTIONAL MATCH (activePO:PurchaseOrder)-[poi2:HAS_PO_ITEM]->(p)
  WHERE EXISTS { MATCH (activePO)<-[:IS_NEW_PO_STATE]-(:NewPoS) }
     OR EXISTS { MATCH (activePO)<-[:IS_APPROVED_PO_STATE]-(:ApprovedPoS) }
     OR EXISTS { MATCH (activePO)<-[:IS_SUBMITTED_PO_STATE]-(:SubmittedPoS) }
RETURN s, p, r, i, sum(coalesce(poi2.POqt, 0)) AS AlreadyPendingQty
NEXT
OPTIONAL MATCH (p)<-[op:HAS_ORDER_PRODUCT]-(:Order)<-[:IS_OPEN_ORDER_STATE]-()
RETURN s, p, r, i, AlreadyPendingQty, sum(coalesce(op.Quantity, 0)) AS OpenOrderQty
NEXT
LET EffectiveAvailable = i.UnitsInStock + AlreadyPendingQty - OpenOrderQty
RETURN
  p.ProductID AS ProductID,
  p.ProductName AS ProductName,
  s.SupplierID AS SupplierID,
  i.UnitsInStock AS UnitsInStock,
  AlreadyPendingQty,
  OpenOrderQty,
  EffectiveAvailable,
  r.StockThreshold AS StockThreshold,
  (EffectiveAvailable - (r.StockThreshold * 0.5) <= r.StockThreshold) AS WouldTriggerReorder,
  (r.StockThreshold - EffectiveAvailable + (r.StockThreshold * 2)) AS WouldOrderQty
ORDER BY WouldTriggerReorder DESC, ProductID;

//** Inventory concurrency test **
// Run the Python script that fulfills Open Customer Orders (python NorthwindPlus_Stress_Test_Ultipa.py --loop order-fulfillment --rate 4 &) in multiple windows to see how the system handles concurrent fulfillment of the same Order.
// As it runs, run the following query to see if the stock levels are being updated correctly and no one goes below zero.

//Products with Low (<10) Inventory
MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(i) WHERE i.UnitsInStock < 10 RETURN p.ProductName, i.UnitsInStock;

// If too many products are below 10 units in stock, you can run the following query to restock them (for demonstration purposes only).
// Cheat the system  - Increment the stock of all products by 50 units to simulate a restock event (for demonstration purposes).
MATCH ()-[:IS_AVAILABLE_PRODUCT]->(p:Product)-[:HAS_INVENTORY_LEVEL]->(i) SET i.UnitsInStock = i.UnitsInStock + 50;


// Visualize the schema (Cypher: CALL db.schema.visualization() -- GQLDB lists the labels instead)
SHOW NODE LABELS;
SHOW EDGE LABELS;

//**PO Vetting concurency test**
// Try running multiple instances of the PO Vetting process (the Python script) at the same time to see how the system handles concurrent vetting of the same PO.

// Before you begin, run this query to see how many PO's are on each state:
MATCH p = (n:PoS)-[]->()-[]->() RETURN p;

// Run the Vetting process (python NorthwindPlus_Stress_Test_Ultipa.py --loop po-vetting --rate 4 &) in multiple windows
// While it runs, run the following query to see the PO's and their Approve/Rejection state -
// there should not be any PO's that are in the same or conflicting state (Approved or Rejected) at the same time.

// PO Vetting status by PONumber and Vetting Date
MATCH (po:PurchaseOrder)-[r]->(e:Employee)<-[:IS_ACTIVE_ROLE]-(role)
WHERE type(r) IN ['HAS_L1_PO_REJECTION', 'HAS_L2_PO_REJECTION', 'HAS_L3_PO_REJECTION',
                  'HAS_L1_PO_APPROVAL', 'HAS_L2_PO_APPROVAL', 'HAS_L3_PO_APPROVAL']
RETURN po.PONumber AS PONumber,
       CASE WHEN ends_with(type(r), 'REJECTION') THEN 'Rejected on' ELSE 'Approved on' END AS State,
       r.Date AS VettingDate,
       ' by ' AS Who,
       e.Email AS Employee,
       role.Title AS Title
ORDER BY PONumber, VettingDate ASC;

// Total Units Ordered from Suppliers, Total Amount Paid to Suppliers, Total Units Sold, Total Revenue, and Gross Profit
CALL {
  MATCH (po:PurchaseOrder)-[i:HAS_PO_ITEM]-(p)
  RETURN sum(i.POqt) AS UnitsOrderedFromSuppliers,
         sum(i.POqt * i.POPriceDiscount * p.UnitPrice) AS AmountPaidToSuppliers
}
CALL {
  MATCH (o:Order)-[i:HAS_ORDER_PRODUCT]-(p)
  RETURN sum(i.Quantity) AS UnitsSold,
         sum(i.Quantity * p.UnitPrice) AS Revenue
}
RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
       Revenue - AmountPaidToSuppliers AS GrossProfit;

// Total Units Ordered from Suppliers (fulfilled), Total Amount Paid to Suppliers, Total Units Sold (fulfilled), Total Revenue, and Gross Profit
CALL {
  MATCH ()-[:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_APPROVED_RFQ]-()-[i:HAS_RFQ_ITEM]-(p)
  RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers,
         sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers
}
CALL {
  MATCH ()-[:IS_FULFILLED_ORDER_STATE]->(o:Order)-[i:HAS_ORDER_PRODUCT]-(p)
  RETURN sum(i.Quantity) AS UnitsSold,
         sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue
}
RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
       Revenue - AmountPaidToSuppliers AS GrossProfit;


// Total Units Ordered from Suppliers (fulfilled), Total Amount Paid to Suppliers, Total Units Sold (fulfilled), Total Revenue, and Gross Profit for the last 1 hour
// (to be run during the simulation)
// FIDELITY NOTE: the Cypher version filtered IS_FULFILLED_ORDER_STATE on r2.Date, but that edge stores FulfillDate (it has no Date property),
// so its sales side always returned nothing. This port uses r2.FulfillDate.
CALL {
  MATCH ()-[r1:IS_CLOSED_PO_STATE]->(po:PurchaseOrder)-[:HAS_APPROVED_RFQ]-()-[i:HAS_RFQ_ITEM]-(p)
  WHERE date_diff(local_datetime(), r1.Date, "second") <= 3600
  RETURN sum(i.RFQqt) AS UnitsOrderedFromSuppliers,
         sum(i.RFQqt * i.RFQcost) AS AmountPaidToSuppliers
}
CALL {
  MATCH ()-[r2:IS_FULFILLED_ORDER_STATE]->(o:Order)-[i:HAS_ORDER_PRODUCT]-(p)
  WHERE date_diff(local_datetime(), r2.FulfillDate, "second") <= 3600
  RETURN sum(i.Quantity) AS UnitsSold,
         sum(i.Quantity * (i.UnitPrice - (i.Discount * i.UnitPrice))) AS Revenue
}
RETURN UnitsSold, Revenue, UnitsOrderedFromSuppliers, AmountPaidToSuppliers,
       Revenue - AmountPaidToSuppliers AS GrossProfit;

// Outgoing vs. Incoming edges for all nodes in the graph, ordered by IncomingCount descending.
// This is a good way to see which nodes are the most connected and which nodes are the most important in the graph. Supernodes
MATCH (n)
OPTIONAL MATCH (n)-[r_out]->()
OPTIONAL MATCH (n)<-[r_in]-()
RETURN n AS Node,
       properties(n) AS Properties,
       count(DISTINCT r_out) AS OutgoingCount,
       count(DISTINCT r_in) AS IncomingCount
ORDER BY IncomingCount DESC;

// Nodes to Edges ratio
MATCH (n)
RETURN count(n) AS totalNodes
NEXT
MATCH ()-[r]->()
RETURN totalNodes, count(r) AS totalEdges
NEXT
RETURN
  totalNodes,
  totalEdges,
  CASE
    WHEN totalEdges = 0 THEN null
    ELSE "1:" || to_string(totalEdges / to_float(totalNodes))
  END AS NodesToEdgesRatio;


//--------------------------------------------------------------------------------------------------------------------------------------------------------------//
// ** Inconsistencies and Data Quality Checks after the simulation **
//--------------------------------------------------------------------------------------------------------------------------------------------------------------//

// Find duplicate relationships between nodes (same type of relationship between the same two nodes - should not happen)
// This is a good way to find inconsistencies in the graph data model after the simulation of the NorthWind Application Graph Data Model.
MATCH (a)-[r]->(b)
RETURN a, b, type(r) AS relType, count(r) AS cnt, collect(r) AS rels
NEXT
FILTER cnt > 1
RETURN a, b, relType, cnt, rels
ORDER BY cnt DESC;

// Find Purchase Orders that have more than one active state (should not happen) - alternative query
// (The Cypher file had two versions of this check -- UNWIND + CALL, and a 14-branch UNION ALL. Both reduce to this single statement.)
MATCH (a)-[r]->(b)
FILTER type(r) IN ["IS_NEW_PO_STATE", "IS_APPROVED_PO_STATE", "IS_SUBMITTED_PO_STATE", "IS_REJECTED_PO_STATE",
                   "IS_CLOSED_PO_STATE", "IS_SUPPLIER_OPEN_PO_STATE", "IS_SUPPLIER_NEW_PO_STATE",
                   "HAS_WAREHOUSE_DELIVERY", "HAS_FINANCE_PAYMENT", "IS_OPEN_ORDER_STATE",
                   "IS_FULFILLED_ORDER_STATE", "HAS_SHIPMENT_INFO", "IS_SUPPLIER_NEW_RFQ",
                   "IS_SUPPLIER_REJECTED_RFQ_STATE"]
RETURN a, b, type(r) AS relType, count(r) AS cnt
NEXT
FILTER cnt > 1
RETURN a, b, relType, cnt
ORDER BY cnt DESC;

// Find Purchase Orders that have been approved and rejected at the same time by the same Employee (should not happen)
MATCH pathl1 = (e)<-[:HAS_L1_PO_APPROVAL]-(po:PurchaseOrder)-[:HAS_L1_PO_REJECTION]->(e2)
RETURN "L1" AS Level, po.PONumber AS PONumber, pathl1 AS InconsistentPath
UNION ALL
MATCH pathl2 = (e)<-[:HAS_L2_PO_APPROVAL]-(po:PurchaseOrder)-[:HAS_L2_PO_REJECTION]->(e2)
RETURN "L2" AS Level, po.PONumber AS PONumber, pathl2 AS InconsistentPath
UNION ALL
MATCH pathl3 = (e)<-[:HAS_L3_PO_APPROVAL]-(po:PurchaseOrder)-[:HAS_L3_PO_REJECTION]->(e2)
RETURN "L3" AS Level, po.PONumber AS PONumber, pathl3 AS InconsistentPath;

// Find Purchase Orders that have more than one active state (should not happen)
// (Cypher count{ pattern } -> VALUE { MATCH pattern RETURN count(*) })
MATCH (po:PurchaseOrder)
LET isNew       = VALUE { MATCH (po)<-[:IS_NEW_PO_STATE]-()      RETURN count(*) },
    isApproved  = VALUE { MATCH (po)<-[:IS_APPROVED_PO_STATE]-()  RETURN count(*) },
    isSubmitted = VALUE { MATCH (po)<-[:IS_SUBMITTED_PO_STATE]-() RETURN count(*) },
    isRejected  = VALUE { MATCH (po)<-[:IS_REJECTED_PO_STATE]-()  RETURN count(*) },
    isClosed    = VALUE { MATCH (po)<-[:IS_CLOSED_PO_STATE]-()    RETURN count(*) }
LET activeStates = (CASE WHEN isNew > 0 THEN 1 ELSE 0 END + CASE WHEN isApproved > 0 THEN 1 ELSE 0 END
                  + CASE WHEN isSubmitted > 0 THEN 1 ELSE 0 END + CASE WHEN isRejected > 0 THEN 1 ELSE 0 END
                  + CASE WHEN isClosed > 0 THEN 1 ELSE 0 END)
FILTER activeStates <> 1
RETURN po.PONumber AS PONumber, isNew, isApproved, isSubmitted, isRejected, isClosed, activeStates
ORDER BY activeStates DESC;

// Find Inventory Levels that are below zero (should not happen)
MATCH (i:InventoryLevel) WHERE i.UnitsInStock < 0
RETURN i.UnitsInStock AS UnitsInStock, i;

// Find Supply Orders that are below zero (should not happen)
MATCH (p:Product)-[:HAS_SUPPLY_ORDER]-(suo)
WHERE suo.UnitsOnOrder < 0
RETURN p.ProductID AS ProductID, suo.UnitsOnOrder AS UnitsOnOrder;

// Find Open Orders that have been fulfilled (should not happen)
MATCH (o:Order)
LET isOpen      = VALUE { MATCH (o)<-[:IS_OPEN_ORDER_STATE]-()      RETURN count(*) },
    isFulfilled = VALUE { MATCH (o)<-[:IS_FULFILLED_ORDER_STATE]-() RETURN count(*) }
FILTER (isOpen > 0 AND isFulfilled > 0) OR isFulfilled > 1
RETURN o.OrderID AS OrderID, isOpen, isFulfilled;

// Find Purchase Orders that have been paid but not yet delivered (should not happen)
MATCH (po:PurchaseOrder)-[:HAS_FINANCE_PAYMENT]->()
WHERE NOT EXISTS { MATCH (po)-[:HAS_WAREHOUSE_DELIVERY]->() }
RETURN po.PONumber AS PONumber;

// GQLDB-only check (added by this port): the Python harness bumps PurchaseOrder/RFQ/Order.OCCVersion to make concurrent transactions conflict.
// A high OCCVersion on a node shows it was contended. Remove this if you set OCC_TOUCH = False in the harness.
MATCH (n:PurchaseOrder|RFQ|Order)
WHERE n.OCCVersion IS NOT NULL
RETURN labels(n) AS Label, count(n) AS NodesTouched, max(n.OCCVersion) AS MaxVersion
ORDER BY NodesTouched DESC;

