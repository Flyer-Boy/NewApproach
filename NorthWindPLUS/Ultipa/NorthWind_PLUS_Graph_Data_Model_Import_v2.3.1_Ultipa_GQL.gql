//-- Including Order Details in the Relationship --//
// We will import the Order Details and connect them to the respective Order and Product
LOAD CSV FROM 'https://raw.githubusercontent.com/Flyer-Boy/NewApproach/refs/heads/main/NorthWindPLUS/Import/order-details.csv' WITH HEADER
INTO StgOrderDetail MAPPING (OrderID: 'OrderID', ProductID: 'ProductID', UnitPrice: 'UnitPrice' AS FLOAT, Quantity: 'Quantity' AS INT, Discount: 'Discount' AS FLOAT);

// GQLDB port note: done in batches of 250 rows. Each batch links the order lines and deletes the staging rows it used, so it can never
// create a line twice, and a batch that finds no staging rows left does nothing. In one statement, the 2,155-row join took ~58s,
// right at the ~60s gateway limit (HTTP 504) of a cloud instance on port 443. 10 batches cover up to 2,500 rows.
// Check afterwards: MATCH (r:StgOrderDetail) RETURN count(r) must be 0 (if not, run the batch statement again).
MATCH (r:StgOrderDetail)
LIMIT 250
MATCH (o:Order WHERE o.OrderID = r.OrderID)
MATCH (p:Product WHERE p.ProductID = r.ProductID)
INSERT (o)-[ins_e1:HAS_ORDER_PRODUCT {Quantity: r.Quantity, UnitPrice: r.UnitPrice, Discount: r.Discount}]->(p)
DETACH DELETE r;

MATCH (r:StgOrderDetail)
LIMIT 250
